<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>King Gavin Lanes</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111827;
    color: white;
    transition: background 0.5s;
}

/* =========================
   WELCOME SCREEN
========================= */

#welcomeScreen {
    position: fixed;
    inset: 0;
    background: #080b12;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 9999;
    transition: opacity 2s ease;
}

#welcomeScreen.hidden {
    opacity: 0;
    pointer-events: none;
}

.welcome-content h1 {
    font-size: clamp(38px, 7vw, 75px);
    margin: 0;
}

.welcome-content p {
    font-size: 22px;
    color: #9ca3af;
    margin-top: 15px;
}

/* =========================
   HEADER
========================= */

header {
    height: 72px;
    background: #080b12;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    font-size: 27px;
    font-weight: bold;
}

.menu-button {
    background: #2563eb;
    color: white;

    border: none;
    border-radius: 9px;

    padding: 13px 21px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

/* =========================
   MENU
========================= */

.menu {
    display: none;

    position: absolute;

    right: 20px;
    top: 68px;

    width: 250px;

    background: #1f2937;

    border: 1px solid #374151;

    border-radius: 12px;

    padding: 8px;

    z-index: 500;
}

.menu.open {
    display: block;
}

.menu button {
    width: 100%;

    background: transparent;
    color: white;

    border: none;

    text-align: left;

    padding: 15px;

    border-radius: 8px;

    font-size: 17px;

    cursor: pointer;
}

.menu button:hover {
    background: #374151;
}

.menu .end {
    color: #f87171;
}

.menu .back {
    border-bottom: 1px solid #374151;
    margin-bottom: 5px;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1450px;
    margin: auto;
    padding: 40px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

h1 {
    font-size: 40px;
    margin-top: 0;
}

/* =========================
   PLAYER SETUP
========================= */

.setup-box {
    max-width: 650px;

    background: #1f2937;

    border-radius: 14px;

    padding: 25px;
}

.name-input {
    width: 100%;

    padding: 15px;

    border-radius: 9px;

    border: 1px solid #4b5563;

    background: #111827;

    color: white;

    font-size: 17px;
}

.primary-button {
    margin-top: 12px;

    background: #2563eb;
    color: white;

    border: none;

    border-radius: 9px;

    padding: 14px 20px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.start-button {
    background: #16a34a;
}

.player-list {
    margin-top: 20px;

    display: flex;
    flex-direction: column;

    gap: 9px;
}

.player {
    display: flex;

    align-items: center;
    justify-content: space-between;

    background: #111827;

    padding: 14px;

    border-radius: 9px;
}

.player-name {
    font-size: 18px;
    font-weight: bold;
}

.remove-player {
    background: #dc2626;

    color: white;

    border: none;

    border-radius: 7px;

    padding: 9px 13px;

    cursor: pointer;
}

/* =========================
   PLAYER SELECTOR
========================= */

.player-selector {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 20px;
}

.player-select {
    background: #1f2937;

    border: 2px solid #374151;

    color: white;

    border-radius: 8px;

    padding: 11px 16px;

    cursor: pointer;

    font-weight: bold;
}

.player-select.active {
    border-color: #2563eb;
    background: #1e40af;
}

/* =========================
   SCOREBOARD
========================= */

.score-title {
    display: flex;

    align-items: center;
    justify-content: space-between;

    flex-wrap: wrap;

    gap: 10px;
}

.current-player {
    font-size: 21px;

    color: #93c5fd;

    font-weight: bold;
}

.scoreboard {
    display: grid;

    grid-template-columns:
        repeat(10, minmax(100px, 1fr));

    gap: 6px;

    overflow-x: auto;
}

.frame {
    min-width: 100px;

    background: #1f2937;

    border: 1px solid #374151;

    border-radius: 9px;

    overflow: hidden;
}

.frame-title {
    text-align: center;

    padding: 9px;

    background: #374151;

    font-weight: bold;

    font-size: 14px;
}

.rolls {
    display: grid;

    grid-template-columns: 1fr 1fr;

    min-height: 62px;
}

.frame.tenth .rolls {
    grid-template-columns: repeat(3, 1fr);
}

.roll {
    display: flex;

    align-items: center;
    justify-content: center;

    border-right: 1px solid #374151;

    font-size: 23px;

    font-weight: bold;
}

.roll:last-child {
    border-right: none;
}

.frame-score {
    border-top: 1px solid #374151;

    text-align: center;

    font-size: 24px;

    font-weight: bold;

    padding: 12px;

    min-height: 52px;
}

/* =========================
   ROLL BUTTONS
========================= */

.controls {
    margin-top: 25px;

    display: flex;

    flex-wrap: wrap;

    gap: 9px;

    justify-content: center;
}

.roll-button {
    border: none;

    border-radius: 9px;

    padding: 15px 22px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    background: #2563eb;

    color: white;
}

.roll-button:hover {
    background: #1d4ed8;
}

.spare {
    background: #7c3aed;
}

.reset {
    background: #dc2626;

    border: none;

    border-radius: 9px;

    padding: 15px 22px;

    color: white;

    font-weight: bold;

    font-size: 17px;

    cursor: pointer;
}

/* =========================
   SCORE EDITOR
========================= */

.editor {
    max-width: 900px;

    background: #1f2937;

    padding: 25px;

    border-radius: 12px;
}

.editor-frame {
    display: grid;

    grid-template-columns: 100px 1fr;

    align-items: center;

    gap: 12px;

    padding: 12px 0;

    border-bottom: 1px solid #374151;
}

.editor-frame input {
    width: 70px;

    padding: 10px;

    background: #111827;

    border: 1px solid #4b5563;

    border-radius: 7px;

    color: white;

    font-size: 17px;
}

/* =========================
   RECAP
========================= */

.recap-box {
    background: #1f2937;

    padding: 25px;

    border-radius: 12px;

    max-width: 650px;
}

.recap-row {
    display: flex;

    justify-content: space-between;

    padding: 15px 0;

    border-bottom: 1px solid #374151;

    font-size: 18px;
}

/* =========================
   BACKGROUNDS
========================= */

.backgrounds {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));

    gap: 15px;
}

.background-option {
    height: 110px;

    border-radius: 12px;

    border: 3px solid transparent;

    cursor: pointer;
}

.background-option:hover {
    border-color: white;
}

.bg-dark {
    background: #111827;
}

.bg-blue {
    background:
        linear-gradient(135deg,
        #172554,
        #2563eb);
}

.bg-purple {
    background:
        linear-gradient(135deg,
        #2e1065,
        #7e22ce);
}

.bg-red {
    background:
        linear-gradient(135deg,
        #450a0a,
        #dc2626);
}

.bg-green {
    background:
        linear-gradient(135deg,
        #052e16,
        #16a34a);
}

.bg-light {
    background: #e5e7eb;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .container {
        padding: 20px;
    }

    header {
        font-size: 21px;
    }

    h1 {
        font-size: 31px;
    }

    .scoreboard {
        grid-template-columns:
            repeat(10, 100px);
    }

}

</style>
</head>

<body>


<!-- =========================
     WELCOME
========================= -->

<div id="welcomeScreen">

    <div class="welcome-content">

        <h1>
            🎳 Welcome To<br>
            King Gavin Lanes
        </h1>

        <p>
            Bowling Score System
        </p>

    </div>

</div>


<!-- =========================
     HEADER
========================= -->

<header>

    <div>
        🎳 KING GAVIN LANES
    </div>

    <button
        class="menu-button"
        onclick="toggleMenu()">

        ☰ MENU

    </button>

</header>


<!-- =========================
     MENU
========================= -->

<div id="menu" class="menu">

    <button
        class="back"
        onclick="goBack()">

        ◀ Back

    </button>

    <button
        onclick="showPage('players')">

        👥 Players

    </button>

    <button
        onclick="showPage('score')">

        🎳 Score

    </button>

    <button
        onclick="showPage('editor')">

        ✏️ Score Editor

    </button>

    <button
        onclick="showPage('recap')">

        📊 Recap

    </button>

    <button
        onclick="showPage('backgrounds')">

        🖼️ Backgrounds

    </button>

    <button
        class="end"
        onclick="endGame()">

        🛑 End Game

    </button>

</div>


<div class="container">


<!-- =========================
     PLAYER SETUP
========================= -->

<section
    id="players"
    class="page">

    <h1>👥 Players</h1>

    <div class="setup-box">

        <p>
            Add the players before the game starts.
        </p>

        <input
            id="playerInput"
            class="name-input"
            maxlength="30"
            placeholder="Enter player name..."
        >

        <button
            class="primary-button"
            onclick="addPlayer()">

            + ADD PLAYER

        </button>

        <div
            id="playerList"
            class="player-list">
        </div>

        <button
            id="startButton"
            class="primary-button start-button"
            onclick="startGame()">

            🎳 START BOWLING

        </button>

    </div>

</section>


<!-- =========================
     SCORE
========================= -->

<section
    id="score"
    class="page">

    <div class="score-title">

        <div>

            <h1>Score</h1>

            <div
                id="currentPlayer"
                class="current-player">
            </div>

        </div>

    </div>

    <div
        id="playerSelector"
        class="player-selector">
    </div>

    <div
        id="scoreboard"
        class="scoreboard">
    </div>

    <div
        id="controls"
        class="controls">
    </div>

    <div class="controls">

        <button
            class="reset"
            onclick="resetCurrentPlayer()">

            RESET PLAYER

        </button>

    </div>

</section>


<!-- =========================
     SCORE EDITOR
========================= -->

<section
    id="editor"
    class="page">

    <h1>✏️ Score Editor</h1>

    <div class="editor">

        <p>
            Select a player and manually edit their rolls.
        </p>

        <select
            id="editorPlayer"
            onchange="renderEditor()"
            style="
            padding:13px;
            background:#111827;
            color:white;
            border:1px solid #4b5563;
            border-radius:8px;
            font-size:16px;
            ">
        </select>

        <div
            id="editorContent"
            style="margin-top:20px;">
        </div>

        <button
            class="primary-button"
            onclick="saveEditor()">

            SAVE SCORES

        </button>

    </div>

</section>


<!-- =========================
     RECAP
========================= -->

<section
    id="recap"
    class="page">

    <h1>📊 Recap</h1>

    <div
        id="recapContent"
        class="recap-box">
    </div>

</section>


<!-- =========================
     BACKGROUNDS
========================= -->

<section
    id="backgrounds"
    class="page">

    <h1>🖼️ Backgrounds</h1>

    <p>
        Choose a background for King Gavin Lanes.
    </p>

    <div class="backgrounds">

        <div
            class="background-option bg-dark"
            onclick="setBackground('#111827')">
        </div>

        <div
            class="background-option bg-blue"
            onclick="setBackground('linear-gradient(135deg,#172554,#2563eb)')">
        </div>

        <div
            class="background-option bg-purple"
            onclick="setBackground('linear-gradient(135deg,#2e1065,#7e22ce)')">
        </div>

        <div
            class="background-option bg-red"
            onclick="setBackground('linear-gradient(135deg,#450a0a,#dc2626)')">
        </div>

        <div
            class="background-option bg-green"
            onclick="setBackground('linear-gradient(135deg,#052e16,#16a34a)')">
        </div>

        <div
            class="background-option bg-light"
            onclick="setBackground('#e5e7eb')">
        </div>

    </div>

</section>

</div>


<script>

/* =========================
   GAME DATA
========================= */

let players = [];

let currentPlayerIndex = 0;

let currentPage = "players";

let gameStarted = false;


/* =========================
   WELCOME SCREEN
========================= */

setTimeout(() => {

    document
        .getElementById("welcomeScreen")
        .classList.add("hidden");

}, 3000);


/* =========================
   MENU
========================= */

function toggleMenu() {

    document
        .getElementById("menu")
        .classList.toggle("open");

}


function showPage(page) {

    document
        .querySelectorAll(".page")
        .forEach(p =>
            p.classList.remove("active")
        );

    document
        .getElementById(page)
        .classList.add("active");

    currentPage = page;

    document
        .getElementById("menu")
        .classList.remove("open");

    if (page === "score") {

        renderScore();

    }

    if (page === "editor") {

        renderEditorPlayers();

        renderEditor();

    }

    if (page === "recap") {

        renderRecap();

    }
}


/* =========================
   BACK BUTTON
========================= */

function goBack() {

    document
        .getElementById("menu")
        .classList.remove("open");

    if (currentPage === "score") {

        showPage("players");

    } else {

        showPage("score");

    }
}


/* =========================
   PLAYERS
========================= */

function addPlayer() {

    const input =
        document.getElementById("playerInput");

    const name =
        input.value.trim();

    if (!name) {

        alert("Enter a player name.");

        return;
    }

    players.push({

        name: name,

        rolls: []

    });

    input.value = "";

    renderPlayers();
}


function removePlayer(index) {

    players.splice(index, 1);

    if (currentPlayerIndex >= players.length) {

        currentPlayerIndex =
            Math.max(0, players.length - 1);
    }

    renderPlayers();
}


function renderPlayers() {

    const list =
        document.getElementById("playerList");

    list.innerHTML = "";

    players.forEach((player, index) => {

        const div =
            document.createElement("div");

        div.className = "player";

        div.innerHTML = `

            <span class="player-name">
                ${escapeHTML(player.name)}
            </span>

            <button
                class="remove-player"
                onclick="removePlayer(${index})">

                REMOVE

            </button>

        `;

        list.appendChild(div);

    });
}


/* =========================
   START GAME
========================= */

function startGame() {

    if (players.length === 0) {

        alert(
            "You need to add at least one player before bowling."
        );

        return;
    }

    gameStarted = true;

    currentPlayerIndex = 0;

    showPage("score");

}


/* =========================
   PLAYER SELECTOR
========================= */

function renderPlayerSelector() {

    const selector =
        document.getElementById(
            "playerSelector"
        );

    selector.innerHTML = "";

    players.forEach((player, index) => {

        const button =
            document.createElement("button");

        button.className =
            "player-select";

        if (index === currentPlayerIndex) {

            button.classList.add("active");

        }

        button.textContent =
            player.name;

        button.onclick = () => {

            currentPlayerIndex = index;

            renderScore();

        };

        selector.appendChild(button);

    });
}


/* =========================
   FRAME BUILDER
========================= */

function getFrames(rolls) {

    const frames = [];

    let index = 0;

    for (let frame = 0; frame < 9; frame++) {

        if (index >= rolls.length) {

            frames.push([]);

            continue;
        }

        const first =
            rolls[index];

        if (first === 10) {

            frames.push([10]);

            index++;

        } else {

            const second =
                rolls[index + 1];

            if (second !== undefined) {

                frames.push([
                    first,
                    second
                ]);

                index += 2;

            } else {

                frames.push([first]);

                index++;
            }
        }
    }

    frames.push(
        rolls.slice(index, index + 3)
    );

    return frames;
}


/* =========================
   SCORE CALCULATION
========================= */

function calculateScores(rolls) {

    const frames =
        getFrames(rolls);

    const scores = [];

    let total = 0;

    for (let i = 0; i < 10; i++) {

        const frame =
            frames[i];

        if (!frame.length) {

            scores.push(null);

            continue;
        }


        /* STRIKE */

        if (
            i < 9 &&
            frame[0] === 10
        ) {

            const next =
                frames[i + 1] || [];

            const after =
                frames[i + 2] || [];

            if (next.length < 2) {

                scores.push(null);

                continue;
            }

            let bonus =
                next[0];

            if (next[0] === 10) {

                if (!after.length) {

                    scores.push(null);

                    continue;
                }

                bonus += after[0];

            } else {

                bonus += next[1];

            }

            total += 10 + bonus;

            scores.push(total);

            continue;
        }


        /* SPARE */

        if (
            i < 9 &&
            frame.length >= 2 &&
            frame[0] + frame[1] === 10
        ) {

            const next =
                frames[i + 1] || [];

            if (!next.length) {

                scores.push(null);

                continue;
            }

            total +=
                10 +
                next[0];

            scores.push(total);

            continue;
        }


        /* NORMAL */

        if (frame.length >= 2) {

            total +=
                frame[0] +
                frame[1];

            scores.push(total);

        } else {

            scores.push(null);

        }
    }

    return scores;
}


/* =========================
   RENDER SCORE
========================= */

function renderScore() {

    if (!players.length) {

        showPage("players");

        return;
    }

    const player =
        players[currentPlayerIndex];

    document
        .getElementById("currentPlayer")
        .textContent =
        "Bowling: " + player.name;

    renderPlayerSelector();

    const board =
        document.getElementById(
            "scoreboard"
        );

    board.innerHTML = "";

    const frames =
        getFrames(player.rolls);

    const scores =
        calculateScores(player.rolls);


    for (let i = 0; i < 10; i++) {

        const box =
            document.createElement("div");

        box.className = "frame";

        if (i === 9) {

            box.classList.add("tenth");

        }

        box.innerHTML = `

            <div class="frame-title">
                FRAME ${i + 1}
            </div>

        `;


        const rollsBox =
            document.createElement("div");

        rollsBox.className =
            "rolls";


        const frame =
            frames[i];


        if (i < 9) {

            let first =
                frame[0];

            let second =
                frame[1];


            let firstText =
                first === undefined
                    ? ""
                    : first === 10
                        ? "X"
                        : first;


            let secondText = "";


            if (
                second !== undefined
            ) {

                if (
                    first +
                    second === 10
                ) {

                    secondText = "/";

                } else {

                    secondText =
                        second;

                }

            }


            rollsBox.innerHTML = `

                <div class="roll">
                    ${firstText}
                </div>

                <div class="roll">
                    ${secondText}
                </div>

            `;

        } else {

            for (
                let j = 0;
                j < 3;
                j++
            ) {

                const value =
                    frame[j];

                const roll =
                    document.createElement(
                        "div"
                    );

                roll.className =
                    "roll";

                roll.textContent =
                    value === undefined
                        ? ""
                        : value === 10
                            ? "X"
                            : value;

                rollsBox.appendChild(roll);
            }
        }


        box.appendChild(rollsBox);


        const score =
            document.createElement("div");

        score.className =
            "frame-score";

        score.textContent =
            scores[i] === null
                ? ""
                : scores[i];

        box.appendChild(score);

        board.appendChild(box);
    }


    renderRollButtons();
}


/* =========================
   ROLL BUTTONS
========================= */

function renderRollButtons() {

    const controls =
        document.getElementById(
            "controls"
        );

    controls.innerHTML = "";


    for (
        let value = 0;
        value <= 9;
        value++
    ) {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "roll-button";

        button.textContent =
            value;

        button.onclick =
            () => addRoll(value);

        controls.appendChild(button);
    }


    const strike =
        document.createElement("button");

    strike.className =
        "roll-button";

    strike.textContent =
        "STRIKE X";

    strike.onclick =
        () => addRoll(10);

    controls.appendChild(strike);


    const spare =
        document.createElement("button");

    spare.className =
        "roll-button spare";

    spare.textContent =
        "SPARE /";

    spare.onclick =
        addSpare;

    controls.appendChild(spare);
}


/* =========================
   CURRENT FRAME
========================= */

function currentFrame(rolls) {

    const frames =
        getFrames(rolls);

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        if (
            frames[i].length === 0
        ) {

            return i;
        }

        if (
            i < 9 &&
            frames[i][0] !== 10 &&
            frames[i].length < 2
        ) {

            return i;
        }

        if (
            i === 9 &&
            frames[i].length < 3
        ) {

            return i;
        }
    }

    return 10;
}


/* =========================
   ADD ROLL
========================= */

function addRoll(value) {

    const player =
        players[currentPlayerIndex];

    const frame =
        currentFrame(
            player.rolls
        );

    if (frame >= 10) {

        return;
    }


    if (frame < 9) {

        const frames =
            getFrames(player.rolls);

        const current =
            frames[frame];


        if (current.length === 0) {

            player.rolls.push(value);

        } else {

            if (current[0] === 10) {

                return;
            }

            if (
                current[0] + value > 10
            ) {

                return;
            }

            player.rolls.push(value);
        }

    } else {

        const frames =
            getFrames(player.rolls);

        const current =
            frames[9];


        if (current.length === 0) {

            player.rolls.push(value);

        } else if (
            current.length === 1
        ) {

            if (
                current[0] === 10
            ) {

                player.rolls.push(value);

            } else if (
                current[0] + value <= 10
            ) {

                player.rolls.push(value);
            }

        } else {

            if (
                current[0] === 10 ||
                current[0] +
                current[1] === 10
            ) {

                player.rolls.push(value);
            }
        }
    }


    renderScore();
}


/* =========================
   SPARE
========================= */

function addSpare() {

    const player =
        players[currentPlayerIndex];

    const frame =
        currentFrame(
            player.rolls
        );

    if (frame >= 10) {
        return;
    }

    const frames =
        getFrames(player.rolls);

    const current =
        frames[frame];

    if (
        current.length === 1 &&
        current[0] !== 10
    ) {

        player.rolls.push(
            10 - current[0]
        );

        renderScore();
    }
}


/* =========================
   RESET PLAYER
========================= */

function resetCurrentPlayer() {

    players[currentPlayerIndex].rolls = [];

    renderScore();
}


/* =========================
   SCORE EDITOR
========================= */

function renderEditorPlayers() {

    const select =
        document.getElementById(
            "editorPlayer"
        );

    select.innerHTML = "";

    players.forEach(
        (player, index) => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = index;

            option.textContent =
                player.name;

            select.appendChild(option);
        }
    );
}


function renderEditor() {

    const content =
        document.getElementById(
            "editorContent"
        );

    const select =
        document.getElementById(
            "editorPlayer"
        );

    if (!players.length) {

        content.innerHTML =
            "<p>No players yet.</p>";

        return;
    }

    const player =
        players[
            Number(select.value)
        ];

    content.innerHTML = "";


    player.rolls.forEach(
        (roll, index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "editor-frame";

            row.innerHTML = `

                <span>
                    Roll ${index + 1}
                </span>

                <input
                    type="number"
                    min="0"
                    max="10"
                    value="${roll}"
                    data-roll="${index}"
                >

            `;

            content.appendChild(row);
        }
    );


    if (!player.rolls.length) {

        content.innerHTML =
            "<p>This player has no rolls yet.</p>";
    }
}


function saveEditor() {

    const select =
        document.getElementById(
            "editorPlayer"
        );

    if (!players.length) {
        return;
    }

    const player =
        players[
            Number(select.value)
        ];

    const inputs =
        document.querySelectorAll(
            "#editorContent input"
        );

    const newRolls = [];

    inputs.forEach(input => {

        let value =
            Number(input.value);

        if (
            !Number.isFinite(value)
        ) {

            value = 0;
        }

        value =
            Math.max(
                0,
                Math.min(10, value)
            );

        newRolls.push(value);
    });

    player.rolls =
        newRolls;

    renderScore();

    showPage("score");
}


/* =========================
   RECAP
========================= */

function renderRecap() {

    const recap =
        document.getElementById(
            "recapContent"
        );

    recap.innerHTML = "";

    players.forEach(player => {

        const scores =
            calculateScores(
                player.rolls
            );

        let total = 0;

        scores.forEach(score => {

            if (score !== null) {
                total = score;
            }
        });


        const strikes =
            player.rolls.filter(
                x => x === 10
            ).length;


        const row =
            document.createElement(
                "div"
            );

        row.className =
            "recap-row";

        row.innerHTML = `

            <span>
                ${escapeHTML(player.name)}
            </span>

            <strong>
                ${total}
            </strong>

        `;

        recap.appendChild(row);

    });


    if (!players.length) {

        recap.innerHTML =
            "<p>No players yet.</p>";
    }
}


/* =========================
   END GAME
========================= */

function endGame() {

    const confirmed =
        confirm(
            "End the current game?"
        );

    if (!confirmed) {
        return;
    }

    players = [];

    currentPlayerIndex = 0;

    gameStarted = false;

    document
        .getElementById("playerList")
        .innerHTML = "";

    document
        .getElementById("welcomeScreen")
        .classList.remove("hidden");

    currentPage = "players";

    showPage("players");


    setTimeout(() => {

        document
            .getElementById("welcomeScreen")
            .classList.add("hidden");

    }, 3000);
}


/* =========================
   BACKGROUNDS
========================= */

function setBackground(background) {

    document.body.style.background =
        background;
}


/* =========================
   SAFETY
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* =========================
   START
========================= */

renderPlayers();

showPage("players");

</script>
