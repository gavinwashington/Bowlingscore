<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Gavin Lanes</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#071a33,#0b315c);
  min-height:100vh;
}
header{
  height:70px;
  padding:15px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(0,0,0,.25);
}
.brand{font-size:24px;font-weight:bold}
button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:#1677ff;
  color:white;
}
button:active{transform:scale(.97)}
.container{padding:25px;max-width:1100px;margin:auto}
.page{display:none}
.page.active{display:block}
.card{
  background:rgba(255,255,255,.09);
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}
h1{margin-top:0}
.center{text-align:center}
.bigcode{
  font-size:42px;
  font-weight:bold;
  letter-spacing:4px;
  margin:15px 0;
}
.status{font-size:18px;margin-top:10px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
}
.menuBtn{
  min-height:100px;
  font-size:20px;
}
input{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  margin:8px 0;
  font-size:17px;
}
.player{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  margin:8px 0;
  background:rgba(255,255,255,.08);
  border-radius:12px;
}
.scoreTable{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
}
.scoreTable th,.scoreTable td{
  border:1px solid rgba(255,255,255,.18);
  padding:12px;
  text-align:center;
}
.current{
  background:rgba(22,119,255,.35);
}
.currentScore{
  text-align:center;
  font-size:65px;
  font-weight:bold;
  margin:25px 0;
}
.back{background:#444}
.danger{background:#c62828}

/* PINSETTER */
.pinArea{
  position:relative;
  width:280px;
  height:240px;
  margin:20px auto;
}
.pin{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  color:#111;
  font-size:22px;
  font-weight:bold;
  border:3px solid #ddd;
  cursor:pointer;
  transition:.15s;
}
.pin.down{
  background:#394651;
  color:#9ba5ad;
  border-color:#53616b;
}
.pin.split{
  border:4px solid red;
  box-shadow:0 0 12px rgba(255,0,0,.7);
}
.pin.split::after{
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:red;
  top:-7px;
  right:-7px;
}
.pin:nth-child(1){left:112px;top:5px}
.pin:nth-child(2){left:75px;top:75px}
.pin:nth-child(3){left:149px;top:75px}
.pin:nth-child(4){left:38px;top:145px}
.pin:nth-child(5){left:112px;top:145px}
.pin:nth-child(6){left:186px;top:145px}

.pinControls{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  max-width:500px;
  margin:auto;
}
.submit{
  width:100%;
  margin-top:15px;
  background:#16a34a;
}
</style>
</head>

<body>

<header>
  <div class="brand">🎳 King Gavin Lanes</div>
  <button onclick="page('menu')">☰ Menu</button>
</header>

<div class="container">

<!-- HOME -->
<section id="home" class="page active">
  <div class="card center">
    <h1>🎳 King Gavin Lanes</h1>
    <h2 id="homePlayer">No Game Started</h2>

    <p>Phone Remote Code</p>
    <div class="bigcode" id="remoteCode">------</div>
    <div class="status" id="connectionStatus">Starting remote...</div>
  </div>
</section>

<!-- MENU -->
<section id="menu" class="page">
  <div class="card">
    <h1>Menu</h1>
    <div class="grid">
      <button class="menuBtn" onclick="page('players')">👥 Players</button>
      <button class="menuBtn" onclick="page('score')">📊 Score</button>
      <button class="menuBtn" onclick="page('pinsetter')">🎳 Pinsetter</button>
      <button class="menuBtn danger" onclick="endGame()">🛑 End Game</button>
    </div>
  </div>
</section>

<!-- PLAYERS -->
<section id="players" class="page">
  <div class="card">
    <h1>Players</h1>
    <div id="playersList"></div>
    <button class="back" onclick="page('menu')">← Back</button>
  </div>
</section>

<!-- SCORE -->
<section id="score" class="page">
  <div class="card">
    <h1>Score</h1>
    <div class="currentScore" id="currentScore">0</div>

    <table class="scoreTable">
      <thead>
        <tr>
          <th>Player</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="scoreBody"></tbody>
    </table>

    <br>
    <button class="back" onclick="page('menu')">← Back</button>
  </div>
</section>

<!-- PINSETTER -->
<section id="pinsetter" class="page">
  <div class="card center">
    <h1>🎳 Pinsetter</h1>
    <p>Select the pins that are unavailable, then press Submit.</p>

    <div class="pinArea" id="tvPins"></div>

    <div class="pinControls">
      <button onclick="pinAction('rack')">Rack</button>
      <button onclick="pinAction('clear')">Clear</button>
      <button onclick="pinAction('sweep')">Sweep</button>
      <button onclick="pinAction('nextBall')">Next Ball</button>
      <button onclick="toggleSplit()">🔴 Split</button>
    </div>

    <button class="submit" onclick="submitPins()">✅ Submit</button>

    <br><br>
    <button class="back" onclick="page('menu')">← Back</button>
  </div>
</section>

</div>

<script>
let players=[];
let currentPlayer=0;
let gameStarted=false;
let scores={};

let pins=Array(6).fill(true);
let splitPins=[];

let pinDraft=[...pins];
let splitDraft=[];

let peer;
let remoteConn=null;

function page(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(name).classList.add("active");
  update();
}

function update(){
  renderPlayers();
  renderScore();
  renderPins();

  document.getElementById("homePlayer").textContent =
    players.length && gameStarted
      ? "Current Player: "+players[currentPlayer]
      : "No Game Started";
}

function renderPlayers(){
  const box=document.getElementById("playersList");

  if(!players.length){
    box.innerHTML="<p>No players added yet.</p>";
    return;
  }

  box.innerHTML=players.map((name,i)=>`
    <div class="player">
      <span>${i+1}. ${escapeHtml(name)}</span>
    </div>
  `).join("");
}

function renderScore(){
  const body=document.getElementById("scoreBody");

  body.innerHTML=players.map((name,i)=>`
    <tr class="${i===currentPlayer?'current':''}">
      <td>${escapeHtml(name)}</td>
      <td>${scores[name] ?? 0}</td>
    </tr>
  `).join("");

  if(players.length){
    document.getElementById("currentScore").textContent =
      scores[players[currentPlayer]] ?? 0;
  }else{
    document.getElementById("currentScore").textContent="0";
  }
}

function renderPins(){
  const box=document.getElementById("tvPins");

  box.innerHTML=pinDraft.map((available,i)=>`
    <div
      class="pin ${available?'':'down'} ${splitDraft.includes(i)?'split':''}"
      onclick="togglePin(${i})"
    >${i+1}</div>
  `).join("");
}

function togglePin(index){
  pinDraft[index]=!pinDraft[index];

  if(!pinDraft[index]){
    splitDraft=splitDraft.filter(x=>x!==index);
  }

  renderPins();
}

function pinAction(action){
  if(action==="rack" || action==="nextBall"){
    pinDraft=Array(6).fill(true);
    splitDraft=[];
  }

  if(action==="clear" || action==="sweep"){
    pinDraft=Array(6).fill(false);
    splitDraft=[];
  }

  renderPins();
}

function toggleSplit(){
  splitDraft=[];

  pinDraft.forEach((available,i)=>{
    if(available) splitDraft.push(i);
  });

  renderPins();
}

function submitPins(){
  pins=[...pinDraft];
  splitPins=[...splitDraft];

  sendState();
  update();
}

function startGame(){
  if(!players.length)return;

  gameStarted=true;
  currentPlayer=0;

  update();
  sendState();
  page("score");
}

function endGame(){
  players=[];
  currentPlayer=0;
  gameStarted=false;
  scores={};

  pins=Array(6).fill(true);
  splitPins=[];
  pinDraft=[...pins];
  splitDraft=[];

  sendState();
  page("home");
}

function sendState(){
  if(!remoteConn || !remoteConn.open)return;

  remoteConn.send({
    type:"state",
    players,
    currentPlayer,
    gameStarted,
    scores,
    pins,
    splitPins
  });
}

function handleRemote(msg){

  if(msg.type==="roll"){
    if(!gameStarted || !players.length)return;

    const name=players[currentPlayer];
    scores[name]=(scores[name]||0)+Number(msg.value);

    sendState();
    update();
  }

  if(msg.type==="strike"){
    if(!gameStarted)return;

    const name=players[currentPlayer];
    scores[name]=(scores[name]||0)+10;

    sendState();
    update();
  }

  if(msg.type==="spare"){
    if(!gameStarted)return;

    const name=players[currentPlayer];
    scores[name]=(scores[name]||0)+10;

    sendState();
    update();
  }

  if(msg.type==="previous"){
    if(players.length){
      currentPlayer=(currentPlayer-1+players.length)%players.length;
      sendState();
      update();
    }
  }

  if(msg.type==="next"){
    if(players.length){
      currentPlayer=(currentPlayer+1)%players.length;
      sendState();
      update();
    }
  }

  if(msg.type==="reset"){
    scores={};
    sendState();
    update();
  }

  if(msg.type==="addPlayer"){
    const name=String(msg.name||"").trim();

    if(name && !players.includes(name)){
      players.push(name);
      scores[name]=0;
      sendState();
      update();
    }
  }

  if(msg.type==="removePlayer"){
    const index=Number(msg.index);

    if(index>=0 && index<players.length){
      const removed=players[index];
      players.splice(index,1);
      delete scores[removed];

      if(currentPlayer>=players.length){
        currentPlayer=Math.max(0,players.length-1);
      }

      sendState();
      update();
    }
  }

  if(msg.type==="start"){
    startGame();
  }

  if(msg.type==="pinSubmit"){
    pins=Array.isArray(msg.pins)
      ? msg.pins.slice(0,6)
      : Array(6).fill(true);

    splitPins=Array.isArray(msg.splitPins)
      ? msg.splitPins
      : [];

    while(pins.length<6)pins.push(true);

    pinDraft=[...pins];
    splitDraft=[...splitPins];

    sendState();
    update();
  }

  if(msg.type==="background"){
    applyBackground(msg.value);
  }

  if(msg.type==="split"){
    toggleSplit();
    submitPins();
  }

  if(msg.type==="end"){
    endGame();
  }
}

function applyBackground(value){
  const backgrounds={
    midnight:"linear-gradient(135deg,#071a33,#0b315c)",
    black:"#050505",
    purple:"linear-gradient(135deg,#24103d,#581c87)",
    green:"linear-gradient(135deg,#052e16,#166534)",
    blue:"linear-gradient(135deg,#082f49,#0369a1)",
    warm:"linear-gradient(135deg,#431407,#9a3412)"
  };

  document.body.style.background=
    backgrounds[value] || backgrounds.midnight;
}

/* PEERJS */
function createRemote(){

  const code=Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();

  const id="kgl-"+code;

  document.getElementById("remoteCode").textContent=code;

  peer=new Peer(id,{debug:0});

  peer.on("open",()=>{
    document.getElementById("connectionStatus").textContent=
      "Waiting for phone remote...";
  });

  peer.on("connection",(conn)=>{

    remoteConn=conn;

    document.getElementById("connectionStatus").textContent=
      "📱 Phone remote connected!";

    conn.on("open",()=>{
      sendState();
    });

    conn.on("data",(msg)=>{
      handleRemote(msg);
    });

    conn.on("close",()=>{
      remoteConn=null;

      document.getElementById("connectionStatus").textContent=
        "Waiting for phone remote...";
    });
  });

  peer.on("error",(err)=>{
    console.log(err);
    document.getElementById("connectionStatus").textContent=
      "Remote connection error";
  });
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

createRemote();
update();
</script>

</body>
</html>
