<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling Scoreboard</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
    }
    header {
        background: #0b0f19;
        padding: 20px;
        text-align: center;
        font-size: 30px;
        font-weight: bold;
    }
    .container {
        max-width: 1100px;
        margin: auto;
        padding: 20px;
    }
    .scoreboard {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 5px;
        overflow-x: auto;
    }
    .frame {
        min-width: 85px;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 8px;
        overflow: hidden;
    }
    .frame-title {
        text-align: center;
        padding: 7px;
        background: #374151;
        font-weight: bold;
    }
    .rolls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        text-align: center;
    }
    .roll {
        padding: 12px 5px;
        border-right: 1px solid #374151;
        font-size: 20px;
        font-weight: bold;
        min-height: 48px;
    }
    .roll:last-child {
        border-right: none;
    }
    .frame-score {
        border-top: 1px solid #374151;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        padding: 10px;
        min-height: 45px;
    }
    .controls {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
    }
    button {
        border: none;
        border-radius: 8px;
        padding: 14px 20px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        background: #2563eb;
        color: white;
    }
    button:hover {
        background: #1d4ed8;
    }
    .reset {
        background: #dc2626;
    }
    .reset:hover {
        background: #b91c1c;
    }
    .alert-box {
        margin-top: 30px;
        background: #1f2937;
        padding: 20px;
        border-radius: 10px;
    }
    .alert-box h2 {
        margin-top: 0;
    }
    .alert-form {
        display: flex;
        gap: 10px;
    }
    input {
        flex: 1;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid #4b5563;
        background: #111827;
        color: white;
        font-size: 16px;
    }
    .news-container {
        margin-top: 15px;
        height: 55px;
        overflow: hidden;
        background: #050505;
        border: 2px solid #ef4444;
        display: flex;
        align-items: center;
        position: relative;
    }
    .news-alert {
        white-space: nowrap;
        font-size: 21px;
        font-weight: bold;
        position: absolute;
        left: 100%;
    }
    .animate-news {
        animation: newsSlide 8s linear;
    }
    @keyframes newsSlide {
        from {
            left: 100%;
        }
        to {
            left: -100%;
        }
    }
    @media (max-width: 700px) {
        .scoreboard {
            grid-template-columns: repeat(10, 85px);
        }
        .alert-form {
            flex-direction: column;
        }
    }
</style>
</head>
<body>
<header>
    🎳 BOWLING SCOREBOARD
</header>
<div class="container">
    <div id="scoreboard" class="scoreboard"></div>
    <div class="controls" id="controls"></div>
    <div class="controls">
        <button class="reset" onclick="resetGame()">RESET GAME</button>
    </div>
    <div class="alert-box">
        <h2>📢 Alert Maker</h2>
        <div class="alert-form">
            <input
                id="alertInput"
                type="text"
                maxlength="120"
                placeholder="Type your alert..."
            >
            <button onclick="sendAlert()">
                SEND ALERT
            </button>
        </div>
        <div class="news-container">
            <div id="newsAlert"></div>
        </div>
    </div>
</div>
<script>
let rolls = [];
/* =========================
   SCORE CALCULATION
========================= */
function calculateScores() {
    let scores = [];
    let total = 0;
    let rollIndex = 0;
    for (let frame = 0; frame < 10; frame++) {
        if (rollIndex >= rolls.length) {
            scores.push(null);
            continue;
        }
        let first = rolls[rollIndex];
        // Strike
        if (first === 10) {
            if (rollIndex + 2 < rolls.length) {
                total += 10 +
                    rolls[rollIndex + 1] +
                    rolls[rollIndex + 2];
                scores.push(total);
            } else {
                scores.push(null);
            }
            rollIndex++;
        }
        // Normal frame / spare
        else {
            if (rollIndex + 1 < rolls.length) {
                let second = rolls[rollIndex + 1];
                let frameTotal = first + second;
                if (frameTotal === 10) {
                    if (rollIndex + 2 < rolls.length) {
                        total += 10 + rolls[rollIndex + 2];
                        scores.push(total);
                    } else {
                        scores.push(null);
                    }
                } else {
                    total += frameTotal;
                    scores.push(total);
                }
                rollIndex += 2;
            } else {
                scores.push(null);
                rollIndex++;
            }
        }
    }
    return scores;
}
/* =========================
   DISPLAY SCOREBOARD
========================= */
function renderScoreboard() {
    const board = document.getElementById("scoreboard");
    board.innerHTML = "";
    const scores = calculateScores();
    let rollIndex = 0;
    for (let frame = 0; frame < 10; frame++) {
        const box = document.createElement("div");
        box.className = "frame";
        const title = document.createElement("div");
        title.className = "frame-title";
        title.textContent = "FRAME " + (frame + 1);
        box.appendChild(title);
        const rollsBox = document.createElement("div");
        rollsBox.className = "rolls";
        if (frame < 9) {
            let first = rolls[rollIndex];
            let second = rolls[rollIndex + 1];
            let firstText = "";
            let secondText = "";
            if (first !== undefined) {
                if (first === 10) {
                    firstText = "X";
                } else {
                    firstText = first;
                }
            }
            if (first === 10) {
                rollIndex++;
            } else if (second !== undefined) {
                if (first + second === 10) {
                    secondText = "/";
                } else {
                    secondText = second;
                }
                rollIndex += 2;
            }
            rollsBox.innerHTML = `
                <div class="roll">${firstText}</div>
                <div class="roll">${secondText}</div>
            `;
        } else {
            // 10th frame
            for (let i = 0; i < 3; i++) {
                let value = rolls[rollIndex + i];
                let text = "";
                if (value !== undefined) {
                    text = value === 10 ? "X" : value;
                }
                const roll = document.createElement("div");
                roll.className = "roll";
                roll.textContent = text;
                rollsBox.appendChild(roll);
            }
            rollIndex = rolls.length;
        }
        box.appendChild(rollsBox);
        const score = document.createElement("div");
        score.className = "frame-score";
        score.textContent =
            scores[frame] === null ||
            scores[frame] === undefined
                ? ""
                : scores[frame];
        box.appendChild(score);
        board.appendChild(box);
    }
    renderControls();
}
/* =========================
   BOWLING BUTTONS
========================= */
function renderControls() {
    const controls = document.getElementById("controls");
    controls.innerHTML = "";
    for (let i = 0; i <= 10; i++) {
        const button = document.createElement("button");
        button.textContent = i === 10 ? "STRIKE (X)" : i;
        button.onclick = function () {
            addRoll(i);
        };
        controls.appendChild(button);
    }
}
/* =========================
   ADD ROLL
========================= */
function addRoll(value) {
    if (rolls.length >= 21) {
        return;
    }
    // Don't allow impossible second-roll totals
    if (rolls.length > 0) {
        let last = rolls[rolls.length - 1];
        if (last !== 10 && last + value > 10) {
            alert("That roll would make the frame exceed 10!");
            return;
        }
    }
    rolls.push(value);
    renderScoreboard();
}
/* =========================
   RESET
========================= */
function resetGame() {
    rolls = [];
    renderScoreboard();
}
/* =========================
   NEWS ALERT
========================= */
function sendAlert() {
    const input = document.getElementById("alertInput");
    const news = document.getElementById("newsAlert");
    const message = input.value.trim();
    if (message === "") {
        return;
    }
    news.classList.remove("animate-news");
    // Force animation restart
    void news.offsetWidth;
    news.textContent =
        "🚨 BREAKING NEWS  •  " +
        message +
        "  •  🚨";
    news.classList.add("animate-news");
    input.value = "";
}
/* Allow Enter to send alert */
document
    .getElementById("alertInput")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendAlert();
        }
    });
renderScoreboard();
</script>
</body>
</html>
