<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>King Gavin Lanes</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
}

body{
    min-height:100vh;
    min-height:100dvh;
    overscroll-behavior:none;
}

.screen{
    display:none;
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:0;
    padding:clamp(10px,2vw,30px);
    overflow:hidden;
}

.screen.active{
    display:block;
}

button{
    font:inherit;
    cursor:pointer;
}


/* =========================
   WELCOME
========================= */

#welcome{
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#welcome.active{
    display:flex;
}

.welcome-box{
    animation:fadeWelcome 3s forwards;
}

.welcome-box h1{
    font-size:clamp(38px,7vw,90px);
    margin:0;
}

.welcome-box p{
    font-size:22px;
}

@keyframes fadeWelcome{

    0%{
        opacity:0;
    }

    15%{
        opacity:1;
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
    }
}


/* =========================
   HOME
========================= */

#home{
    text-align:center;
}

.logo{
    font-size:clamp(35px,6vw,70px);
    margin-top:3vh;
    margin-bottom:2vh;
}

.status{
    opacity:.8;
    font-size:clamp(15px,2vw,20px);
}

.code{
    font-size:clamp(32px,5vw,60px);
    font-weight:bold;
    letter-spacing:6px;
    margin:2vh 25px;
}

.current{
    font-size:clamp(20px,2.5vw,26px);
    margin-top:4vh;
}


/* =========================
   SCOREBOARD
========================= */

#score{
    display:none;
    flex-direction:column;
    padding:clamp(7px,1.2vh,15px) clamp(7px,1.2vw,20px);
}

#score.active{
    display:flex;
}

.score-title{
    flex:0 0 auto;
    text-align:center;
    font-size:clamp(25px,4vw,40px);
    margin:0 0 clamp(6px,1vh,12px);
}


/*
   The scoreboard itself now takes
   the remaining iPad screen height.
*/

.score-wrap{
    flex:1 1 auto;
    min-height:0;
    width:100%;

    overflow-x:auto;
    overflow-y:hidden;

    display:flex;
    align-items:flex-start;
}

.score-table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
    table-layout:fixed;
}

.score-table th,
.score-table td{
    border:2px solid white;
    text-align:center;
    padding:clamp(2px,0.4vh,7px);
}

.score-table th{
    background:#222;
    height:clamp(25px,5vh,55px);
    font-size:clamp(11px,1.6vw,20px);
}

.player-name{
    width:13%;
    text-align:left!important;
    font-size:clamp(12px,1.8vw,20px);
    font-weight:bold;
}

.frame-cell{
    height:clamp(55px,10vh,100px);
}

.current-frame{
    background:#333;
    box-shadow:inset 0 0 0 3px white;
}

.rolls{
    display:flex;
    justify-content:center;
    gap:2px;
}

.roll{
    width:clamp(20px,2.7vw,31px);
    height:clamp(20px,3vh,30px);

    border:1px solid #aaa;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(10px,1.4vw,16px);
    font-weight:bold;
}

.frame-score{
    font-size:clamp(15px,2.2vw,24px);
    margin-top:clamp(2px,0.7vh,9px);
}

.total-cell{
    width:9%;
    font-size:clamp(17px,2.5vw,28px);
    font-weight:bold;
}

.active-player{
    background:#333;
}

.message{
    flex:0 0 auto;
    text-align:center;
    font-size:clamp(14px,1.8vw,22px);
    margin-top:clamp(5px,1vh,12px);
    height:clamp(22px,4vh,35px);
    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   PINSETTER
========================= */

.pinsetter{
    text-align:center;
}

.pin-rack{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:35px;
}

.pin-row{
    display:flex;
    gap:18px;
}

.pin{
    width:55px;
    height:75px;
    border:4px solid white;
    border-radius:50% 50% 45% 45%;
    background:white;
    position:relative;
}

.pin.down{
    background:#555;
    border-color:#777;
}

.pin.split{
    border-color:red;
}

.pin.split:after{
    content:"";
    width:12px;
    height:12px;
    border-radius:50%;
    background:red;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}


/* =========================
   IPAD LANDSCAPE
========================= */

@media (orientation:landscape){

    #score{
        padding-top:6px;
    }

    .score-title{
        margin-bottom:6px;
    }

    .score-table th{
        height:clamp(25px,5vh,48px);
    }

    .frame-cell{
        height:clamp(50px,9vh,85px);
    }

    .message{
        margin-top:4px;
        height:25px;
    }
}


/* =========================
   SMALL HEIGHT SCREENS
========================= */

@media (max-height:600px){

    #score{
        padding:4px 7px;
    }

    .score-title{
        font-size:28px;
        margin-bottom:4px;
    }

    .score-table th{
        height:30px;
        padding:2px;
    }

    .frame-cell{
        height:55px;
        padding:2px;
    }

    .roll{
        width:22px;
        height:21px;
    }

    .frame-score{
        font-size:15px;
        margin-top:2px;
    }

    .message{
        font-size:14px;
        height:20px;
        margin-top:2px;
    }
}
</style>
</head>

<body>


<!-- =========================
     WELCOME
========================= -->

<section id="welcome" class="screen active">

    <div class="welcome-box">

        <h1>
            Welcome To King Gavin Lanes
        </h1>

        <p>
            6-Pin Bowling
        </p>

    </div>

</section>


<!-- =========================
     HOME
========================= -->

<section id="home" class="screen">

    <h1 class="logo">
        🎳 King Gavin Lanes
    </h1>

    <div
        class="status"
        id="connectionStatus"
    >
        Starting...
    </div>

    <div
        class="code"
        id="remoteCode"
    >
        ------
    </div>

    <div
        class="current"
        id="homeCurrent"
    >
        No game started
    </div>

</section>


<!-- =========================
     SCORE
========================= -->

<section id="score" class="screen">

    <h1 class="score-title">
        🎳 King Gavin Lanes
    </h1>

    <div class="score-wrap">

        <table class="score-table">

            <thead>

                <tr>

                    <th class="player-name">
                        Player
                    </th>

                    <th>1</th>
                    <th>2</th>
                    <th>3</th>
                    <th>4</th>
                    <th>5</th>
                    <th>6</th>
                    <th>7</th>
                    <th>8</th>
                    <th>9</th>
                    <th>10</th>

                    <th>
                        Total
                    </th>

                </tr>

            </thead>

            <tbody id="scoreBody"></tbody>

        </table>

    </div>

    <div
        class="message"
        id="scoreMessage"
    ></div>

</section>


<!-- =========================
     PINSETTER
========================= -->

<section id="pinsetter" class="screen">

    <h1 class="score-title">
        Pinsetter
    </h1>

    <div
        class="pin-rack"
        id="tvPins"
    ></div>

</section>


<script>

const PIN_COUNT=6;
const FRAME_COUNT=10;

let players=[];
let currentPlayer=0;
let gameStarted=false;

let frames={};

let pins=Array(6).fill(true);
let splitPins=Array(6).fill(false);

let peer=null;
let connection=null;


/* =========================
   SCREEN
========================= */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(s=>{
            s.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =========================
   PLAYER FRAMES
========================= */

function newFrames(){

    return Array.from(
        {length:FRAME_COUNT},
        ()=>({rolls:[]})
    );
}

function ensurePlayer(name){

    if(!frames[name]){
        frames[name]=newFrames();
    }
}


/* =========================
   FLATTEN ROLLS
========================= */

function flattenRolls(name){

    ensurePlayer(name);

    let result=[];

    for(let f=0;f<10;f++){

        for(
            const roll
            of frames[name][f].rolls
        ){

            if(roll==="X"){
                result.push(6);
            }else{
                result.push(Number(roll));
            }
        }
    }

    return result;
}


/* =========================
   SCORING
========================= */

function calculateFrameScores(name){

    ensurePlayer(name);

    const all=flattenRolls(name);

    const result=Array(10).fill(null);

    let index=0;

    for(let frame=0;frame<10;frame++){

        if(index>=all.length){
            break;
        }

        /* 10TH FRAME */

        if(frame===9){

            let total=0;

            for(
                let i=index;
                i<all.length;
                i++
            ){
                total+=all[i];
            }

            result[frame]=
                Math.min(total,18);

            break;
        }

        const first=all[index];

        /* STRIKE */

        if(first===6){

            let score=6;

            if(
                all[index+1]!==undefined
            ){
                score+=all[index+1];
            }

            if(
                all[index+2]!==undefined
            ){
                score+=all[index+2];
            }

            result[frame]=score;

            index++;

            continue;
        }

        /* ONE ROLL ONLY */

        if(
            all[index+1]===undefined
        ){

            result[frame]=first;

            break;
        }

        const second=all[index+1];

        /* SPARE */

        if(first+second===6){

            let score=6;

            if(
                all[index+2]!==undefined
            ){
                score+=all[index+2];
            }

            result[frame]=score;

        }else{

            /* OPEN */

            result[frame]=
                first+second;
        }

        index+=2;
    }

    return result;
}


function calculateTotal(name){

    const scores=
        calculateFrameScores(name);

    let total=0;

    for(
        const score
        of scores
    ){

        if(score!==null){
            total+=score;
        }
    }

    return Math.min(total,180);
}


/* =========================
   CURRENT FRAME
========================= */

function getCurrentFrame(name){

    ensurePlayer(name);

    for(let f=0;f<9;f++){

        const rolls=
            frames[name][f].rolls;

        if(rolls.length===0){
            return f;
        }

        if(rolls[0]==="X"){
            continue;
        }

        if(rolls.length<2){
            return f;
        }
    }

    return 9;
}


/* =========================
   ROLL
========================= */

function addRoll(value){

    if(!gameStarted) return;
    if(players.length===0) return;

    value=Math.max(
        0,
        Math.min(6,Number(value))
    );

    const name=
        players[currentPlayer];

    ensurePlayer(name);

    const frameIndex=
        getCurrentFrame(name);

    const frame=
        frames[name][frameIndex];


    /* 10TH FRAME */

    if(frameIndex===9){

        if(frame.rolls.length===0){

            if(value===6){
                frame.rolls.push("X");
            }else{
                frame.rolls.push(value);
            }

            renderScore();
            sendState();

            return;
        }


        if(frame.rolls.length===1){

            const first=
                frame.rolls[0];

            if(first==="X"){

                if(value===6){
                    frame.rolls.push("X");
                }else{
                    frame.rolls.push(value);
                }

                renderScore();
                sendState();

                return;
            }

            const remaining=
                6-Number(first);

            if(value>remaining){
                value=remaining;
            }

            frame.rolls.push(value);


            if(
                Number(first)+value<6
            ){

                nextPlayer();

            }else{

                renderScore();
                sendState();
            }

            return;
        }


        if(frame.rolls.length===2){

            const first=
                frame.rolls[0];

            const second=
                frame.rolls[1];

            const bonus=
                first==="X" ||
                (
                    first!=="X" &&
                    Number(first)+
                    Number(second)===6
                );

            if(bonus){

                if(value===6){
                    frame.rolls.push("X");
                }else{
                    frame.rolls.push(value);
                }
            }

            nextPlayer();

            return;
        }

        return;
    }


    /* FIRST ROLL */

    if(frame.rolls.length===0){

        /*
           SIX IS ALWAYS A STRIKE.
        */

        if(value===6){

            frame.rolls.push("X");

            renderScore();
            sendState();

            setTimeout(()=>{
                nextPlayer();
            },50);

            return;
        }

        frame.rolls.push(value);

        renderScore();
        sendState();

        return;
    }


    /* SECOND ROLL */

    if(frame.rolls.length===1){

        const first=
            Number(frame.rolls[0]);

        /*
           Never allow a frame
           to exceed six pins.
        */

        if(first+value>6){
            value=6-first;
        }

        frame.rolls.push(value);

        renderScore();
        sendState();

        setTimeout(()=>{
            nextPlayer();
        },50);

        return;
    }
}


/* =========================
   STRIKE
========================= */

function doStrike(){

    if(!gameStarted) return;
    if(players.length===0) return;

    const name=
        players[currentPlayer];

    ensurePlayer(name);

    const frameIndex=
        getCurrentFrame(name);

    const frame=
        frames[name][frameIndex];


    if(
        frameIndex<9 &&
        frame.rolls.length===0
    ){

        addRoll(6);

        return;
    }


    if(frameIndex===9){

        if(frame.rolls.length===0){

            addRoll(6);

            return;
        }

        if(frame.rolls[0]==="X"){

            addRoll(6);

            return;
        }
    }
}


/* =========================
   SPARE
========================= */

function doSpare(){

    if(!gameStarted) return;
    if(players.length===0) return;

    const name=
        players[currentPlayer];

    ensurePlayer(name);

    const frameIndex=
        getCurrentFrame(name);

    const frame=
        frames[name][frameIndex];


    /*
       A spare requires exactly
       one first roll.
    */

    if(frame.rolls.length!==1){
        return;
    }

    /*
       A strike cannot become
       a spare.
    */

    if(frame.rolls[0]==="X"){
        return;
    }

    const first=
        Number(frame.rolls[0]);


    /*
       SIX = STRIKE.
       Spare is impossible.
    */

    if(first===6){
        return;
    }


    const remaining=
        6-first;

    addRoll(remaining);
}


/* =========================
   PLAYER TURN
========================= */

function nextPlayer(){

    if(players.length===0){
        return;
    }

    currentPlayer++;

    if(
        currentPlayer>=players.length
    ){
        currentPlayer=0;
    }

    renderScore();
    sendState();
}


function previousPlayer(){

    if(players.length===0){
        return;
    }

    currentPlayer--;

    if(currentPlayer<0){
        currentPlayer=
            players.length-1;
    }

    renderScore();
    sendState();
}


/* =========================
   RESET
========================= */

function resetGame(){

    players.forEach(name=>{

        frames[name]=
            newFrames();
    });

    currentPlayer=0;

    renderScore();
    sendState();
}


/* =========================
   DISPLAY ROLL
========================= */

function formatRoll(roll){

    if(roll===undefined){
        return "";
    }

    if(roll==="X"){
        return "X";
    }

    if(Number(roll)===0){
        return "-";
    }

    return String(roll);
}


/* =========================
   SCORE DISPLAY
========================= */

function renderScore(){

    const body=
        document.getElementById(
            "scoreBody"
        );

    body.innerHTML="";


    players.forEach(
        (name,playerIndex)=>{

        ensurePlayer(name);

        const row=
            document.createElement("tr");


        /* PLAYER */

        const nameCell=
            document.createElement("td");

        nameCell.className=
            "player-name";

        if(
            playerIndex===currentPlayer
        ){
            nameCell.classList.add(
                "active-player"
            );
        }

        nameCell.textContent=name;

        row.appendChild(nameCell);


        /* FRAMES */

        const scores=
            calculateFrameScores(name);


        for(let f=0;f<10;f++){

            const cell=
                document.createElement("td");

            cell.className=
                "frame-cell";


            if(
                gameStarted &&
                playerIndex===currentPlayer &&
                getCurrentFrame(name)===f
            ){

                cell.classList.add(
                    "current-frame"
                );
            }


            const rolls=
                frames[name][f].rolls;


            const rollsDiv=
                document.createElement("div");

            rollsDiv.className="rolls";


            const amount=
                f===9 ? 3 : 2;


            for(
                let r=0;
                r<amount;
                r++
            ){

                const roll=
                    document.createElement(
                        "div"
                    );

                roll.className="roll";

                roll.textContent=
                    formatRoll(
                        rolls[r]
                    );

                rollsDiv.appendChild(
                    roll
                );
            }


            cell.appendChild(
                rollsDiv
            );


            const score=
                document.createElement("div");

            score.className=
                "frame-score";


            if(scores[f]!==null){

                score.textContent=
                    scores[f];
            }


            cell.appendChild(
                score
            );

            row.appendChild(cell);
        }


        /* TOTAL */

        const total=
            document.createElement("td");

        total.className=
            "total-cell";

        total.textContent=
            calculateTotal(name);

        row.appendChild(total);

        body.appendChild(row);
    });


    if(players.length){

        document.getElementById(
            "scoreMessage"
        ).textContent=
            "Current player: "+
            players[currentPlayer];


        document.getElementById(
            "homeCurrent"
        ).textContent=
            gameStarted
                ? "Current player: "+
                  players[currentPlayer]
                : "Game not started";

    }else{

        document.getElementById(
            "scoreMessage"
        ).textContent=
            "Add players from the phone.";

        document.getElementById(
            "homeCurrent"
        ).textContent=
            "No players";
    }
}


/* =========================
   PINS
========================= */

function renderPins(){

    const rack=
        document.getElementById(
            "tvPins"
        );

    rack.innerHTML="";


    [
        [0],
        [1,2],
        [3,4,5]
    ].forEach(indexes=>{

        const row=
            document.createElement(
                "div"
            );

        row.className="pin-row";


        indexes.forEach(i=>{

            const pin=
                document.createElement(
                    "div"
                );

            pin.className="pin";


            if(!pins[i]){
                pin.classList.add("down");
            }


            if(splitPins[i]){
                pin.classList.add("split");
            }


            row.appendChild(pin);
        });


        rack.appendChild(row);
    });
}


/* =========================
   BACKGROUND
========================= */

function changeBackground(value){

    const backgrounds={

        dark:"#111",
        blue:"#06152e",
        green:"#062414",
        purple:"#19062e",
        red:"#2e0606"
    };


    if(backgrounds[value]){

        document.body.style.background=
            backgrounds[value];
    }
}


/* =========================
   SEND STATE
========================= */

function sendState(){

    if(!connection) return;

    if(connection.open){

        connection.send({

            type:"state",

            players:[...players],

            currentPlayer:
                currentPlayer,

            gameStarted:
                gameStarted,

            frames:
                JSON.parse(
                    JSON.stringify(frames)
                ),

            pins:[...pins],

            splitPins:[...splitPins]
        });
    }
}


/* =========================
   REMOTE COMMANDS
========================= */

function handleRemote(data){

    if(!data || !data.type){
        return;
    }


    switch(data.type){

        case "roll":

            addRoll(data.value);

            break;


        case "strike":

            doStrike();

            break;


        case "spare":

            doSpare();

            break;


        case "previous":

            previousPlayer();

            break;


        case "next":

            nextPlayer();

            break;


        case "reset":

            resetGame();

            break;


        case "addPlayer":

            if(
                typeof data.name==="string" &&
                data.name.trim()
            ){

                const name=
                    data.name.trim();


                if(!players.includes(name)){

                    players.push(name);

                    frames[name]=
                        newFrames();

                    renderScore();
                    sendState();
                }
            }

            break;


        case "removePlayer":

            if(
                Number.isInteger(data.index) &&
                data.index>=0 &&
                data.index<players.length
            ){

                const removed=
                    players[data.index];

                players.splice(
                    data.index,
                    1
                );

                delete frames[removed];


                if(
                    currentPlayer>=
                    players.length
                ){

                    currentPlayer=
                        Math.max(
                            0,
                            players.length-1
                        );
                }


                renderScore();
                sendState();
            }

            break;


        case "start":

            if(players.length>0){

                gameStarted=true;

                currentPlayer=0;

                renderScore();
                sendState();

                showScreen("score");
            }

            break;


        case "pinSubmit":

            if(Array.isArray(data.pins)){

                pins=
                    [...data.pins]
                    .slice(0,6);
            }


            if(
                Array.isArray(
                    data.splitPins
                )
            ){

                splitPins=
                    [...data.splitPins]
                    .slice(0,6);
            }


            while(pins.length<6){
                pins.push(true);
            }

            while(splitPins.length<6){
                splitPins.push(false);
            }


            renderPins();
            sendState();

            break;


        case "rack":

            pins=
                Array(6).fill(true);

            splitPins=
                Array(6).fill(false);

            renderPins();
            sendState();

            break;


        case "clearPins":

            pins=
                Array(6).fill(false);

            splitPins=
                Array(6).fill(false);

            renderPins();
            sendState();

            break;


        case "background":

            changeBackground(
                data.value
            );

            sendState();

            break;


        case "end":

            gameStarted=false;

            showScreen("welcome");

            setTimeout(()=>{

                showScreen("home");

            },3000);

            sendState();

            break;
    }
}


/* =========================
   PEER
========================= */

function randomCode(){

    const chars=
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result="";


    for(let i=0;i<6;i++){

        result+=
            chars[
                Math.floor(
                    Math.random()*
                    chars.length
                )
            ];
    }


    return result;
}


function setupPeer(){

    const code=
        randomCode();


    peer=new Peer(
        "kgl-"+code,
        {
            debug:0
        }
    );


    document.getElementById(
        "remoteCode"
    ).textContent=code;


    peer.on("open",()=>{

        document.getElementById(
            "connectionStatus"
        ).textContent=
            "Remote ready — enter this code on the phone.";
    });


    peer.on(
        "connection",
        conn=>{

        connection=conn;


        document.getElementById(
            "connectionStatus"
        ).textContent=
            "Phone remote connected ✓";


        conn.on("open",()=>{

            sendState();
        });


        conn.on(
            "data",
            handleRemote
        );


        conn.on("close",()=>{

            connection=null;


            document.getElementById(
                "connectionStatus"
            ).textContent=
                "Remote disconnected";
        });

    });


    peer.on("error",error=>{

        console.log(error);


        document.getElementById(
            "connectionStatus"
        ).textContent=
            "Connection error — refresh this page.";
    });
}


/* =========================
   START
========================= */

renderPins();
renderScore();
setupPeer();


setTimeout(()=>{

    showScreen("home");

},3000);

</script>
