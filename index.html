<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Gavin Lanes</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font:inherit;
    cursor:pointer;
}

.screen{
    min-height:100vh;
    display:none;
    padding:30px;
}

.screen.active{
    display:block;
}

/* WELCOME */

#welcome{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#111;
}

.welcome-box{
    animation:welcomeFade 3s forwards;
}

.welcome-box h1{
    font-size:clamp(38px,7vw,90px);
    margin:0;
}

.welcome-box p{
    font-size:22px;
    opacity:.8;
}

@keyframes welcomeFade{
    0%{opacity:0}
    15%{opacity:1}
    75%{opacity:1}
    100%{opacity:0}
}

/* HOME */

#home{
    text-align:center;
}

.logo{
    font-size:clamp(35px,6vw,70px);
    margin:30px 0 10px;
}

.status{
    font-size:18px;
    opacity:.8;
    margin:10px;
}

.code{
    font-size:clamp(30px,5vw,55px);
    font-weight:bold;
    letter-spacing:5px;
    margin:20px;
}

.current{
    font-size:25px;
    margin-top:30px;
}

/* SCORE */

.score-title{
    text-align:center;
    font-size:40px;
    margin:0 0 25px;
}

.score-wrap{
    width:100%;
    overflow-x:auto;
}

.score-table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
    table-layout:fixed;
}

.score-table th,
.score-table td{
    border:2px solid white;
    text-align:center;
    padding:8px;
}

.score-table th{
    background:#222;
    font-size:18px;
}

.player-name{
    width:170px;
    text-align:left!important;
    font-weight:bold;
    font-size:20px;
}

.frame-cell{
    height:100px;
    position:relative;
}

.frame-cell.current-frame{
    background:#333;
    box-shadow:inset 0 0 0 4px #fff;
}

.rolls{
    display:flex;
    justify-content:center;
    gap:3px;
}

.roll{
    border:1px solid #aaa;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.frame-score{
    font-size:25px;
    margin-top:10px;
}

.total-cell{
    width:100px;
    font-size:28px;
    font-weight:bold;
}

.active-player{
    background:#333;
}

/* PINSETTER */

.pinsetter{
    text-align:center;
}

.pin-rack{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin:35px auto;
}

.pin-row{
    display:flex;
    gap:18px;
}

.pin{
    width:55px;
    height:75px;
    border-radius:50% 50% 45% 45%;
    border:4px solid white;
    background:white;
    position:relative;
    transition:.2s;
}

.pin.down{
    background:#555;
    border-color:#777;
}

.pin.split{
    border-color:red;
}

.pin.split::after{
    content:"";
    width:12px;
    height:12px;
    background:red;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* MESSAGE */

.message{
    text-align:center;
    font-size:22px;
    margin-top:25px;
}
</style>
</head>

<body>

<!-- WELCOME -->
<section id="welcome" class="screen active">
    <div class="welcome-box">
        <h1>Welcome To King Gavin Lanes</h1>
        <p>6-Pin Bowling</p>
    </div>
</section>

<!-- HOME -->
<section id="home" class="screen">
    <h1 class="logo">🎳 King Gavin Lanes</h1>

    <div class="status" id="connectionStatus">
        Starting remote connection...
    </div>

    <div class="code" id="remoteCode">
        ------
    </div>

    <div class="current" id="homeCurrent">
        Game not started
    </div>
</section>

<!-- SCORE -->
<section id="score" class="screen">

    <h1 class="score-title">🎳 King Gavin Lanes</h1>

    <div class="score-wrap">
        <table class="score-table">
            <thead>
                <tr>
                    <th class="player-name">Player</th>
                    <th>1</th>
                    <th>2</th>
                    <th>3</th>
                    <th>4</th>
                    <th>5</th>
                    <th>6</th>
                    <th>7</th>
                    <th>8</th>
                    <th>9</th>
                    <th>10</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="scoreBody"></tbody>
        </table>
    </div>

    <div class="message" id="scoreMessage"></div>
</section>

<!-- PINSETTER -->
<section id="pinsetter" class="screen">

    <h1 class="score-title">Pinsetter</h1>

    <div class="pin-rack" id="tvPins"></div>

    <div class="message">
        Waiting for pinsetter command...
    </div>
</section>

<script>
/* =========================================================
   KING GAVIN LANES — SIX PIN BOWLING ENGINE
   ========================================================= */

const PIN_COUNT = 6;
const FRAME_COUNT = 10;

let players = [];
let currentPlayer = 0;
let gameStarted = false;

/*
frames[playerName] = [
    { rolls:[...] },
    ...
]
*/
let frames = {};

let pins = Array(PIN_COUNT).fill(true);
let splitPins = Array(PIN_COUNT).fill(false);

let peer;
let connection = null;


/* =========================================================
   SCREEN CONTROL
   ========================================================= */

function showScreen(id){
    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}


/* =========================================================
   WELCOME
   ========================================================= */

setTimeout(()=>{
    showScreen("home");
},3000);


/* =========================================================
   PLAYER / FRAME SETUP
   ========================================================= */

function createPlayerFrames(){
    const result=[];

    for(let i=0;i<FRAME_COUNT;i++){
        result.push({
            rolls:[]
        });
    }

    return result;
}


function ensurePlayer(name){
    if(!frames[name]){
        frames[name]=createPlayerFrames();
    }
}


/* =========================================================
   SIX PIN SCORING
   ========================================================= */

/*
   Returns every roll as an object:

   {
      value: 0-6,
      strike: true/false
   }

   A strike is worth 6.
*/

function flattenRolls(name){

    ensurePlayer(name);

    let result=[];

    for(let frame=0;frame<FRAME_COUNT;frame++){

        const rolls=frames[name][frame].rolls;

        for(const roll of rolls){

            if(roll === "X"){
                result.push({
                    value:6,
                    strike:true
                });
            }else{
                result.push({
                    value:Number(roll),
                    strike:false
                });
            }
        }
    }

    return result;
}


/*
   Calculate all ten frame scores.

   Frame 1:
   Strike = 6 + next two rolls
   Spare  = 6 + next roll
   Open   = first + second

   Frame 10:
   Simply adds its rolls.
*/

function calculateFrameScores(name){

    const rolls=flattenRolls(name);

    const scores=Array(FRAME_COUNT).fill(null);

    let index=0;

    for(let frame=0;frame<FRAME_COUNT;frame++){

        if(index >= rolls.length) break;

        const first=rolls[index];

        /* 10th frame */
        if(frame === 9){

            let total=0;

            for(let i=index;i<rolls.length;i++){
                total += rolls[i].value;
            }

            scores[frame]=Math.min(total,18);

            break;
        }

        /* STRIKE */
        if(first.strike){

            let score=6;

            if(rolls[index+1]){
                score += rolls[index+1].value;
            }

            if(rolls[index+2]){
                score += rolls[index+2].value;
            }

            scores[frame]=score;

            index += 1;
            continue;
        }

        /* Need second roll */
        if(!rolls[index+1]){
            scores[frame]=first.value;
            break;
        }

        const second=rolls[index+1];

        /* SPARE */
        if(first.value + second.value === PIN_COUNT){

            let score=PIN_COUNT;

            if(rolls[index+2]){
                score += rolls[index+2].value;
            }

            scores[frame]=score;

        }else{

            /* OPEN FRAME */
            scores[frame]=first.value + second.value;
        }

        index += 2;
    }

    return scores;
}


function calculateTotal(name){

    const scores=calculateFrameScores(name);

    let total=0;

    for(const score of scores){

        if(score !== null){
            total += score;
        }
    }

    return Math.min(total,180);
}


/* =========================================================
   ROLL VALIDATION
   ========================================================= */

function getCurrentFrame(name){

    ensurePlayer(name);

    for(let i=0;i<10;i++){

        const rolls=frames[name][i].rolls;

        if(i===9){

            if(rolls.length < 3){
                return i;
            }

            continue;
        }

        if(rolls.length === 0){
            return i;
        }

        if(rolls[0] === "X"){
            continue;
        }

        if(rolls.length < 2){
            return i;
        }
    }

    return 9;
}


function addRoll(value){

    if(players.length===0) return;

    value=Math.max(0,Math.min(PIN_COUNT,Number(value)));

    const name=players[currentPlayer];

    ensurePlayer(name);

    const frameIndex=getCurrentFrame(name);
    const frame=frames[name][frameIndex];

    /* 10th frame */
    if(frameIndex===9){

        /*
           In the 10th frame:
           - normal open frame ends after 2 rolls
           - spare gets a bonus roll
           - strike gets 2 bonus rolls
        */

        if(frame.rolls.length===0){

            if(value===PIN_COUNT){
                frame.rolls.push("X");
            }else{
                frame.rolls.push(value);
            }

            renderScore();
            sendState();
            return;
        }

        if(frame.rolls.length===1){

            if(frame.rolls[0]==="X"){

                if(value===PIN_COUNT){
                    frame.rolls.push("X");
                }else{
                    frame.rolls.push(value);
                }

                renderScore();
                sendState();
                return;
            }

            const first=Number(frame.rolls[0]);

            if(first+value===PIN_COUNT){
                frame.rolls.push(value);
                renderScore();
                sendState();
                return;
            }

            frame.rolls.push(value);

            nextPlayer();
            return;
        }

        if(frame.rolls.length===2){

            /*
               Only a strike or spare earns a third ball.
            */
            const first=frame.rolls[0];
            const second=frame.rolls[1];

            const earnedBonus =
                first==="X" ||
                (first!=="X" &&
                 Number(first)+Number(second)===PIN_COUNT);

            if(earnedBonus){

                if(value===PIN_COUNT){
                    frame.rolls.push("X");
                }else{
                    frame.rolls.push(value);
                }
            }

            renderScore();
            sendState();

            nextPlayer();
            return;
        }

        nextPlayer();
        return;
    }

    /* STRIKE */
    if(frame.rolls.length===0 && value===PIN_COUNT){

        frame.rolls.push("X");

        nextPlayer();
        return;
    }

    /* First roll */
    if(frame.rolls.length===0){

        frame.rolls.push(value);

        renderScore();
        sendState();
        return;
    }

    /* Second roll */
    if(frame.rolls.length===1){

        const first=Number(frame.rolls[0]);

        if(first+value>PIN_COUNT){
            value=PIN_COUNT-first;
        }

        frame.rolls.push(value);

        nextPlayer();
        return;
    }
}


/* =========================================================
   STRIKE / SPARE COMMANDS
   ========================================================= */

function doStrike(){

    if(players.length===0) return;

    const name=players[currentPlayer];
    const frameIndex=getCurrentFrame(name);

    if(frameIndex===9){

        addRoll(6);

    }else{

        addRoll(6);
    }
}


function doSpare(){

    if(players.length===0) return;

    const name=players[currentPlayer];
    const frameIndex=getCurrentFrame(name);

    if(frameIndex===9){

        const frame=frames[name][9];

        if(frame.rolls.length===1 && frame.rolls[0]!=="X"){

            const remaining=
                PIN_COUNT-Number(frame.rolls[0]);

            addRoll(remaining);
        }

        return;
    }

    const frame=frames[name][frameIndex];

    if(frame.rolls.length===1 && frame.rolls[0]!=="X"){

        const remaining=
            PIN_COUNT-Number(frame.rolls[0]);

        addRoll(remaining);
    }
}


/* =========================================================
   PLAYER TURN
   ========================================================= */

function nextPlayer(){

    if(players.length===0) return;

    currentPlayer++;

    if(currentPlayer>=players.length){
        currentPlayer=0;
    }

    renderScore();
    sendState();
}


function previousPlayer(){

    if(players.length===0) return;

    currentPlayer--;

    if(currentPlayer<0){
        currentPlayer=players.length-1;
    }

    renderScore();
    sendState();
}


/* =========================================================
   RESET
   ========================================================= */

function resetGame(){

    frames={};

    players.forEach(name=>{
        frames[name]=createPlayerFrames();
    });

    currentPlayer=0;
    gameStarted=false;

    renderScore();
    sendState();

    showScreen("home");
}


/* =========================================================
   SCORE DISPLAY
   ========================================================= */

function formatRoll(roll){

    if(roll===undefined) return "";

    if(roll==="X") return "X";

    if(Number(roll)===0) return "-";

    return String(roll);
}


function renderScore(){

    const body=document.getElementById("scoreBody");

    body.innerHTML="";

    players.forEach((name,playerIndex)=>{

        ensurePlayer(name);

        const row=document.createElement("tr");

        const nameCell=document.createElement("td");

        nameCell.className=
            "player-name " +
            (playerIndex===currentPlayer ? "active-player":"");

        nameCell.textContent=name;

        row.appendChild(nameCell);

        const scores=calculateFrameScores(name);

        for(let frameIndex=0;frameIndex<10;frameIndex++){

            const cell=document.createElement("td");

            cell.className="frame-cell";

            if(
                playerIndex===currentPlayer &&
                gameStarted &&
                getCurrentFrame(name)===frameIndex
            ){
                cell.classList.add("current-frame");
            }

            const rolls=frames[name][frameIndex].rolls;

            const rollsDiv=document.createElement("div");
            rollsDiv.className="rolls";

            /*
               Show up to 3 rolls in frame 10.
            */
            const maxRolls=frameIndex===9 ? 3 : 2;

            for(let r=0;r<maxRolls;r++){

                const rollDiv=document.createElement("div");
                rollDiv.className="roll";

                rollDiv.textContent=
                    formatRoll(rolls[r]);

                rollsDiv.appendChild(rollDiv);
            }

            cell.appendChild(rollsDiv);

            const scoreDiv=document.createElement("div");
            scoreDiv.className="frame-score";

            if(scores[frameIndex]!==null){
                scoreDiv.textContent=scores[frameIndex];
            }

            cell.appendChild(scoreDiv);

            row.appendChild(cell);
        }

        const total=document.createElement("td");

        total.className="total-cell";
        total.textContent=calculateTotal(name);

        row.appendChild(total);

        body.appendChild(row);
    });

    if(players.length>0){

        document.getElementById("scoreMessage").textContent =
            "Current player: " + players[currentPlayer];

        document.getElementById("homeCurrent").textContent =
            gameStarted
                ? "Current player: " + players[currentPlayer]
                : "Game not started";
    }else{

        document.getElementById("scoreMessage").textContent =
            "Add players from the phone remote.";

        document.getElementById("homeCurrent").textContent =
            "No players";
    }
}


/* =========================================================
   PINSETTER
   ========================================================= */

function renderPins(){

    const rack=document.getElementById("tvPins");

    rack.innerHTML="";

    const rows=[
        [0],
        [1,2],
        [3,4,5]
    ];

    rows.forEach(rowIndexes=>{

        const row=document.createElement("div");
        row.className="pin-row";

        rowIndexes.forEach(index=>{

            const pin=document.createElement("div");

            pin.className="pin";

            if(!pins[index]){
                pin.classList.add("down");
            }

            if(splitPins[index]){
                pin.classList.add("split");
            }

            row.appendChild(pin);
        });

        rack.appendChild(row);
    });
}


/* =========================================================
   BACKGROUND
   ========================================================= */

function changeBackground(value){

    if(value==="dark"){
        document.body.style.background="#111";
    }

    if(value==="blue"){
        document.body.style.background="#06152e";
    }

    if(value==="green"){
        document.body.style.background="#062414";
    }

    if(value==="purple"){
        document.body.style.background="#19062e";
    }

    if(value==="red"){
        document.body.style.background="#2e0606";
    }
}


/* =========================================================
   PEERJS
   ========================================================= */

function generateCode(){

    const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code="";

    for(let i=0;i<6;i++){
        code += chars[Math.floor(Math.random()*chars.length)];
    }

    return code;
}


function setupPeer(){

    const code=generateCode();

    peer=new Peer(
        "kgl-"+code,
        {
            debug:1
        }
    );

    document.getElementById("remoteCode").textContent=code;

    peer.on("open",()=>{
        document.getElementById("connectionStatus").textContent=
            "Remote ready — enter this code on the phone.";
    });

    peer.on("connection",conn=>{

        connection=conn;

        document.getElementById("connectionStatus").textContent=
            "Phone remote connected ✓";

        conn.on("open",()=>{
            sendState();
        });

        conn.on("data",handleRemote);

        conn.on("close",()=>{
            connection=null;

            document.getElementById("connectionStatus").textContent=
                "Remote disconnected";
        });
    });

    peer.on("error",err=>{

        console.log(err);

        document.getElementById("connectionStatus").textContent=
            "Connection error — refresh the TV page.";
    });
}


function sendState(){

    if(!connection) return;

    if(connection.open){

        connection.send({
            type:"state",
            players:players,
            currentPlayer:currentPlayer,
            gameStarted:gameStarted,
            frames:frames,
            pins:pins,
            splitPins:splitPins
        });
    }
}


/* =========================================================
   REMOTE COMMANDS
   ========================================================= */

function handleRemote(data){

    if(!data || !data.type) return;

    switch(data.type){

        case "roll":
            addRoll(data.value);
            break;

        case "strike":
            doStrike();
            break;

        case "spare":
            doSpare();
            break;

        case "previous":
            previousPlayer();
            break;

        case "next":
            nextPlayer();
            break;

        case "reset":
            resetGame();
            break;

        case "addPlayer":

            if(
                typeof data.name==="string" &&
                data.name.trim()!==""
            ){

                const name=data.name.trim();

                if(!players.includes(name)){

                    players.push(name);

                    frames[name]=createPlayerFrames();

                    renderScore();
                    sendState();
                }
            }

            break;

        case "removePlayer":

            if(
                Number.isInteger(data.index) &&
                data.index>=0 &&
                data.index<players.length
            ){

                const removed=players[data.index];

                players.splice(data.index,1);

                delete frames[removed];

                if(currentPlayer>=players.length){
                    currentPlayer=Math.max(0,players.length-1);
                }

                renderScore();
                sendState();
            }

            break;

        case "start":

            if(players.length>0){

                gameStarted=true;

                currentPlayer=0;

                renderScore();
                sendState();

                showScreen("score");
            }

            break;

        case "pinSubmit":

            if(Array.isArray(data.pins)){

                pins=Array(PIN_COUNT).fill(true);

                for(let i=0;i<PIN_COUNT;i++){

                    if(data.pins[i]===false){
                        pins[i]=false;
                    }
                }
            }

            if(Array.isArray(data.splitPins)){

                splitPins=Array(PIN_COUNT).fill(false);

                for(let i=0;i<PIN_COUNT;i++){

                    splitPins[i]=Boolean(data.splitPins[i]);
                }
            }

            renderPins();
            sendState();

            break;

        case "rack":

            pins=Array(PIN_COUNT).fill(true);
            splitPins=Array(PIN_COUNT).fill(false);

            renderPins();
            sendState();

            break;

        case "clearPins":

            pins=Array(PIN_COUNT).fill(false);

            renderPins();
            sendState();

            break;

        case "background":

            changeBackground(data.value);
            sendState();

            break;

        case "end":

            gameStarted=false;
            showScreen("welcome");

            setTimeout(()=>{
                showScreen("home");
            },3000);

            sendState();

            break;
    }
}


/* =========================================================
   START
   ========================================================= */

renderPins();
renderScore();
setupPeer();

</script>

</body>
</html>
