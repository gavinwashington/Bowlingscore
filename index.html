<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>King Gavin Lanes</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:white;
 background:linear-gradient(135deg,#071a33,#0b315c);
 min-height:100vh;
}
header{
 height:70px;
 padding:15px 22px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:rgba(0,0,0,.25);
}
.brand{font-size:24px;font-weight:bold}
button{
 border:0;
 border-radius:12px;
 padding:13px 18px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 background:#1677ff;
 color:white;
}
button:active{transform:scale(.97)}
.container{padding:25px;max-width:1200px;margin:auto}
.page{display:none}
.page.active{display:block}
.card{
 background:rgba(255,255,255,.09);
 border-radius:18px;
 padding:25px;
 margin-bottom:20px;
}
.center{text-align:center}
h1{margin-top:0}
.bigcode{
 font-size:42px;
 font-weight:bold;
 letter-spacing:4px;
 margin:15px 0;
}
.status{font-size:18px;margin-top:10px}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:15px;
}
.menuBtn{min-height:100px;font-size:20px}
.back{background:#444}
.danger{background:#c62828}
.submit{background:#16a34a}

.player{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:14px;
 margin:8px 0;
 background:rgba(255,255,255,.08);
 border-radius:12px;
}

/* SCORECARD */

.scorecardWrap{
 width:100%;
 overflow-x:auto;
}

.scorecard{
 width:100%;
 min-width:850px;
 border-collapse:collapse;
 table-layout:fixed;
}

.scorecard th,
.scorecard td{
 border:2px solid rgba(255,255,255,.25);
 text-align:center;
}

.scorecard th{
 height:38px;
 background:rgba(0,0,0,.25);
 font-size:14px;
}

.scorecard .playerName{
 width:150px;
 text-align:left;
 padding-left:12px;
 font-size:17px;
}

.scorecard .frame{
 width:72px;
 height:95px;
}

.frameNumber{
 height:25px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:13px;
 background:rgba(0,0,0,.2);
}

.rolls{
 height:32px;
 display:flex;
 justify-content:flex-end;
 align-items:stretch;
}

.rollBox{
 width:50%;
 border-left:1px solid rgba(255,255,255,.2);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
 font-weight:bold;
}

.rollBox:first-child{border-left:0}

.frameTotal{
 height:38px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:16px;
 font-weight:bold;
}

.activeFrame{
 background:rgba(22,119,255,.35)!important;
 box-shadow:inset 0 0 0 3px #1677ff;
}

.activePlayer{
 background:rgba(22,119,255,.25)!important;
}

.totalColumn{
 width:80px;
 font-size:20px;
 font-weight:bold;
}

/* PINSETTER */

.pinArea{
 position:relative;
 width:280px;
 height:240px;
 margin:20px auto;
}

.pin{
 position:absolute;
 width:55px;
 height:55px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:white;
 color:#111;
 font-size:22px;
 font-weight:bold;
 border:3px solid #ddd;
 cursor:pointer;
 transition:.15s;
}

.pin.down{
 background:#394651;
 color:#9ba5ad;
 border-color:#53616b;
}

.pin.split{
 border:4px solid red;
 box-shadow:0 0 12px rgba(255,0,0,.7);
}

.pin.split::after{
 content:"";
 position:absolute;
 width:14px;
 height:14px;
 border-radius:50%;
 background:red;
 top:-7px;
 right:-7px;
}

.pin:nth-child(1){left:112px;top:5px}
.pin:nth-child(2){left:75px;top:75px}
.pin:nth-child(3){left:149px;top:75px}
.pin:nth-child(4){left:38px;top:145px}
.pin:nth-child(5){left:112px;top:145px}
.pin:nth-child(6){left:186px;top:145px}

.pinControls{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 max-width:500px;
 margin:auto;
}

.submit{
 width:100%;
 margin-top:15px;
}
</style>
</head>

<body>

<header>
 <div class="brand">🎳 King Gavin Lanes</div>
 <button onclick="page('menu')">☰ Menu</button>
</header>

<div class="container">

<section id="home" class="page active">
 <div class="card center">
  <h1>🎳 King Gavin Lanes</h1>

  <h2 id="homePlayer">No Game Started</h2>

  <p>Phone Remote Code</p>

  <div class="bigcode" id="remoteCode">------</div>

  <div class="status" id="connectionStatus">
   Starting remote...
  </div>
 </div>
</section>

<section id="menu" class="page">
 <div class="card">
  <h1>Menu</h1>

  <div class="grid">
   <button class="menuBtn" onclick="page('players')">
    👥 Players
   </button>

   <button class="menuBtn" onclick="page('score')">
    📊 Score
   </button>

   <button class="menuBtn" onclick="page('pinsetter')">
    🎳 Pinsetter
   </button>

   <button class="menuBtn danger" onclick="endGame()">
    🛑 End Game
   </button>
  </div>
 </div>
</section>

<section id="players" class="page">
 <div class="card">
  <h1>Players</h1>
  <div id="playersList"></div>

  <button class="back" onclick="page('menu')">
   ← Back
  </button>
 </div>
</section>

<section id="score" class="page">
 <div class="card">

  <h1 style="text-align:center">
   📊 Six-Pin Bowling
  </h1>

  <p style="text-align:center">
   Maximum Score: <b>180</b>
  </p>

  <div class="scorecardWrap">

   <table class="scorecard">

    <thead>
     <tr>
      <th class="playerName">Player</th>

      <th class="frame">1</th>
      <th class="frame">2</th>
      <th class="frame">3</th>
      <th class="frame">4</th>
      <th class="frame">5</th>
      <th class="frame">6</th>
      <th class="frame">7</th>
      <th class="frame">8</th>
      <th class="frame">9</th>
      <th class="frame">10</th>

      <th class="totalColumn">Total</th>
     </tr>
    </thead>

    <tbody id="scoreBody"></tbody>

   </table>

  </div>

  <br>

  <button class="back" onclick="page('menu')">
   ← Back
  </button>

 </div>
</section>

<section id="pinsetter" class="page">
 <div class="card center">

  <h1>🎳 Pinsetter</h1>

  <p>
   Select unavailable pins, then press Submit.
  </p>

  <div class="pinArea" id="tvPins"></div>

  <div class="pinControls">

   <button onclick="pinAction('rack')">Rack</button>
   <button onclick="pinAction('clear')">Clear</button>
   <button onclick="pinAction('sweep')">Sweep</button>
   <button onclick="pinAction('nextBall')">Next Ball</button>

   <button onclick="toggleSplit()">
    🔴 Split
   </button>

  </div>

  <button class="submit" onclick="submitPins()">
   ✅ Submit
  </button>

  <br><br>

  <button class="back" onclick="page('menu')">
   ← Back
  </button>

 </div>
</section>

</div>

<script>

/* =========================
   SIX-PIN BOWLING
========================= */

const PIN_COUNT=6;
const MAX_SCORE=180;

let players=[];
let currentPlayer=0;
let gameStarted=false;

let frames={};

let pins=Array(PIN_COUNT).fill(true);
let splitPins=[];

let pinDraft=[...pins];
let splitDraft=[];

let peer=null;
let remoteConn=null;


/* =========================
   PAGES
========================= */

function page(name){

 document.querySelectorAll(".page")
  .forEach(p=>p.classList.remove("active"));

 document.getElementById(name)
  .classList.add("active");

 update();
}


/* =========================
   PLAYERS
========================= */

function renderPlayers(){

 const box=document.getElementById("playersList");

 if(!players.length){

  box.innerHTML="<p>No players added yet.</p>";
  return;
 }

 box.innerHTML=players.map(name=>`

  <div class="player">
   <span>${escapeHtml(name)}</span>
  </div>

 `).join("");
}


/* =========================
   SCORECARD
========================= */

function renderScore(){

 const body=document.getElementById("scoreBody");

 if(!players.length){

  body.innerHTML="";
  return;
 }

 body.innerHTML=players.map((name,playerIndex)=>{

  let html=`
   <tr>

    <td class="playerName
     ${playerIndex===currentPlayer?'activePlayer':''}">
     ${escapeHtml(name)}
    </td>
  `;

  for(let frame=0;frame<10;frame++){

   const rolls=
    frames[name]?.[frame] || [];

   const active=
    gameStarted &&
    playerIndex===currentPlayer &&
    getCurrentFrame(name)===frame;

   const first=
    formatRoll(rolls,0,frame);

   const second=
    formatRoll(rolls,1,frame);

   html+=`

    <td class="frame
     ${active?'activeFrame':''}">

     <div class="frameNumber">
      ${frame+1}
     </div>

     <div class="rolls">

      <div class="rollBox">
       ${first}
      </div>

      <div class="rollBox">
       ${second}
      </div>

     </div>

     <div class="frameTotal">
      ${getFrameScore(name,frame)}
     </div>

    </td>
   `;
  }

  html+=`

    <td class="totalColumn">
     ${getTotalScore(name)}
    </td>

   </tr>
  `;

  return html;

 }).join("");
}


/* =========================
   SIX-PIN SYMBOLS
========================= */

function formatRoll(rolls,index,frame){

 const value=rolls[index];

 if(value===undefined)return "";

 if(value==="X")return "X";

 if(
  index===1 &&
  typeof rolls[0]==="number" &&
  typeof value==="number" &&
  rolls[0]+value===PIN_COUNT
 ){
  return "/";
 }

 if(value===0)return "-";

 return value;
}


/* =========================
   CURRENT FRAME
========================= */

function getCurrentFrame(name){

 if(!frames[name])return 0;

 for(let i=0;i<10;i++){

  const rolls=frames[name][i]||[];

  if(i<9){

   if(rolls.length===0){
    return i;
   }

   if(
    rolls.length===1 &&
    rolls[0]!=="X"
   ){
    return i;
   }

  }else{

   if(rolls.length<2){
    return 9;
   }
  }
 }

 return 9;
}


/* =========================
   FRAME SCORE
========================= */

function getFrameScore(name,frame){

 const rolls=
  frames[name]?.[frame] || [];

 if(!rolls.length)return "";

 /*
   Strike = 6 + next 2 rolls
 */
 if(
  frame<9 &&
  rolls[0]==="X"
 ){

  const next=getNextRolls(
   name,
   frame
  );

  if(next.length>=2){

   return PIN_COUNT+
    rollValue(next[0])+
    rollValue(next[1]);
  }

  return PIN_COUNT;
 }

 /*
   Spare = 6 + next roll
 */
 if(
  frame<9 &&
  rolls.length>=2 &&
  typeof rolls[0]==="number" &&
  typeof rolls[1]==="number" &&
  rolls[0]+rolls[1]===PIN_COUNT
 ){

  const next=getNextRolls(
   name,
   frame
  );

  if(next.length>=1){

   return PIN_COUNT+
    rollValue(next[0]);
  }

  return PIN_COUNT;
 }

 /*
   Normal frame
 */
 let total=0;

 for(const roll of rolls){
  total+=rollValue(roll);
 }

 return total;
}


/* =========================
   NEXT ROLLS
========================= */

function getNextRolls(name,frame){

 const result=[];

 for(
  let f=frame+1;
  f<10;
  f++
 ){

  const rolls=
   frames[name]?.[f] || [];

  for(const roll of rolls){

   result.push(roll);

   if(result.length>=2){
    return result;
   }
  }
 }

 return result;
}


function rollValue(value){

 if(value==="X"){
  return PIN_COUNT;
 }

 return Number(value)||0;
}


/* =========================
   TOTAL
========================= */

function getTotalScore(name){

 let total=0;

 for(let i=0;i<10;i++){

  total+=
   Number(
    getFrameScore(name,i)
   )||0;
 }

 /*
   Safety cap.
   A perfect six-pin game is 180.
 */
 return Math.min(total,MAX_SCORE);
}


/* =========================
   ADD ROLL
========================= */

function addRoll(value){

 if(!gameStarted || !players.length){
  return;
 }

 const name=players[currentPlayer];

 if(!frames[name]){

  frames[name]=Array.from(
   {length:10},
   ()=>[]
  );
 }

 const frame=getCurrentFrame(name);
 const rolls=frames[name][frame];

 if(frame<9){

  /*
    STRIKE
  */
  if(value==="X"){

   if(rolls.length===0){

    rolls.push("X");

    nextPlayer();
   }

  }else{

   /*
     Six-pin maximum.
     Prevent numbers above 6.
   */
   value=Math.max(
    0,
    Math.min(
     PIN_COUNT,
     Number(value)
    )
   );

   if(rolls.length===0){

    rolls.push(value);

   }else if(rolls.length===1){

    /*
      A second roll cannot make
      the frame exceed 6.
    */
    const remaining=
     Math.max(
      0,
      PIN_COUNT-rollValue(rolls[0])
     );

    value=Math.min(
     value,
     remaining
    );

    rolls.push(value);

    nextPlayer();
   }
  }

 }else{

  /*
    10th frame.
    Up to 3 rolls if strike/spare.
  */

  if(rolls.length>=3)return;

  if(value!=="X"){

   value=Math.max(
    0,
    Math.min(
     PIN_COUNT,
     Number(value)
    )
   );

   if(rolls.length===1){

    const remaining=
     Math.max(
      0,
      PIN_COUNT-rollValue(rolls[0])
     );

    /*
      If first roll wasn't strike,
      second roll cannot exceed remaining.
    */
    if(
     rolls[0]!=="X"
    ){
     value=Math.min(
      value,
      remaining
     );
    }
   }
  }

  rolls.push(value);

  if(rolls.length===2){

   const first=
    rollValue(rolls[0]);

   const second=
    rollValue(rolls[1]);

   const bonus=
    rolls[0]==="X" ||
    first+second===PIN_COUNT;

   if(!bonus){

    nextPlayer();
   }

  }else if(rolls.length===3){

   nextPlayer();
  }
 }

 sendState();
 update();
}


/* =========================
   TURN
========================= */

function nextPlayer(){

 if(!players.length)return;

 currentPlayer=
  (currentPlayer+1)%players.length;
}

function previousPlayer(){

 if(!players.length)return;

 currentPlayer=
  (currentPlayer-1+players.length)
  %players.length;
}


/* =========================
   START
========================= */

function startGame(){

 if(!players.length)return;

 gameStarted=true;
 currentPlayer=0;

 players.forEach(name=>{

  frames[name]=Array.from(
   {length:10},
   ()=>[]
  );

 });

 sendState();
 update();

 page("score");
}


/* =========================
   END
========================= */

function endGame(){

 players=[];
 currentPlayer=0;
 gameStarted=false;
 frames={};

 pins=Array(PIN_COUNT).fill(true);
 splitPins=[];

 pinDraft=[...pins];
 splitDraft=[];

 sendState();
 page("home");
}


/* =========================
   REMOTE COMMANDS
========================= */

function handleRemote(msg){

 if(msg.type==="roll"){

  addRoll(Number(msg.value));
  return;
 }

 if(msg.type==="strike"){

  addRoll("X");
  return;
 }

 if(msg.type==="spare"){

  if(!gameStarted || !players.length)return;

  const name=players[currentPlayer];
  const frame=getCurrentFrame(name);

  if(frame>=10)return;

  const rolls=frames[name][frame];

  if(
   rolls.length===1 &&
   typeof rolls[0]==="number"
  ){

   rolls[1]=
    PIN_COUNT-rolls[0];

   nextPlayer();

   sendState();
   update();
  }

  return;
 }

 if(msg.type==="previous"){

  previousPlayer();
  sendState();
  update();

  return;
 }

 if(msg.type==="next"){

  nextPlayer();
  sendState();
  update();

  return;
 }

 if(msg.type==="reset"){

  players.forEach(name=>{

   frames[name]=Array.from(
    {length:10},
    ()=>[]
   );
  });

  currentPlayer=0;

  sendState();
  update();

  return;
 }

 if(msg.type==="addPlayer"){

  const name=
   String(msg.name||"").trim();

  if(
   name &&
   !players.includes(name)
  ){

   players.push(name);

   frames[name]=Array.from(
    {length:10},
    ()=>[]
   );

   sendState();
   update();
  }

  return;
 }

 if(msg.type==="removePlayer"){

  const index=Number(msg.index);

  if(
   index>=0 &&
   index<players.length
  ){

   const removed=
    players[index];

   players.splice(index,1);

   delete frames[removed];

   if(
    currentPlayer>=players.length
   ){

    currentPlayer=
     Math.max(
      0,
      players.length-1
     );
   }

   sendState();
   update();
  }

  return;
 }

 if(msg.type==="start"){

  startGame();
  return;
 }

 if(msg.type==="pinSubmit"){

  if(Array.isArray(msg.pins)){
   pins=msg.pins.slice(0,PIN_COUNT);
  }

  while(pins.length<PIN_COUNT){
   pins.push(true);
  }

  splitPins=
   Array.isArray(msg.splitPins)
    ? msg.splitPins
    : [];

  pinDraft=[...pins];
  splitDraft=[...splitPins];

  sendState();
  update();

  return;
 }

 if(msg.type==="background"){

  applyBackground(msg.value);
  return;
 }

 if(msg.type==="end"){

  endGame();
  return;
 }
}


/* =========================
   PINSETTER
========================= */

function renderPins(){

 const box=
  document.getElementById("tvPins");

 box.innerHTML=
  pinDraft.map((available,i)=>`

   <div
    class="pin
     ${available?'':'down'}
     ${splitDraft.includes(i)?'split':''}"
    onclick="togglePin(${i})">

    ${i+1}

   </div>

  `).join("");
}


function togglePin(index){

 pinDraft[index]=
  !pinDraft[index];

 if(!pinDraft[index]){

  splitDraft=
   splitDraft.filter(
    x=>x!==index
   );
 }

 renderPins();
}


function pinAction(action){

 if(
  action==="rack" ||
  action==="nextBall"
 ){

  pinDraft=
   Array(PIN_COUNT).fill(true);

  splitDraft=[];
 }

 if(
  action==="clear" ||
  action==="sweep"
 ){

  pinDraft=
   Array(PIN_COUNT).fill(false);

  splitDraft=[];
 }

 renderPins();
}


function toggleSplit(){

 splitDraft=[];

 pinDraft.forEach(
  (available,i)=>{

   if(available){
    splitDraft.push(i);
   }

  }
 );

 renderPins();
}


function submitPins(){

 pins=[...pinDraft];
 splitPins=[...splitDraft];

 sendState();
 update();
}


/* =========================
   BACKGROUND
========================= */

function applyBackground(value){

 const backgrounds={

  midnight:
   "linear-gradient(135deg,#071a33,#0b315c)",

  black:"#050505",

  purple:
   "linear-gradient(135deg,#24103d,#581c87)",

  green:
   "linear-gradient(135deg,#052e16,#166534)",

  blue:
   "linear-gradient(135deg,#082f49,#0369a1)",

  warm:
   "linear-gradient(135deg,#431407,#9a3412)"
 };

 document.body.style.background=
  backgrounds[value]||
  backgrounds.midnight;
}


/* =========================
   STATE
========================= */

function sendState(){

 if(
  !remoteConn||
  !remoteConn.open
 )return;

 remoteConn.send({

  type:"state",

  players:players,

  currentPlayer:
   currentPlayer,

  gameStarted:
   gameStarted,

  frames:
   frames,

  pins:
   pins,

  splitPins:
   splitPins
 });
}


/* =========================
   PEERJS
========================= */

function createRemote(){

 const code=
  Math.random()
   .toString(36)
   .substring(2,8)
   .toUpperCase();

 const peerId="kgl-"+code;

 document.getElementById(
  "remoteCode"
 ).textContent=code;

 peer=new Peer(peerId,{
  debug:1
 });

 peer.on("open",()=>{

  document.getElementById(
   "connectionStatus"
  ).textContent=
   "Waiting for phone remote...";

 });

 peer.on("connection",conn=>{

  remoteConn=conn;

  conn.on("open",()=>{

   document.getElementById(
    "connectionStatus"
   ).textContent=
   "📱 Phone remote connected!";

   sendState();
  });

  conn.on("data",msg=>{

   handleRemote(msg);
  });

  conn.on("close",()=>{

   remoteConn=null;

   document.getElementById(
    "connectionStatus"
   ).textContent=
   "Waiting for phone remote...";
  });

 });

 peer.on("error",err=>{

  console.log("PeerJS error:",err);

  document.getElementById(
   "connectionStatus"
  ).textContent=
   "Remote error: "+err.type;
 });

 peer.on("disconnected",()=>{

  try{
   peer.reconnect();
  }catch(e){}

 });
}


/* =========================
   UPDATE
========================= */

function update(){

 renderPlayers();
 renderScore();
 renderPins();

 document.getElementById(
  "homePlayer"
 ).textContent=

  players.length&&gameStarted

   ? "Current Player: "+
     players[currentPlayer]

   : "No Game Started";
}


function escapeHtml(text){

 return String(text)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

createRemote();
update();

</script>

</body>
</html>
