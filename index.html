<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>King Gavin Lanes Scoreboard</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#111827;
color:#fff;
}

.wrap{
padding:15px;
max-width:1000px;
margin:auto;
}

.header{
background:#080b12;
padding:20px;
border-radius:14px;
margin-bottom:15px;
}

.header h1{
margin:0;
font-size:27px;
}

.status{
margin-top:8px;
font-weight:800;
}

.online{
color:#4ade80;
}

.offline{
color:#f87171;
}

.connect{
background:#1f2937;
padding:18px;
border-radius:14px;
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border-radius:8px;
border:1px solid #4b5563;
background:#111827;
color:#fff;
font-size:17px;
}

button{
border:0;
border-radius:8px;
padding:13px;
background:#2563eb;
color:#fff;
font-weight:800;
font-size:16px;
}

.connectRow{
display:grid;
grid-template-columns:1fr auto;
gap:8px;
margin-top:10px;
}

.players{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:15px;
}

.player{
background:#1f2937;
border-radius:10px;
padding:13px 17px;
font-weight:800;
white-space:nowrap;
}

.player.active{
background:#1d4ed8;
outline:2px solid #60a5fa;
}

.current{
background:#1f2937;
border-radius:14px;
padding:18px;
margin-bottom:15px;
}

.currentName{
font-size:23px;
font-weight:800;
}

.total{
font-size:45px;
font-weight:900;
margin-top:5px;
}

.board{
display:flex;
gap:5px;
overflow-x:auto;
padding-bottom:8px;
}

.frame{
min-width:85px;
background:#1f2937;
border-radius:9px;
overflow:hidden;
border:1px solid #374151;
}

.frameTitle{
background:#374151;
padding:8px;
text-align:center;
font-size:12px;
font-weight:800;
}

.rolls{
display:grid;
grid-template-columns:1fr 1fr;
min-height:50px;
}

.tenth .rolls{
grid-template-columns:repeat(3,1fr);
}

.roll{
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:900;
border-right:1px solid #374151;
}

.score{
border-top:1px solid #374151;
padding:10px;
text-align:center;
font-size:19px;
font-weight:900;
}

.pinsetter{
background:#1f2937;
padding:16px;
border-radius:14px;
margin-top:15px;
font-weight:800;
}

@media(max-width:500px){

.frame{
min-width:72px;
}

.roll{
font-size:17px;
}

.total{
font-size:38px;
}

}

</style>

</head>

<body>

<div class="wrap">


<div class="header">

<h1>🎳 KING GAVIN LANES</h1>

<div>
Live Phone Scoreboard
</div>

<div
id="status"
class="status offline">

● Not connected

</div>

</div>


<div
class="connect"
id="connectBox">

<strong>
Connect to Bowl Site
</strong>

<div
style="color:#9ca3af;margin-top:7px">

Enter the same 6-character code
shown on the iPad.

</div>


<div class="connectRow">

<input
id="code"
maxlength="6"
placeholder="ABC123"
autocapitalize="characters">

<button id="connect">
CONNECT
</button>

</div>

</div>


<div
id="scoreboard"
style="display:none">


<div
id="players"
class="players">
</div>


<div class="current">

<div
id="currentName"
class="currentName">
Waiting…
</div>

<div
id="total"
class="total">
0
</div>

</div>


<div
id="board"
class="board">
</div>


<div class="pinsetter">

⚙️ Pinsetter Status:
<span id="pinStatus">
READY
</span>

</div>


</div>

</div>


<script>

let peer=null;
let conn=null;
let state=null;

const $=id=>
document.getElementById(id);


/* STATUS */

function setStatus(text,ok){

$("status").textContent=
"● "+text;

$("status").className=
"status "+
(ok?"online":"offline");

}


/* FRAMES */

function getFrames(rolls){

const f=[];
let i=0;

for(let n=0;n<9;n++){

if(i>=rolls.length){

f.push([]);

continue;

}

if(rolls[i]===10){

f.push([10]);
i++;

}

else{

if(rolls[i+1]!==undefined){

f.push([
rolls[i],
rolls[i+1]
]);

i+=2;

}

else{

f.push([rolls[i]]);
i++;

}

}

}

f.push(
rolls.slice(i,i+3)
);

return f;

}


/* SCORE */

function calculateScores(rolls){

const f=getFrames(rolls);

const out=[];

let total=0;


for(let i=0;i<10;i++){

const a=f[i]||[];

if(!a.length){

out.push(null);
continue;

}


if(i===9){

if(a.length>=2){

const previous=
out.filter(
x=>x!==null
).at(-1)||0;

total=
previous+
a.reduce(
(x,y)=>x+y,
0
);

out.push(total);

}

else{

out.push(null);

}

continue;

}


if(a[0]===10){

const n=f[i+1]||[];
const m=f[i+2]||[];

if(n.length<2){

out.push(null);
continue;

}

let bonus;

if(n[0]===10){

if(!m.length){

out.push(null);
continue;

}

bonus=10+m[0];

}

else{

bonus=n[0]+n[1];

}

total+=10+bonus;

out.push(total);

}


else if(
a.length>=2 &&
a[0]+a[1]===10
){

const n=f[i+1]||[];

if(!n.length){

out.push(null);
continue;

}

total+=10+n[0];

out.push(total);

}


else if(a.length>=2){

total+=
a[0]+a[1];

out.push(total);

}


else{

out.push(null);

}

}

return out;

}


/* RENDER */

function render(){

if(!state)
return;


$("scoreboard").style.display=
state.players.length
?"block"
:"none";


$("players").innerHTML="";


state.players.forEach((p,i)=>{

const d=
document.createElement("div");

d.className=
"player"+
(i===state.currentPlayer
?" active":"");

d.textContent=p.name;

$("players")
.appendChild(d);

});


if(!state.players.length)
return;


const p=
state.players[state.currentPlayer];

$("currentName").textContent=
"🎳 "+p.name;


const scores=
calculateScores(p.rolls);


let total=0;

scores.forEach(x=>{

if(x!==null)
total=x;

});


$("total").textContent=
total;


$("board").innerHTML="";


const f=
getFrames(p.rolls);


for(let i=0;i<10;i++){

const box=
document.createElement("div");

box.className=
"frame"+
(i===9?" tenth":"");


const title=
document.createElement("div");

title.className=
"frameTitle";

title.textContent=
"FRAME "+(i+1);

box.appendChild(title);


const rolls=
document.createElement("div");

rolls.className="rolls";


const a=f[i]||[];


const count=
i===9?3:2;


for(let j=0;j<count;j++){

const r=
document.createElement("div");

r.className="roll";

const v=a[j];

if(v===undefined)
r.textContent="";

else if(v===10)
r.textContent="X";

else if(
i<9 &&
j===1 &&
a[0]+v===10
)
r.textContent="/";

else
r.textContent=v;


rolls.appendChild(r);

}


box.appendChild(rolls);


const sc=
document.createElement("div");

sc.className="score";

sc.textContent=
scores[i]??"";

box.appendChild(sc);


$("board")
.appendChild(box);

}


$("pinStatus").textContent=
state.pinsetterState||"READY";

}


/* CONNECT */

function connect(){

const code=
$("code")
.value
.trim()
.toUpperCase()
.replace(
/[^A-Z0-9]/g,
""
);


if(code.length!==6){

alert(
"Enter the 6-character Bowl Site code."
);

return;

}


if(peer)
peer.destroy();


peer=new Peer();


peer.on("open",()=>{

conn=
peer.connect(
"kgl-"+code,
{reliable:true}
);


conn.on("open",()=>{

setStatus(
"CONNECTED 🟢",
true
);

$("connectBox")
.style.display="none";

});


conn.on("data",msg=>{

if(msg.type==="state"){

state=msg.state;

render();

}

});


conn.on("close",()=>{

setStatus(
"Disconnected",
false
);

$("connectBox")
.style.display="block";

});

});


peer.on("error",()=>{

setStatus(
"Connection failed",
false
);

alert(
"Couldn't connect. Check the code."
);

});

}


$("connect").onclick=
connect;


$("code").addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
connect();

});

</script>

</body>
</html>
