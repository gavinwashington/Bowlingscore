<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>King Gavin Lanes</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#07111f;
 color:#fff;
 font-family:Arial,sans-serif
}
header{
 height:62px;
 background:#0d1d32;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 border-bottom:1px solid #29405d
}
h1{font-size:20px;margin:0}
.wrap{max-width:1100px;margin:auto;padding:18px}
button,input,select{font:inherit}
button{
 border:0;
 border-radius:12px;
 padding:12px 15px;
 background:#173354;
 color:#fff;
 cursor:pointer
}
button:hover{background:#21466f}
.danger{background:#7d2630}
.good{background:#17603e}
.page{display:none}
.page.active{display:block}
.grid{display:grid;gap:12px}
.menuGrid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{
 background:#0d1d32;
 border:1px solid #29405d;
 border-radius:16px;
 padding:16px
}
.big{font-size:24px;font-weight:bold}
input,select{
 width:100%;
 padding:13px;
 border-radius:10px;
 border:1px solid #385271;
 background:#07111f;
 color:#fff;
 margin:6px 0 10px
}
.row{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 align-items:center
}
.muted{color:#9eb0c5}
.status{
 padding:8px 12px;
 border-radius:999px;
 background:#23364e;
 display:inline-block
}
#welcome{
 position:fixed;
 inset:0;
 background:#06101c;
 z-index:99;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 transition:opacity 1.2s
}
#welcome.hide{
 opacity:0;
 pointer-events:none
}
.welcomeTitle{
 font-size:clamp(32px,7vw,70px);
 font-weight:bold
}
.frames{
 display:grid;
 grid-template-columns:repeat(10,minmax(75px,1fr));
 gap:7px;
 overflow:auto
}
.frame{
 background:#132943;
 border:1px solid #385271;
 border-radius:10px;
 padding:8px;
 min-height:100px
}
.frame b{display:block;margin-bottom:7px}
.rolls{font-size:18px;min-height:25px}
.frameTotal{font-size:25px;font-weight:bold;margin-top:8px}
.remoteDot{font-size:14px}

/* SIX PIN RACK */
.pinbox{
 display:grid;
 grid-template-columns:repeat(6,55px);
 grid-template-rows:repeat(3,65px);
 justify-content:center;
 align-items:center;
 gap:0;
 max-width:360px;
 margin:20px auto
}
.pin{
 height:50px;
 width:50px;
 background:#f4f4f4;
 color:#111;
 border-radius:50%;
 padding:0;
 margin:0;
 position:relative;
 border:3px solid #fff
}
.pin.down{
 background:#555;
 color:#aaa;
 opacity:.5
}
.pin.split{
 background:#c62828;
 color:#fff;
 border-color:#ff7777;
 box-shadow:0 0 15px #f33
}
.pin.split:after{
 content:"";
 position:absolute;
 width:12px;
 height:12px;
 border-radius:50%;
 background:#fff;
 top:2px;
 right:2px
}
.pin:nth-child(1){grid-column:3/span 2;grid-row:1}
.pin:nth-child(2){grid-column:2/span 2;grid-row:2}
.pin:nth-child(3){grid-column:4/span 2;grid-row:2}
.pin:nth-child(4){grid-column:1/span 2;grid-row:3}
.pin:nth-child(5){grid-column:3/span 2;grid-row:3}
.pin:nth-child(6){grid-column:5/span 2;grid-row:3}

#toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#132943;
 padding:12px 18px;
 border-radius:12px;
 display:none;
 z-index:200
}

.bgButton{min-width:120px}
</style>
</head>

<body>

<div id="welcome">
 <div>
  <div class="welcomeTitle">🎳 Welcome To<br>King Gavin Lanes</div>
  <p class="muted">Bowling Score System</p>
 </div>
</div>

<header>
 <h1>🎳 KING GAVIN LANES</h1>
 <button onclick="showPage('menu')">☰ MENU</button>
</header>

<main class="wrap">

<!-- EXACT PREVIOUS MENU -->
<section id="menu" class="page active">
 <div class="card">
  <h2>Menu</h2>
  <div class="grid menuGrid">
   <button onclick="showPage('players')">👥 Players</button>
   <button onclick="showPage('score')">🎳 Score</button>
   <button onclick="showPage('editor')">✏️ Score Editor</button>
   <button onclick="showPage('recap')">📋 Recap</button>
   <button onclick="showPage('backgrounds')">🖼️ Backgrounds</button>
   <button onclick="showPage('pinsetter')">⚙️ Pinsetter</button>
   <button class="danger" onclick="endGame()">⏹ End Game</button>
  </div>
 </div>
</section>

<section id="players" class="page">
 <button onclick="showPage('menu')">← Back</button>

 <div class="grid" style="margin-top:12px">
  <div class="card">
   <h2>Players</h2>

   <input id="playerName"
    placeholder="Type player name..."
    autocomplete="off">

   <div class="row">
    <button class="good" onclick="addPlayer()">＋ Add Player</button>
    <button onclick="focusName()">⌨️ Type</button>
   </div>

   <div id="playerList"></div>

   <hr>

   <div>
    Game code:
    <span class="big" id="gameCode"></span>
   </div>

   <span class="status" id="connection">
    Waiting for remote…
   </span>

   <br><br>

   <button class="good" onclick="startGame()">
    ▶ Start Bowling
   </button>
  </div>
 </div>
</section>

<section id="score" class="page">
 <button onclick="showPage('menu')">← Back</button>

 <div class="card" style="margin-top:12px">
  <div class="row">
   <h2 style="margin-right:auto">Score</h2>

   <select id="scorePlayer"
    onchange="selectPlayer(this.value)"
    style="width:auto">
   </select>
  </div>

  <div class="big" id="currentName"></div>

  <div class="muted">
   Current score:
   <span id="currentScore">0</span>
  </div>

  <br>

  <div id="frames" class="frames"></div>

  <p class="muted">
   Scoring controls are on the phone remote.
  </p>
 </div>
</section>

<section id="editor" class="page">
 <button onclick="showPage('menu')">← Back</button>

 <div class="card" style="margin-top:12px">
  <h2>Score Editor</h2>
  <select id="editPlayer" onchange="renderEditor()"></select>
  <div id="editorBox"></div>
 </div>
</section>

<section id="recap" class="page">
 <button onclick="showPage('menu')">← Back</button>

 <div class="card" style="margin-top:12px">
  <h2>Recap</h2>
  <div id="recapBox"></div>
 </div>
</section>

<section id="backgrounds" class="page">
 <button onclick="showPage('menu')">← Back</button>

 <div class="card" style="margin-top:12px">
  <h2>Backgrounds</h2>

  <div class="row">
   <button class="bgButton" onclick="bg('midnight')">Midnight</button>
   <button class="bgButton" onclick="bg('gray')">Dark Gray</button>
   <button class="bgButton" onclick="bg('green')">Green</button>
   <button class="bgButton" onclick="bg('purple')">Purple</button>
   <button class="bgButton" onclick="bg('brown')">Brown</button>
   <button class="bgButton" onclick="bg('steel')">Steel</button>
  </div>
 </div>
</section>

<section id="pinsetter" class="page">
 <button onclick="showPage('menu')">← Back</button>

 <div class="card" style="margin-top:12px">
  <h2>⚙️ Pinsetter</h2>

  <p class="muted">
   6-pin King Gavin Lanes rack.
  </p>

  <div class="row">
   <button class="good" onclick="rackPins()">🎳 Rack Pins</button>
   <button onclick="clearPins()">🧹 Clear Pins</button>
   <button onclick="sweep()">↔ Sweep</button>
   <button onclick="nextBall()">▶ Next Ball</button>
   <button onclick="toggleSplit()">🔴 Split</button>
   <button class="good" onclick="submitPins()">✅ Submit</button>
  </div>

  <h3>
   Status:
   <span id="pinStatus">Ready</span>
  </h3>

  <div id="pins" class="pinbox"></div>
 </div>
</section>

</main>

<div id="toast"></div>

<script>

let peer=null;
let conn=null;

let players=[];
let currentPlayer=0;
let pins=Array(6).fill(true);
let splitPins=[];
let gameStarted=false;

let currentBackground="midnight";

const code=Math.random()
 .toString(36)
 .slice(2,8)
 .toUpperCase();

document.getElementById("gameCode").textContent=code;


/* PAGES */

function showPage(id){
 document
  .querySelectorAll(".page")
  .forEach(x=>x.classList.remove("active"));

 document
  .getElementById(id)
  .classList.add("active");

 renderAll();
}


/* BASIC */

function focusName(){
 document.getElementById("playerName").focus();
}

function toast(t){
 let x=document.getElementById("toast");
 x.textContent=t;
 x.style.display="block";

 setTimeout(()=>{
  x.style.display="none";
 },1800);
}


/* PLAYERS */

function addPlayer(){
 let n=document.getElementById("playerName").value.trim();

 if(!n)return;

 players.push({
  name:n,
  rolls:[]
 });

 currentPlayer=players.length-1;

 document.getElementById("playerName").value="";

 renderAll();
 sendState();
}

function addRemotePlayer(n){
 n=(n||"").trim();

 if(!n)return;

 players.push({
  name:n,
  rolls:[]
 });

 currentPlayer=players.length-1;

 renderAll();
 sendState();
}

function removePlayer(i){
 players.splice(i,1);

 if(currentPlayer>=players.length)
  currentPlayer=Math.max(0,players.length-1);

 renderAll();
 sendState();
}


/* GAME */

function startGame(){

 if(!players.length){
  toast("Add at least one player");
  return;
 }

 gameStarted=true;

 showPage("score");

 sendState();
}

function endGame(){

 if(!confirm("End this game?"))
  return;

 players=[];
 currentPlayer=0;
 gameStarted=false;

 pins=Array(6).fill(true);
 splitPins=[];

 showPage("menu");

 sendState();

 let w=document.getElementById("welcome");

 w.classList.remove("hide");

 setTimeout(()=>{
  w.classList.add("hide");
 },3000);
}


/* SCORING */

function selectPlayer(i){
 currentPlayer=+i;
 renderAll();
 sendState();
}

function currentFrameInfo(){

 let p=players[currentPlayer];

 if(!p)
  return {frame:0,first:null,complete:false};

 let rolls=p.rolls;
 let frame=0;
 let i=0;

 while(frame<10){

  if(i>=rolls.length)
   return {
    frame,
    first:null,
    complete:false
   };

  let a=rolls[i];

  if(a===10){

   if(frame===9)
    return {
     frame,
     first:a,
     complete:true
    };

   if(rolls.length>=i+3){
    i++;
    frame++;
    continue;
   }

   return {
    frame,
    first:a,
    complete:false
   };
  }

  if(i+1>=rolls.length)
   return {
    frame,
    first:a,
    complete:false
   };

  i+=2;
  frame++;
 }

 return {
  frame:9,
  complete:true
 };
}

function roll(v){

 let p=players[currentPlayer];

 if(!p||!gameStarted)return;

 let info=currentFrameInfo();

 if(info.complete)return;

 let rolls=p.rolls;

 /*
 First roll:
 0-9 only.
 */
 if(info.first===null){

  if(v<0||v>9)return;

  rolls.push(v);
 }

 /*
 Second roll:
 only remaining pins.
 */
 else{

  let remaining=10-info.first;

  if(v<0||v>remaining)return;

  rolls.push(v);
 }

 renderAll();
 sendState();
}

function strike(){

 let p=players[currentPlayer];

 if(!p||!gameStarted)return;

 let info=currentFrameInfo();

 if(info.complete)return;

 if(info.first!==null)return;

 p.rolls.push(10);

 renderAll();
 sendState();
}

function spare(){

 let p=players[currentPlayer];

 if(!p||!gameStarted)return;

 let info=currentFrameInfo();

 if(info.complete)return;

 if(info.first===null||info.first===10)return;

 let remaining=10-info.first;

 p.rolls.push(remaining);

 renderAll();
 sendState();
}

function previous(){

 if(players.length){
  currentPlayer=
   (currentPlayer-1+players.length)
   %players.length;

  renderAll();
  sendState();
 }
}

function nextPlayer(){

 if(players.length){

  currentPlayer=
   (currentPlayer+1)
   %players.length;

  renderAll();
  sendState();
 }
}

function resetPlayer(){

 if(players[currentPlayer]){

  players[currentPlayer].rolls=[];

  renderAll();
  sendState();
 }
}


/* SCORE CALCULATION */

function frameData(rolls){

 let frames=[];
 let i=0;
 let score=0;

 for(let f=0;f<10;f++){

  if(i>=rolls.length){
   frames.push({
    r:[],
    score:null
   });
   continue;
  }

  let a=rolls[i];

  if(f<9&&a===10){

   let s=
    10+
    (rolls[i+1]??0)+
    (rolls[i+2]??0);

   score+=s;

   frames.push({
    r:[10],
    score
   });

   i++;

  }else{

   let b=rolls[i+1];

   if(f<9&&b!==undefined){

    let s=a+b;

    if(a+b===10)
     s+=rolls[i+2]??0;

    score+=s;

    frames.push({
     r:[a,b],
     score
    });

    i+=2;

   }else{

    score+=
     a+
     (b??0)+
     (rolls[i+2]??0);

    frames.push({
     r:rolls.slice(i,i+3),
     score
    });

    i=rolls.length;
   }
  }
 }

 return frames;
}

function total(p){

 let d=frameData(p.rolls);

 let vals=d
  .map(x=>x.score)
  .filter(x=>x!==null);

 return vals.length
  ?vals[vals.length-1]
  :0;
}


/* RENDER */

function esc(s){

 return String(s).replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[m])
 );
}

function renderPlayers(){

 let box=document.getElementById("playerList");

 box.innerHTML=
  players.length
  ?players.map((p,i)=>`
   <div class="row card" style="margin-top:8px">
    <b>${esc(p.name)}</b>
    <span style="margin-left:auto">
     ${total(p)} pts
    </span>
    <button class="danger"
     onclick="removePlayer(${i})">
     Remove
    </button>
   </div>
  `).join("")
  :'<p class="muted">No players yet.</p>';
}

function renderSelectors(){

 ["scorePlayer","editPlayer"].forEach(id=>{

  let s=document.getElementById(id);

  s.innerHTML=players.map((p,i)=>
   `<option value="${i}">
    ${esc(p.name)}
   </option>`
  ).join("");

  s.value=currentPlayer;
 });
}

function renderScore(){

 let p=players[currentPlayer];

 document.getElementById("currentName").textContent=
  p?`🎳 ${p.name}`:"No player";

 document.getElementById("currentScore").textContent=
  p?total(p):0;

 let fr=document.getElementById("frames");

 fr.innerHTML=p
  ?frameData(p.rolls).map((x,i)=>`
   <div class="frame">
    <b>Frame ${i+1}</b>
    <div class="rolls">
     ${
      x.r.map(r=>r===10?"X":r).join(" ")
      ||"—"
     }
    </div>
    <div class="frameTotal">
     ${x.score??""}
    </div>
   </div>
  `).join("")
  :"";
}

function renderEditor(){

 let p=
  players[
   +document.getElementById("editPlayer").value
  ];

 let box=document.getElementById("editorBox");

 if(!p){
  box.innerHTML="";
  return;
 }

 box.innerHTML=
  p.rolls.map((r,i)=>`
   <div class="row">
    <span>Roll ${i+1}</span>

    <input
     type="number"
     min="0"
     max="10"
     value="${r}"
     onchange="editRoll(${i},this.value)"
     style="width:100px">
   </div>
  `).join("")
  ||'<p class="muted">No rolls yet.</p>';
}

function editRoll(i,v){

 v=Math.max(
  0,
  Math.min(10,+v||0)
 );

 players[
  +document.getElementById("editPlayer").value
 ].rolls[i]=v;

 renderAll();
 sendState();
}

function renderRecap(){

 document.getElementById("recapBox").innerHTML=
  players.map(p=>`
   <div class="card" style="margin:8px 0">
    <b>${esc(p.name)}</b>
    <span style="float:right">
     ${total(p)} points
    </span>
   </div>
  `).join("")
  ||'<p class="muted">No game data.</p>';
}


/* SIX PINSETTER */

function renderPins(){

 let box=document.getElementById("pins");

 box.innerHTML=
  pins.map((v,i)=>`
   <button
    class="pin ${v?"":"down"} ${splitPins.includes(i)?"split":""}"
    onclick="togglePin(${i})">
    ${i+1}
   </button>
  `).join("");
}

function togglePin(i){

 pins[i]=!pins[i];

 if(!pins[i])
  splitPins=
   splitPins.filter(x=>x!==i);

 renderPins();

 /*
 Don't automatically submit.
 The TV's own pin controls can still
 update locally.
 */
}

function rackPins(){

 pins=Array(6).fill(true);
 splitPins=[];

 document.getElementById("pinStatus").textContent=
  "Racked";

 renderPins();
}

function clearPins(){

 pins=Array(6).fill(false);
 splitPins=[];

 document.getElementById("pinStatus").textContent=
  "Cleared";

 renderPins();
}

function sweep(){

 pins=Array(6).fill(false);
 splitPins=[];

 document.getElementById("pinStatus").textContent=
  "Sweeping…";

 renderPins();

 setTimeout(()=>{
  document.getElementById("pinStatus").textContent=
   "Ready";
 },700);
}

function nextBall(){

 pins=Array(6).fill(true);
 splitPins=[];

 document.getElementById("pinStatus").textContent=
  "Next Ball Ready";

 renderPins();
}

function toggleSplit(){

 let standing=
  pins
   .map((x,i)=>x?i:null)
   .filter(x=>x!==null);

 if(!standing.length){
  toast("No standing pins");
  return;
 }

 if(splitPins.length)
  splitPins=[];
 else
  splitPins=standing;

 renderPins();
}

function submitPins(){

 document.getElementById("pinStatus").textContent=
  "Submitted";

 sendState();

 toast("Pinsetter submitted");
}


/* BACKGROUNDS */

const backgrounds={
 midnight:"#07111f",
 gray:"#101820",
 green:"#10251c",
 purple:"#24142b",
 brown:"#261b10",
 steel:"#18202b"
};

function bg(type){

 currentBackground=type;

 document.body.style.background=
  backgrounds[type]||backgrounds.midnight;

 sendState();
}


/* EVERYTHING */

function renderAll(){

 renderPlayers();
 renderSelectors();
 renderScore();
 renderEditor();
 renderRecap();
 renderPins();

 document.body.style.background=
  backgrounds[currentBackground]||
  backgrounds.midnight;
}


/* PEER */

function send(o){

 if(conn&&conn.open)
  conn.send(o);
}

function sendState(){

 send({
  type:"state",
  state:{
   players,
   currentPlayer,
   pins,
   splitPins,
   gameStarted,
   background:currentBackground
  }
 });
}

peer=new Peer("kgl-"+code,{debug:0});

peer.on("open",()=>{
 document.getElementById("connection").textContent=
  "Remote ready to connect";
});

peer.on("connection",c=>{

 conn=c;

 document.getElementById("connection").textContent=
  "📱 Remote connected";

 conn.on("open",()=>{
  sendState();
 });

 conn.on("data",handleRemote);

 conn.on("close",()=>{
  document.getElementById("connection").textContent=
   "Remote disconnected";
 });
});


/* REMOTE COMMANDS */

function handleRemote(m){

 if(!m)return;

 if(m.type==="action"){

  let action=m.action;

  if(action==="addRoll")
   roll(Number(m.value));

  else if(action==="strike")
   strike();

  else if(action==="spare")
   spare();

  else if(action==="prev")
   previous();

  else if(action==="next")
   nextPlayer();

  else if(action==="reset")
   resetPlayer();

  else if(action==="select")
   selectPlayer(m.value);

  else if(action==="addPlayer")
   addRemotePlayer(m.value);

  else if(action==="remove")
   removePlayer(m.value);

  else if(action==="start")
   startGame();

  else if(action==="end")
   endGame();

  else if(action==="page")
   showPage(m.value);

  else if(action==="background")
   bg(m.value);

  else if(action==="pinsetter"){

   if(m.value==="rack")rackPins();
   if(m.value==="clear")clearPins();
   if(m.value==="sweep")sweep();
   if(m.value==="nextBall")nextBall();

   if(m.value==="split")toggleSplit();

   if(m.value==="submit")submitPins();

   if(Number.isInteger(m.index))
    togglePin(m.index);
  }

  renderAll();
 }
}


/* ENTER KEY */

document
 .getElementById("playerName")
 .addEventListener("keydown",e=>{
  if(e.key==="Enter")
   addPlayer();
 });


/* WELCOME */

setTimeout(()=>{
 document
  .getElementById("welcome")
  .classList.add("hide");
},3000);

renderAll();

</script>
</body>
</html>
