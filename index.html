<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>King Gavin Lanes</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07111f;
  color:white;
  font-family:Arial,sans-serif;
  transition:background .3s;
}

header{
  height:62px;
  background:#0d1d32;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #29405d;
}

h1{font-size:20px;margin:0}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  background:#173354;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#21466f;
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.danger{background:#7d2630}
.good{background:#17603e}

.page{display:none}
.page.active{display:block}

.grid{
  display:grid;
  gap:12px;
}

.menuGrid{
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
}

.card{
  background:#0d1d32;
  border:1px solid #29405d;
  border-radius:16px;
  padding:16px;
}

.big{
  font-size:24px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #385271;
  background:#07111f;
  color:white;
  margin:6px 0 10px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.muted{color:#9eb0c5}

.status{
  padding:8px 12px;
  border-radius:999px;
  background:#23364e;
  display:inline-block;
}

#connection{
  margin-top:10px;
}

#welcome{
  position:fixed;
  inset:0;
  background:#06101c;
  z-index:99;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:opacity 1.2s;
}

#welcome.hide{
  opacity:0;
  pointer-events:none;
}

.welcomeTitle{
  font-size:clamp(32px,7vw,70px);
  font-weight:bold;
}

.frames{
  display:grid;
  grid-template-columns:repeat(10,minmax(75px,1fr));
  gap:7px;
  overflow:auto;
}

.frame{
  background:#132943;
  border:1px solid #385271;
  border-radius:10px;
  padding:8px;
  min-height:100px;
}

.frame b{
  display:block;
  margin-bottom:7px;
}

.rolls{
  font-size:18px;
  min-height:25px;
}

.frameTotal{
  font-size:25px;
  font-weight:bold;
  margin-top:8px;
}

/* SIX PIN RACK */

.pinbox{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  margin:25px auto;
  width:max-content;
}

.pinRow{
  display:flex;
  justify-content:center;
  gap:10px;
}

.pin{
  width:64px;
  height:64px;
  padding:0;
  border-radius:50% 50% 45% 45%;
  background:#f4f4f4;
  color:#111;
  font-size:20px;
  font-weight:bold;
  border:3px solid #bbb;
}

.pin.down{
  background:#555;
  color:#aaa;
  border-color:#444;
}

.pin.split{
  background:#d71920;
  color:white;
  border-color:#ff5b60;
  box-shadow:0 0 14px rgba(255,0,0,.6);
}

.pinLegend{
  text-align:center;
  color:#9eb0c5;
}

#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#132943;
  padding:12px 18px;
  border-radius:12px;
  display:none;
}
</style>
</head>

<body>

<div id="welcome">
  <div>
    <div class="welcomeTitle">
      🎳 Welcome To<br>King Gavin Lanes
    </div>
    <p class="muted">Bowling Score System</p>
  </div>
</div>

<header>
  <h1>🎳 KING GAVIN LANES</h1>
  <button onclick="showPage('menu')">☰ MENU</button>
</header>

<main class="wrap">

<!-- MENU -->

<section id="menu" class="page active">
  <div class="card">
    <h2>Menu</h2>

    <div class="grid menuGrid">

      <button onclick="showPage('players')">

      </button>

      <button onclick="showPage('score')">
        🎳 Score
      </button>

      <button onclick="showPage('editor')">
        ✏️ Score Editor
      </button>

      <button onclick="showPage('recap')">
        📋 Recap
      </button>

      <button onclick="showPage('backgrounds')">

＋ Add Player

Game code:

<!-- RECAP -->

<section id="recap" class="page">

<button onclick="showPage('menu')">← Back</button>

<div
  class="card"
  style="margin-top:12px">

<h2>Recap</h2>

<div id="recapBox"></div>

</div>

<!-- BACKGROUNDS -->

<section id="backgrounds" class="page">

<button onclick="showPage('menu')">← Back</button>

<div
  class="card"
  style="margin-top:12px">

<h2>Backgrounds</h2>

<div class="row">

<button onclick="bg('midnight')">
Midnight
</button>

<button onclick="bg('gray')">
Dark Gray
</button>

<button onclick="bg('green')">
Green
</button>

<button onclick="bg('purple')">
Purple
</button>

<button onclick="bg('brown')">
Brown
</button>

<button onclick="bg('steel')">

</button>

<section id="pinsetter" class="page">

<button onclick="showPage('menu')">

</button>

<div

</p>

<button

  onclick="submitPins()">
✓ Submit

</div>

<h3>
Status:
<span id="pinStatus">
Ready
</span>

<div
  id="pins"

Tap a pin to knock it down/up.

Red pins are marked as a split.

</main>

<div id="toast"></div>

<script>

let peer;
let conn;

let players=[];
let currentPlayer=0;
let gameStarted=false;

let pins=[
  true,true,true,
  true,true,true
];

let splitPins=[];

let currentBackground="midnight";

const backgrounds={
  midnight:"#07111f",
  gray:"#101820",
  green:"#10251c",
  purple:"#24142b",
  brown:"#261b10",
  steel:"#18202b"
};

const code=Math
  .random()
  .toString(36)
  .slice(2,8)
  .toUpperCase();

document.getElementById("gameCode").textContent=code;


/* BASIC */

function showPage(id){

  document
    .querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");

  renderAll();
}

function focusName(){
  document
    .getElementById("playerName")
    .focus();
}

function toast(t){

  const x=document.getElementById("toast");

  x.textContent=t;
  x.style.display="block";

  setTimeout(()=>{
    x.style.display="none";
  },1800);
}


/* PLAYERS */

function addPlayer(){

  const input=document.getElementById("playerName");

  const n=input.value.trim();

  if(!n)return;

  players.push({
    name:n,
    rolls:[]
  });

  currentPlayer=players.length-1;

  input.value="";

  renderAll();
  sendState();
}

function addRemotePlayer(n){

  n=(n||"").trim();

  if(!n)return;

  players.push({
    name:n,
    rolls:[]
  });

  currentPlayer=players.length-1;

  renderAll();
  sendState();
}

function removePlayer(i){

  players.splice(i,1);

  if(currentPlayer>=players.length){
    currentPlayer=Math.max(
      0,
      players.length-1
    );
  }

  renderAll();
  sendState();
}

function startGame(){

  if(!players.length){

    toast("Add at least one player");

    return;
  }

  gameStarted=true;

  showPage("score");

  sendState();
}

function endGame(){

  if(!confirm("End this game?"))
    return;

  players=[];
  currentPlayer=0;
  gameStarted=false;

  pins=[
    true,true,true,
    true,true,true
  ];

  splitPins=[];

  showPage("menu");

  sendState();

  const w=document.getElementById("welcome");

  w.classList.remove("hide");

  setTimeout(()=>{
    w.classList.add("hide");
  },3000);
}


/* SCORE */

function selectPlayer(i){

  currentPlayer=Number(i);

  renderAll();
  sendState();
}

function previous(){

  if(!players.length)return;

  currentPlayer=
    (currentPlayer-1+players.length)
    %players.length;

  renderAll();
  sendState();
}

function nextPlayer(){

  if(!players.length)return;

  currentPlayer=
    (currentPlayer+1)
    %players.length;

  renderAll();
  sendState();
}

function resetPlayer(){

  if(!players[currentPlayer])
    return;

  players[currentPlayer].rolls=[];

  renderAll();
  sendState();
}


/* SCORE CALCULATION */

function frameData(rolls){

  let frames=[];
  let i=0;
  let score=0;

  for(let f=0;f<10;f++){

    if(i>=rolls.length){

      frames.push({
        r:[],
        score:null
      });

      continue;
    }

    let a=rolls[i];

    if(f<9 && a===10){

      let s=
        10+
        (rolls[i+1]??0)+
        (rolls[i+2]??0);

      score+=s;

      frames.push({
        r:[10],
        score
      });

      i++;

    }else{

      let b=rolls[i+1];

      if(
        f<9 &&
        b!==undefined
      ){

        let s=a+b;

        if(a+b===10){
          s+=rolls[i+2]??0;
        }

        score+=s;

        frames.push({
          r:[a,b],
          score
        });

        i+=2;

      }else{

        score+=
          a+
          (b??0)+
          (rolls[i+2]??0);

        frames.push({
          r:rolls.slice(i,i+3),
          score
        });

        i=rolls.length;
      }
    }
  }

  return frames;
}

function total(p){

  if(!p)return 0;

  const d=frameData(p.rolls);

  const vals=d
    .map(x=>x.score)
    .filter(x=>x!==null);

  return vals.length
    ?vals[vals.length-1]
    :0;
}


/* RENDER PLAYERS */

function renderPlayers(){

  const box=
    document.getElementById("playerList");

  if(!players.length){

    box.innerHTML=
      '<p class="muted">No players yet.</p>';

    return;
  }

  box.innerHTML=
    players.map((p,i)=>`

      <div
        class="row card"
        style="margin-top:8px">

        <b>${esc(p.name)}</b>

        <span style="margin-left:auto">
          ${total(p)} pts
        </span>

        <button
          class="danger"
          onclick="removePlayer(${i})">
          Remove
        </button>

      </div>

    `).join("");
}


/* SELECTORS */

function renderSelectors(){

  ["scorePlayer","editPlayer"]
  .forEach(id=>{

    const s=
      document.getElementById(id);

    s.innerHTML=
      players.map((p,i)=>`

        <option value="${i}">
          ${esc(p.name)}
        </option>

      `).join("");

    if(players.length){
      s.value=currentPlayer;
    }

  });
}


/* SCORE SCREEN */

function renderScore(){

  const p=players[currentPlayer];

  document.getElementById(
    "currentName"
  ).textContent=
    p
      ?`🎳 ${p.name}`
      :"No player";

  document.getElementById(
    "currentScore"
  ).textContent=
    p?total(p):0;

  document.getElementById(
    "frames"
  ).innerHTML=
    p
      ?frameData(p.rolls)
        .map((x,i)=>`

          <div class="frame">

            <b>Frame ${i+1}</b>

            <div class="rolls">
              ${
                x.r
                .map(r=>r===10?"X":r)
                .join(" ")
                ||"—"
              }
            </div>

            <div class="frameTotal">
              ${x.score??""}
            </div>

          </div>

        `).join("")
      :"";
}


/* EDITOR */

function renderEditor(){

  const select=
    document.getElementById("editPlayer");

  const p=
    players[Number(select.value)];

  const box=
    document.getElementById("editorBox");

  if(!p){

    box.innerHTML="";

    return;
  }

  box.innerHTML=
    p.rolls
      .map((r,i)=>`

        <div class="row">

          <span>Roll ${i+1}</span>

          <input
            type="number"
            min="0"
            max="10"
            value="${r}"
            onchange="editRoll(${i},this.value)"
            style="width:100px">

        </div>

      `)
      .join("")
    ||
      '<p class="muted">No rolls yet.</p>';
}

function editRoll(i,v){

  const p=
    players[
      Number(
        document.getElementById(
          "editPlayer"
        ).value
      )
    ];

  if(!p)return;

  v=Math.max(
    0,
    Math.min(10,Number(v)||0)
  );

  p.rolls[i]=v;

  renderAll();
  sendState();
}


/* RECAP */

function renderRecap(){

  document.getElementById(
    "recapBox"
  ).innerHTML=

    players.map(p=>`

      <div
        class="card"
        style="margin:8px 0">

        <b>${esc(p.name)}</b>

        <span style="float:right">
          ${total(p)} points
        </span>

      </div>

    `).join("")
    ||
    '<p class="muted">No game data.</p>';
}


/* PINSETTER */

function renderPins(){

  const box=
    document.getElementById("pins");

  /*
       1

     2   3

   4   5   6
  */

  box.innerHTML=`

    <div class="pinRow">

      ${makePin(0)}

    </div>

    <div class="pinRow">

      ${makePin(1)}
      ${makePin(2)}

    </div>

    <div class="pinRow">

      ${makePin(3)}
      ${makePin(4)}
      ${makePin(5)}

    </div>

  `;
}

function makePin(i){

  let classes="pin";

  if(!pins[i])
    classes+=" down";

  if(splitPins.includes(i) && pins[i])
    classes+=" split";

  return `

    <button
      class="${classes}"
      onclick="togglePin(${i})">

      ${i+1}

    </button>

  `;
}

function togglePin(i){

  pins[i]=!pins[i];

  if(!pins[i]){

    splitPins=
      splitPins.filter(x=>x!==i);

  }

  renderPins();

  /*
    TV controls update the TV immediately.
  */

  sendState();
}

function rackPins(){

  pins=[
    true,true,true,
    true,true,true
  ];

  splitPins=[];

  document.getElementById(
    "pinStatus"
  ).textContent="Racked";

  renderPins();
  sendState();
}

function clearPins(){

  pins=[
    false,false,false,
    false,false,false
  ];

  splitPins=[];

  document.getElementById(
    "pinStatus"
  ).textContent="Cleared";

  renderPins();
  sendState();
}

function sweep(){

  document.getElementById(
    "pinStatus"
  ).textContent="Sweeping…";

  setTimeout(()=>{

    document.getElementById(
      "pinStatus"
    ).textContent="Ready";

  },700);

  sendState();
}

function nextBall(){

  rackPins();

  document.getElementById(
    "pinStatus"
  ).textContent=
    "Next Ball Ready";
}

function splitPinsNow(){

  if(splitPins.length){

    splitPins=[];

  }else{

    splitPins=
      pins
        .map((standing,i)=>
          standing?i:null
        )
        .filter(i=>i!==null);

  }

  renderPins();
  sendState();
}

function submitPins(){

  /*
    TV's own controls are already live.
    This button is mainly here so the
    pinsetter interface matches the remote.
  */

  document.getElementById(
    "pinStatus"
  ).textContent="Submitted";

  sendState();
}


/* BACKGROUNDS */

function bg(type){

  if(!backgrounds[type])
    return;

  currentBackground=type;

  document.body.style.background=
    backgrounds[type];

  sendState();
}


/* ESCAPE HTML */

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}


/* RENDER EVERYTHING */

function renderAll(){

  renderPlayers();
  renderSelectors();
  renderScore();
  renderEditor();
  renderRecap();
  renderPins();

  document.body.style.background=
    backgrounds[currentBackground];
}


/* CONNECTION */

function send(o){

  if(conn && conn.open){
    conn.send(o);
  }
}

function sendState(){

  send({
    type:"state",

    state:{
      players,
      currentPlayer,
      pins,
      splitPins,
      gameStarted,
      background:currentBackground
    }
  });
}


/* PEER */

peer=
  new Peer(
    "kgl-"+code,
    {debug:0}
  );

peer.on("open",()=>{

  document.getElementById(
    "connection"
  ).textContent=
    "Remote ready to connect";

});

peer.on("connection",c=>{

  conn=c;

  document.getElementById(
    "connection"
  ).textContent=
    "📱 Remote connected";

  conn.on("open",()=>{
    sendState();
  });

  conn.on("data",handleRemote);

  conn.on("close",()=>{

    document.getElementById(
      "connection"
    ).textContent=
      "Remote disconnected";

  });

});


/* REMOTE COMMANDS */

function handleRemote(m){

  if(!m)return;

  if(m.type==="action"){

    const action=m.action;

    if(action==="page"){

      showPage(m.value);

    }

    else if(action==="addPlayer"){

      addRemotePlayer(m.value);

    }

    else if(action==="remove"){

      removePlayer(Number(m.value));

    }

    else if(action==="select"){

      selectPlayer(Number(m.value));

    }

    else if(action==="addRoll"){

      remoteRoll(Number(m.value));

    }

    else if(action==="spare"){

      remoteSpare();

    }

    else if(action==="prev"){

      previous();

    }

    else if(action==="next"){

      nextPlayer();

    }

    else if(action==="reset"){

      resetPlayer();

    }

    else if(action==="start"){

      startGame();

    }

    else if(action==="end"){

      endGame();

    }

    else if(action==="background"){

      bg(m.value);

    }

    else if(action==="pinDraft"){

      /*
        IMPORTANT:
        Draft pin changes are NOT applied here.
      */

    }

    else if(action==="pinSubmit"){

      const data=m.value||{};

      if(
        Array.isArray(data.pins) &&
        data.pins.length===6
      ){

        pins=data.pins.map(Boolean);

        splitPins=
          Array.isArray(data.splitPins)
            ?data.splitPins.filter(
              i=>
                Number.isInteger(i)&&
                i>=0&&
                i<6&&
                pins[i]
            )
            :[];

        document.getElementById(
          "pinStatus"
        ).textContent=
          "Remote Submitted";

        renderPins();
        sendState();
      }

    }

    else if(action==="pin"){

      handlePinAction(m.value);

    }
  }
}


/* REMOTE SCORING */

function remoteRoll(v){

  const p=players[currentPlayer];

  if(!p)return;

  if(p.rolls.length>=21)
    return;

  /*
    Don't allow a second-roll number
    larger than the remaining pins.
  */

  const rolls=p.rolls;

  if(rolls.length){

    const last=
      rolls[rolls.length-1];

    if(last!==10){

      const frameStart=last;

      if(v>10-frameStart)
        return;
    }
  }

  p.rolls.push(v);

  renderAll();
  sendState();
}

function remoteSpare(){

  const p=players[currentPlayer];

  if(!p)return;

  if(!p.rolls.length)
    return;

  const last=
    p.rolls[p.rolls.length-1];

  if(last===10)
    return;

  p.rolls.push(10-last);

  renderAll();
  sendState();
}


/* PIN COMMANDS */

function handlePinAction(action){

  if(action==="rack")
    rackPins();

  else if(action==="clear")
    clearPins();

  else if(action==="sweep")
    sweep();

  else if(action==="nextBall")
    nextBall();

  else if(action==="split")
    splitPinsNow();
}


/* ENTER PLAYER */

document
  .getElementById("playerName")
  .addEventListener(
    "keydown",
    e=>{
      if(e.key==="Enter")
        addPlayer();
    }
  );


/* WELCOME */

setTimeout(()=>{

  document
    .getElementById("welcome")
    .classList.add("hide");

},3000);


/* START */

renderAll();
