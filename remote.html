<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>King Gavin Lanes Remote</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#080b12;
color:#fff;
}

.wrap{
max-width:620px;
margin:auto;
padding:20px;
}

.top{
background:#111827;
border-radius:14px;
padding:20px;
margin-bottom:14px;
}

h1{
margin:0 0 8px;
font-size:30px;
}

.muted{
color:#9ca3af;
}

.status{
font-weight:800;
margin-top:10px;
}

.online{color:#4ade80}
.offline{color:#f87171}

input{
width:100%;
padding:15px;
border-radius:9px;
border:1px solid #4b5563;
background:#1f2937;
color:#fff;
font-size:17px;
}

button{
min-height:50px;
border:0;
border-radius:10px;
background:#2563eb;
color:#fff;
font-size:17px;
font-weight:800;
cursor:pointer;
padding:10px 15px;
}

.connect{
display:grid;
grid-template-columns:1fr auto;
gap:8px;
}

.connect button{
background:#16a34a;
}

.menuButton{
width:100%;
background:#374151;
font-size:20px;
margin-top:12px;
}

.remoteMenu{
display:none;
margin-top:12px;
}

.remoteMenu.open{
display:block;
}

.remoteMenu button{
width:100%;
margin-bottom:8px;
text-align:left;
}

.remoteMenu .danger{
background:#dc2626;
}

.playerButtons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-top:12px;
}

.playerButtons button.active{
outline:3px solid #60a5fa;
}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
}

.grid button{
min-height:58px;
font-size:20px;
}

.strike{
grid-column:span 5;
background:#1d4ed8;
}

.spare{
grid-column:span 5;
background:#7c3aed;
}

.nav{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:8px;
}

.danger{
background:#dc2626;
}

.wide{
width:100%;
margin-top:8px;
}

.score{
font-size:23px;
font-weight:800;
text-align:center;
background:#1f2937;
padding:16px;
border-radius:10px;
margin-top:12px;
}

.small{
font-size:14px;
color:#9ca3af;
}

.sectionTitle{
font-size:20px;
font-weight:800;
margin-bottom:10px;
}

.pinRemote{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.pinRemote button{
min-height:60px;
}

.pinStop{
background:#dc2626;
}

.pinCycle{
background:#16a34a;
}

.pinReset{
background:#7c3aed;
}

@media(max-width:400px){

.grid{
grid-template-columns:repeat(3,1fr);
}

.strike,
.spare{
grid-column:span 3;
}

}

</style>
</head>

<body>

<div class="wrap">


<div class="top">

<h1>🎳 King Gavin Lanes</h1>

<div class="muted">
Wireless Control Panel
</div>

<div id="status"
class="status offline">
● Not connected
</div>

</div>


<div class="top" id="connectBox">

<div class="sectionTitle">
Connect to Bowl Site
</div>

<div class="small">
Open MENU on the Bowl Site and enter the 6-character Remote Code below.
</div>

<div class="connect"
style="margin-top:12px">

<input
id="code"
maxlength="6"
placeholder="ABC123"
autocapitalize="characters">

<button id="connect">
CONNECT
</button>

</div>

</div>


<div id="remoteUI"
style="display:none">


<!-- CONTROL PANEL -->

<div class="top">

<button id="menuButton"
class="menuButton">
☰ CONTROL PANEL
</button>


<div id="remoteMenu"
class="remoteMenu">

<button onclick="goPage('players')">
👥 PLAYERS
</button>

<button onclick="goPage('score')">
🎳 SCORE
</button>

<button onclick="goPage('editor')">
✏️ SCORE EDITOR
</button>

<button onclick="goPage('recap')">
📊 RECAP
</button>

<button onclick="goPage('backgrounds')">
🖼️ BACKGROUNDS
</button>

<button onclick="goPage('pinsetter')">
⚙️ PINSETTER
</button>

<button onclick="goBack()">
◀ BACK
</button>

<button
class="danger"
onclick="endGame()">
🛑 END GAME
</button>

</div>

</div>


<!-- ADD PLAYER -->

<div class="top">

<div class="sectionTitle">
👤 Add Player
</div>

<div class="connect"
style="margin-top:12px">

<input
id="playerName"
maxlength="30"
placeholder="Player name">

<button id="addPlayer">
ADD
</button>

</div>

</div>


<!-- PLAYERS -->

<div class="top">

<div class="sectionTitle">
Players
</div>

<div
id="players"
class="playerButtons">
</div>

</div>


<!-- SCORE -->

<div class="top">

<div
class="sectionTitle"
id="current">
Waiting…
</div>

<div
id="score"
class="score">
Score: 0
</div>

</div>


<!-- BOWLING -->

<div class="top">

<div class="sectionTitle">
🎳 Bowling Controls
</div>

<div class="grid">

<button data-roll="0">0</button>
<button data-roll="1">1</button>
<button data-roll="2">2</button>
<button data-roll="3">3</button>
<button data-roll="4">4</button>

<button data-roll="5">5</button>
<button data-roll="6">6</button>
<button data-roll="7">7</button>
<button data-roll="8">8</button>
<button data-roll="9">9</button>

<button
class="strike"
id="strike">
🎳 STRIKE X
</button>

<button
class="spare"
id="spare">
SPARE /
</button>

</div>


<div class="nav">

<button id="prev">
◀ PREVIOUS
</button>

<button id="next">
NEXT ▶
</button>

</div>


<button
class="wide"
id="reset">
RESET PLAYER
</button>

</div>


<!-- PINSETTER -->

<div class="top">

<div class="sectionTitle">
⚙️ Pinsetter
</div>

<div class="pinRemote">

<button
class="pinCycle"
onclick="pinAction('cycle')">
▶️ CYCLE
</button>

<button
onclick="pinAction('run')">
⬆️ RUN
</button>

<button
class="pinStop"
onclick="pinAction('stop')">
⏹️ STOP
</button>

<button
class="pinReset"
onclick="pinAction('reset')">
🔄 RESET
</button>

<button
class="pinStop"
style="grid-column:span 2"
onclick="pinAction('estop')">
🛑 EMERGENCY STOP
</button>

</div>

</div>


</div>

</div>


<script>

let peer=null;
let conn=null;
let state=null;

const $=id=>
document.getElementById(id);


/* STATUS */

function setStatus(text,ok){

$("status").textContent=
"● "+text;

$("status").className=
"status "+
(ok?"online":"offline");

}


/* SEND */

function send(action,value){

if(conn&&conn.open){

conn.send({
type:"action",
action,
value
});

}

}


/* MENU */

$("menuButton").onclick=()=>{

$("remoteMenu")
.classList.toggle("open");

};


function goPage(page){

send("page",page);

$("remoteMenu")
.classList.remove("open");

}


function goBack(){

send("page","score");

$("remoteMenu")
.classList.remove("open");

}


/* ADD PLAYER */

$("addPlayer").onclick=()=>{

const name=
$("playerName")
.value
.trim();

if(!name){

alert("Enter a player name.");
return;

}

send("addPlayer",name);

$("playerName").value="";

};


$("playerName").addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
$("addPlayer").click();

});


/* END */

function endGame(){

if(confirm("End the game?"))
send("end");

}


/* PINSETTER */

function pinAction(action){

send("pinsetter",action);

}


/* RENDER */

function render(){

if(!state)
return;

$("remoteUI").style.display=
state.players.length
?"block"
:"none";


$("players").innerHTML="";


state.players.forEach((p,i)=>{

const b=document.createElement("button");

b.textContent=p.name;

b.className=
i===state.currentPlayer
?"active"
:"";

b.onclick=()=>
send("select",i);

$("players").appendChild(b);

});


if(state.players.length){

const p=
state.players[state.currentPlayer];

$("current").textContent=
"🎳 "+p.name;

let total=0;

if(p.rolls){

/*
Simple live total.
The actual Bowl Site
calculates the official score.
*/

p.rolls.forEach(x=>{
total+=Number(x)||0;
});

}

$("score").textContent=
"Current pins: "+total;

}

else{

$("current").textContent=
"No players";

$("score").textContent=
"Score: 0";

}

}


/* CONNECT */

function connect(){

const code=
$("code")
.value
.trim()
.toUpperCase()
.replace(/[^A-Z0-9]/g,"");


if(code.length!==6){

alert(
"Enter the 6-character code from the Bowl Site."
);

return;

}


if(peer)
peer.destroy();


peer=new Peer();


peer.on("open",()=>{

conn=
peer.connect(
"kgl-"+code,
{reliable:true}
);


conn.on("open",()=>{

setStatus(
"CONNECTED 🟢",
true
);

$("connectBox")
.style.display="none";

});


conn.on("data",m=>{

if(m.type==="state"){

state=m.state;

render();

}

});


conn.on("close",()=>{

setStatus(
"Disconnected",
false
);

$("connectBox")
.style.display="block";

});

});


peer.on("error",e=>{

setStatus(
"Connection failed",
false
);

alert(
"Couldn't connect. Check the code and make sure the Bowl Site is open."
);

});

}


/* CONNECT BUTTON */

$("connect").onclick=connect;


$("code").addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
connect();

});


/* ROLLS */

document
.querySelectorAll("[data-roll]")
.forEach(b=>{

b.onclick=()=>{

send(
"addRoll",
Number(b.dataset.roll)
);

};

});


$("strike").onclick=()=>
send("addRoll",10);


$("spare").onclick=()=>
send("spare");


$("prev").onclick=()=>
send("prev");


$("next").onclick=()=>
send("next");


$("reset").onclick=()=>
send("reset");

</script>

</body>
</html>
