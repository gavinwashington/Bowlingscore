<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>King Gavin Lanes Remote</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050d18;
  color:white;
}

button,input{
  font:inherit;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 15px;
  margin:5px;
  background:#153454;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1f4b79;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #31506e;
  background:#0c1b2b;
  color:white;
}

header{
  background:#020811;
  padding:16px;
  text-align:center;
  border-bottom:1px solid #21384e;
}

header h1{
  margin:0;
  font-size:21px;
}

.page{
  display:none;
  padding:18px;
  max-width:600px;
  margin:auto;
}

.page.active{
  display:block;
}

.card{
  background:#0c1b2c;
  border:1px solid #223c56;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
}

.menuGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.menuGrid button{
  min-height:68px;
  font-size:16px;
}

.numGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.numGrid button{
  min-height:58px;
  font-size:20px;
}

.special{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.special button{
  min-height:55px;
}

.player{
  background:#10253b;
  border-radius:12px;
  padding:13px;
  margin:7px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.remove{
  background:#642b32;
}

.pinGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.pin{
  height:52px;
  border-radius:50%;
  background:#eee;
  color:#111;
}

.pin.down{
  background:#444;
  color:#aaa;
}

.status{
  padding:10px;
  border-radius:10px;
  background:#102a42;
  margin:10px 0;
}

.big{
  font-size:30px;
  font-weight:bold;
}

.green{color:#69ff9b}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#102b43;
  border:1px solid #41617e;
  padding:12px 18px;
  border-radius:12px;
  display:none;
}
</style>
</head>

<body>

<header>
  <h1>🎳 KING GAVIN LANES<br>REMOTE CONTROL</h1>
</header>

<!-- CONNECT -->
<section id="connect" class="page active">

  <div class="card">
    <h2>📱 Connect To Lane</h2>

    <p>Enter the 6-digit code shown on the iPad.</p>

    <input
      id="codeInput"
      maxlength="6"
      inputmode="numeric"
      placeholder="123456"
    >

    <button
      style="width:100%;margin:10px 0"
      onclick="connect()"
    >
      🔗 Connect
    </button>

    <div id="connectStatus" class="status">
      Not connected
    </div>
  </div>

</section>

<!-- MENU -->
<section id="menu" class="page">

  <div class="card">
    <h2>🎳 Remote Menu</h2>

    <div id="menuStatus" class="status">
      🟢 Connected
    </div>
  </div>

  <div class="menuGrid">
    <button onclick="page('players')">👥 Players</button>
    <button onclick="page('score')">📊 Score</button>
    <button onclick="page('editor')">✏️ Score Editor</button>
    <button onclick="page('recap')">📋 Recap</button>
    <button onclick="page('backgrounds')">🖼️ Backgrounds</button>
    <button onclick="page('pinsetter')">🎳 Pinsetter</button>

    <button onclick="startBowling()">
      ▶️ Start Bowling
    </button>

    <button onclick="endGame()">
      🏁 End Game
    </button>
  </div>

</section>

<!-- PLAYERS -->
<section id="players" class="page">

  <button onclick="page('menu')">← Back</button>

  <div class="card">
    <h2>👥 Players</h2>

    <input
      id="nameInput"
      placeholder="Player name"
      maxlength="30"
      onkeydown="if(event.key==='Enter')addPlayer()"
    >

    <button
      onclick="addPlayer()"
      style="width:100%"
    >
      ➕ Add Player
    </button>

    <div id="playersList"></div>
  </div>

</section>

<!-- SCORE -->
<section id="score" class="page">

  <button onclick="page('menu')">← Back</button>

  <div class="card">
    <h2>📊 Score Control</h2>

    <div id="scorePlayer"></div>

    <div class="numGrid">

      <button onclick="roll(0)">0</button>
      <button onclick="roll(1)">1</button>
      <button onclick="roll(2)">2</button>

      <button onclick="roll(3)">3</button>
      <button onclick="roll(4)">4</button>
      <button onclick="roll(5)">5</button>

      <button onclick="roll(6)">6</button>
      <button onclick="roll(7)">7</button>
      <button onclick="roll(8)">8</button>

      <button onclick="roll(9)">9</button>
    </div>

    <div class="special">
      <button onclick="strike()">🎳 Strike</button>
      <button onclick="spare()">/ Spare</button>
      <button onclick="previous()">⬅ Previous</button>
      <button onclick="next()">Next ➡</button>
      <button onclick="resetScore()">🔄 Reset</button>
    </div>
  </div>

</section>

<!-- EDITOR -->
<section id="editor" class="page">

  <button onclick="page('menu')">← Back</button>

  <div class="card">
    <h2>✏️ Score Editor</h2>
    <p>Current rolls:</p>
    <div id="editorList"></div>
  </div>

</section>

<!-- RECAP -->
<section id="recap" class="page">

  <button onclick="page('menu')">← Back</button>

  <div class="card">
    <h2>📋 Recap</h2>
    <div id="recapList"></div>
  </div>

</section>

<!-- BACKGROUNDS -->
<section id="backgrounds" class="page">

  <button onclick="page('menu')">← Back</button>

  <div class="card">
    <h2>🖼️ Backgrounds</h2>
    <p>Background controls can be expanded here.</p>
  </div>

</section>

<!-- PINSETTER -->
<section id="pinsetter" class="page">

  <button onclick="page('menu')">← Back</button>

  <div class="card">

    <h2>🎳 Pinsetter</h2>

    <button onclick="pinAction('rack')">
      Rack Pins
    </button>

    <button onclick="pinAction('clear')">
      Clear
    </button>

    <button onclick="pinAction('sweep')">
      Sweep
    </button>

    <button onclick="pinAction('nextBall')">
      Next Ball
    </button>

    <div id="pinGrid" class="pinGrid"></div>

  </div>

</section>

<div id="toast" class="toast"></div>

<script>

let peer=null;
let conn=null;

let players=[];
let currentPlayer=0;
let pins=Array(10).fill(true);
let gameStarted=false;

/* =========================
   PAGE SYSTEM
========================= */

function page(id){

  document.querySelectorAll('.page')
    .forEach(x=>x.classList.remove('active'));

  document.getElementById(id)
    .classList.add('active');

  render();
}

/* =========================
   CONNECT
========================= */

function connect(){

  const code=document
    .getElementById('codeInput')
    .value
    .trim();

  if(!/^\d{6}$/.test(code)){
    setStatus(
      'connectStatus',
      '🔴 Enter the 6-digit code from the iPad.'
    );
    return;
  }

  setStatus(
    'connectStatus',
    '🟡 Connecting...'
  );

  if(peer){
    try{peer.destroy()}catch(e){}
  }

  peer=new Peer();

  peer.on('open',()=>{

    conn=peer.connect(
      'kgl-'+code,
      {reliable:true}
    );

    conn.on('open',()=>{

      setStatus(
        'connectStatus',
        '🟢 Connected!'
      );

      setStatus(
        'menuStatus',
        '🟢 Connected to King Gavin Lanes'
      );

      /*
        THIS IS IMPORTANT:
        Once the phone connects, immediately
        show the remote menu.
      */
      page('menu');
    });

    conn.on('data',(data)=>{
      handleState(data);
    });

    conn.on('close',()=>{
      setStatus(
        'connectStatus',
        '🔴 Connection closed.'
      );

      setStatus(
        'menuStatus',
        '🔴 Disconnected'
      );
    });
  });

  peer.on('error',(err)=>{
    console.log(err);

    setStatus(
      'connectStatus',
      '🔴 Could not connect. Check the code.'
    );
  });
}

/* =========================
   STATE FROM IPAD
========================= */

function handleState(data){

  if(!data)return;

  if(data.type==='state'){

    players=data.players||[];
    currentPlayer=data.currentPlayer||0;
    gameStarted=!!data.gameStarted;
    pins=data.pins||pins;

    render();
  }

  if(data.type==='pin'){

    pins=data.pins||pins;

    renderPins();
  }
}

/* =========================
   PLAYER ADDING
========================= */

function addPlayer(){

  const input=document.getElementById('nameInput');

  const name=input.value.trim();

  if(!name){
    toast('Type a player name first!');
    return;
  }

  send({
    type:'addPlayer',
    name:name
  });

  input.value='';
  input.focus();

  toast('Adding '+name+'...');
}

function removePlayer(index){

  send({
    type:'remove',
    index:index
  });

  toast('Removing player...');
}

/* =========================
   START / END
========================= */

function startBowling(){

  if(!players.length){
    page('players');
    toast('Add a player first!');
    return;
  }

  send({
    type:'start'
  });

  toast('Starting bowling...');
}

function endGame(){

  send({
    type:'end'
  });

  toast('Ending game...');
}

/* =========================
   SCORING
========================= */

function roll(value){

  send({
    type:'roll',
    value:value
  });
}

function strike(){

  send({
    type:'strike'
  });
}

function spare(){

  send({
    type:'spare'
  });
}

function previous(){

  send({
    type:'previous'
  });
}

function next(){

  send({
    type:'next'
  });
}

function resetScore(){

  send({
    type:'reset'
  });
}

/* =========================
   PINSETTER
========================= */

function pinAction(action){

  send({
    type:'pin',
    action:action
  });
}

function togglePin(index){

  pins[index]=!pins[index];

  send({
    type:'pinToggle',
    index:index
  });

  renderPins();
}

/* =========================
   RENDER
========================= */

function render(){

  renderPlayers();
  renderScore();
  renderEditor();
  renderRecap();
  renderPins();
}

function renderPlayers(){

  const box=document.getElementById('playersList');

  if(!players.length){

    box.innerHTML=
      '<p>No players yet.</p>';

    return;
  }

  box.innerHTML=players.map((p,i)=>`

    <div class="player">

      <div>
        <b>${escapeHtml(p.name)}</b>
        ${i===currentPlayer?' 🎳':''}
      </div>

      <button
        class="remove"
        onclick="removePlayer(${i})"
      >
        Remove
      </button>

    </div>

  `).join('');
}

function renderScore(){

  const box=document.getElementById('scorePlayer');

  if(!players.length){

    box.innerHTML='No players.';

    return;
  }

  box.innerHTML=`
    <div class="big">
      🎳 ${escapeHtml(
        players[currentPlayer]?.name||''
      )}
    </div>
    <div class="green">
      ${gameStarted?'Bowling':'Game not started'}
    </div>
  `;
}

function renderEditor(){

  const box=document.getElementById('editorList');

  if(!players.length){

    box.innerHTML='No players.';

    return;
  }

  box.innerHTML=players.map(p=>`

    <div class="card">
      <b>${escapeHtml(p.name)}</b>
      <br>
      Score rolls are controlled from here.
    </div>

  `).join('');
}

function renderRecap(){

  const box=document.getElementById('recapList');

  if(!players.length){

    box.innerHTML='No players.';

    return;
  }

  box.innerHTML=players.map((p,i)=>`

    <div class="card">

      <b>${i+1}. ${escapeHtml(p.name)}</b>

    </div>

  `).join('');
}

function renderPins(){

  const box=document.getElementById('pinGrid');

  if(!box)return;

  box.innerHTML=pins.map((up,i)=>`

    <button
      class="pin ${up?'':'down'}"
      onclick="togglePin(${i})"
    >
      ${i+1}
    </button>

  `).join('');
}

/* =========================
   SEND
========================= */

function send(data){

  if(!conn || !conn.open){

    toast('Not connected to the iPad.');

    return;
  }

  conn.send(data);
}

/* =========================
   HELPERS
========================= */

function setStatus(id,text){

  const el=document.getElementById(id);

  if(el)el.textContent=text;
}

function toast(text){

  const el=document.getElementById('toast');

  el.textContent=text;
  el.style.display='block';

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    el.style.display='none';
  },2200);
}

function escapeHtml(str){

  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

render();

</script>

</body>
</html>
