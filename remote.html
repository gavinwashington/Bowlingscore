<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>King Gavin Lanes Remote</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111827;
    color: white;
}

header {
    background: #080b12;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #1f2937;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 15px;
}

.code-input {
    width: 100%;
    padding: 16px;
    border-radius: 9px;
    border: 1px solid #4b5563;
    background: #111827;
    color: white;
    font-size: 20px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 4px;
}

.connect {
    width: 100%;
    margin-top: 10px;
    padding: 16px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 18px;
    font-weight: bold;
}

.status {
    margin-top: 12px;
    text-align: center;
    background: #111827;
    padding: 12px;
    border-radius: 8px;
    color: #fbbf24;
}

.connected {
    color: #4ade80;
}

.player-buttons {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 8px;
}

.player-button {
    min-height: 55px;
    background: #111827;
    color: white;
    border: 2px solid #374151;
    border-radius: 9px;
    font-weight: bold;
    font-size: 16px;
}

.player-button.active {
    background: #1e40af;
    border-color: #2563eb;
}

.current-player {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #93c5fd;
}

.current-score {
    margin-top: 10px;
    background: #111827;
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
}

.roll-buttons {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 9px;
}

.roll {
    min-height: 65px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 22px;
    font-weight: bold;
}

.strike {
    background: #dc2626;
}

.spare {
    background: #7c3aed;
}

.navigation {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 12px;
}

.navigation button {
    min-height: 55px;
    background: #374151;
    color: white;
    border: none;
    border-radius: 9px;
    font-weight: bold;
    font-size: 15px;
}

.reset {
    width: 100%;
    min-height: 55px;
    margin-top: 12px;
    background: #dc2626;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
}

.end {
    width: 100%;
    min-height: 55px;
    margin-top: 9px;
    background: #991b1b;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
}

.small {
    color: #9ca3af;
    font-size: 14px;
}

</style>

</head>

<body>

<header>

<h1>🎳 KING GAVIN LANES</h1>

<p style="margin:5px 0 0;color:#9ca3af;">
REMOTE CONTROL
</p>

</header>


<div class="container">


<div class="card">

<h2>📡 Connect To Lane</h2>

<p class="small">
Enter the Game Code shown on the iPad.
</p>

<input
    id="code"
    class="code-input"
    maxlength="6"
    placeholder="ABC123">

<button
    class="connect"
    onclick="connect()">

    CONNECT

</button>

<div
    id="status"
    class="status">

    ⚪ NOT CONNECTED

</div>

</div>


<div
    id="remoteControls"
    style="display:none;">


<div class="card">

<div
    id="currentPlayer"
    class="current-player">
    Player
</div>

<div
    id="currentScore"
    class="current-score">

    Score: 0

</div>

</div>


<div class="card">

<h2>👥 Players</h2>

<div
    id="players"
    class="player-buttons">
</div>

</div>


<div class="card">

<h2>🎳 Bowling Controls</h2>

<div
    id="rollButtons"
    class="roll-buttons">
</div>


<div class="navigation">

<button onclick="send({
    type:'previous'
})">

◀ PREVIOUS

</button>

<button onclick="send({
    type:'next'
})">

NEXT ▶

</button>

</div>


<button
    class="reset"
    onclick="send({
        type:'reset'
    })">

    🔄 RESET PLAYER

</button>


<button
    class="end"
    onclick="send({
        type:'end'
    })">

    🛑 END GAME

</button>

</div>


</div>

</div>


<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<script>

let peer = null;

let connection = null;

let gameState = null;


/* CONNECT */

function connect() {

    const code =
        document
        .getElementById("code")
        .value
        .trim()
        .toUpperCase();

    if (
        code.length !== 6
    ) {

        setStatus(
            "ENTER A 6-CHARACTER CODE"
        );

        return;

    }


    if (peer) {

        peer.destroy();

    }


    peer = new Peer();


    setStatus(
        "CONNECTING..."
    );


    peer.on(
        "open",
        () => {

            connection =
                peer.connect(
                    "kgl-" + code,
                    {
                        reliable:true
                    }
                );


            connection.on(
                "open",
                () => {

                    setStatus(
                        "CONNECTED",
                        true
                    );

                    document
                    .getElementById(
                        "remoteControls"
                    )
                    .style.display =
                        "block";

                }
            );


            connection.on(
                "data",
                data => {

                    if (
                        data.type ===
                        "state"
                    ) {

                        gameState =
                            data;

                        render();

                    }

                }
            );


            connection.on(
                "close",
                () => {

                    setStatus(
                        "DISCONNECTED"
                    );

                }
            );

        }
    );


    peer.on(
        "error",
        () => {

            setStatus(
                "COULD NOT CONNECT"
            );

        }
    );

}


/* STATUS */

function setStatus(
    text,
    connected = false
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        connected
        ? "🟢 " + text
        : "⚪ " + text;

    status.className =
        connected
        ? "status connected"
        : "status";

}


/* SEND */

function send(data) {

    if (
        connection &&
        connection.open
    ) {

        connection.send(data);

    }

}


/* RENDER */

function render() {

    if (!gameState)
        return;


    const players =
        document.getElementById(
            "players"
        );

    players.innerHTML = "";


    gameState.players.forEach(
        (player,index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "player-button";


            if (
                index ===
                gameState.currentPlayer
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                player.name;


            button.onclick =
                () => {

                    send({

                        type:"select",

                        index:index

                    });

                };


            players.appendChild(
                button
            );

        }
    );


    const player =
        gameState.players[
            gameState.currentPlayer
        ];


    if (!player)
        return;


    document
    .getElementById(
        "currentPlayer"
    )
    .textContent =
        "🎳 " + player.name;


    document
    .getElementById(
        "currentScore"
    )
    .textContent =
        "Score: " +
        calculateScore(
            player.rolls
        );

}


/* SCORE */

function calculateScore(rolls) {

    const frames = [];

    let index = 0;

    for (
        let frame = 0;
        frame < 9;
        frame++
    ) {

        if (
            index >= rolls.length
        ) {

            frames.push([]);

            continue;

        }


        if (
            rolls[index] === 10
        ) {

            frames.push([10]);

            index++;

        }

        else {

            frames.push(
                rolls.slice(
                    index,
                    index + 2
                )
            );

            index += 2;

        }

    }


    frames.push(
        rolls.slice(
            index,
            index + 3
        )
    );


    let total = 0;

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const frame =
            frames[i];


        if (!frame.length)
            break;


        if (i === 9) {

            total +=
                frame.reduce(
                    (a,b) =>
                        a + b,
                    0
                );

            break;

        }


        if (
            frame[0] === 10
        ) {

            const next =
                frames[i + 1] || [];

            const after =
                frames[i + 2] || [];


            if (
                next.length < 2
            )
                break;


            let bonus =
                next[0];


            if (
                next[0] === 10
            ) {

                if (!after.length)
                    break;

                bonus +=
                    after[0];

            }

            else {

                bonus +=
                    next[1];

            }


            total +=
                10 + bonus;

        }

        else if (
            frame.length >= 2 &&
            frame[0] +
            frame[1] === 10
        ) {

            const next =
                frames[i + 1] || [];


            if (!next.length)
                break;


            total +=
                10 + next[0];

        }

        else if (
            frame.length >= 2
        ) {

            total +=
                frame[0] +
                frame[1];

        }

        else {

            break;

        }

    }


    return total;

}


/* ROLL BUTTONS */

const rollButtons =
    document.getElementById(
        "rollButtons"
    );


for (
    let i = 0;
    i <= 9;
    i++
) {

    const button =
        document.createElement(
            "button"
        );

    button.className =
        "roll";

    button.textContent =
        i;

    button.onclick =
        () => {

            send({

                type:"roll",

                value:i

            });

        };

    rollButtons.appendChild(
        button
    );

}


/* STRIKE */

const strike =
    document.createElement(
        "button"
    );

strike.className =
    "roll strike";

strike.textContent =
    "STRIKE X";

strike.onclick =
    () => {

        send({

            type:"roll",

            value:10

        });

    };

rollButtons.appendChild(
    strike
);


/* SPARE */

const spare =
    document.createElement(
        "button"
    );

spare.className =
    "roll spare";

spare.textContent =
    "SPARE /";

spare.onclick =
    () => {

        send({

            type:"spare"

        });

    };

rollButtons.appendChild(
    spare
);

</script>

</body>

</html>
