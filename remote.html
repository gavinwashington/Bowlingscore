<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>King Gavin Lanes Remote</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 font-family:Arial,sans-serif;color:white;
 background:linear-gradient(135deg,#07152f,#123d72,#07152f);
}
button{
 border:0;border-radius:14px;padding:15px;
 margin:5px;background:#174d86;color:white;
 font-size:17px;font-weight:bold;
}
button:active{transform:scale(.96)}
.container{max-width:650px;margin:auto;padding:18px}
.card{
 background:rgba(0,0,0,.38);
 border-radius:22px;padding:20px;margin:12px 0;
}
h1,h2{text-align:center}
.center{text-align:center}
.hidden{display:none!important}

input{
 width:100%;padding:16px;border:0;border-radius:13px;
 font-size:22px;text-align:center;
 margin:8px 0;
}

.connectBtn{width:100%;font-size:21px;padding:18px}

.menuGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.menuGrid button{min-height:65px}

.numberGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}
.numberGrid button{
 font-size:25px;
 min-height:65px;
}
button.invalid{
 filter:blur(4px);
 opacity:.3;
 pointer-events:none;
}
button.disabled{
 opacity:.35;
 pointer-events:none;
}

.actionGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.players{
 display:flex;flex-direction:column;gap:8px
}
.player{
 display:flex;justify-content:space-between;align-items:center;
 background:#123b68;border-radius:13px;padding:10px 13px
}

.pinGrid{
 display:grid;
 grid-template-columns:repeat(6,48px);
 grid-template-rows:repeat(3,58px);
 justify-content:center;
 align-items:center;
 margin:20px auto;
}
.pin{
 width:44px;height:44px;padding:0;margin:0;
 border-radius:50%;background:#eee;color:#111;
 border:3px solid white;position:relative;
}
.pin.down{background:#555;color:#aaa;opacity:.45}
.pin.split{
 background:#c62828;color:white;
 border-color:#ff7777;
 box-shadow:0 0 14px #f33;
}
.pin.split::after{
 content:"";position:absolute;
 width:11px;height:11px;border-radius:50%;
 background:#ffdddd;top:2px;right:2px;
}
.pin:nth-child(1){grid-column:3/span 2;grid-row:1}
.pin:nth-child(2){grid-column:2/span 2;grid-row:2}
.pin:nth-child(3){grid-column:4/span 2;grid-row:2}
.pin:nth-child(4){grid-column:1/span 2;grid-row:3}
.pin:nth-child(5){grid-column:3/span 2;grid-row:3}
.pin:nth-child(6){grid-column:5/span 2;grid-row:3}

.backgroundGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}
</style>
</head>

<body>
<div class="container">

<!-- CONNECT -->
<section id="connect" class="page">
 <div class="card center">
  <h1>🎳 King Gavin Lanes</h1>
  <h2>Phone Remote</h2>

  <input id="codeInput"
   inputmode="numeric"
   maxlength="6"
   placeholder="6-Digit Code">

  <button class="connectBtn" onclick="connect()">Connect</button>
  <p id="connectStatus">Enter the code shown on the TV.</p>
 </div>
</section>

<!-- HOME -->
<section id="home" class="page hidden">
 <div class="card center">
  <h1>🎳 Remote</h1>
  <p id="connectionText">Connected to King Gavin Lanes</p>
 </div>

 <div class="menuGrid">
  <button onclick="page('players')">👥 Players</button>
  <button onclick="page('score')">📊 Score</button>
  <button onclick="page('pinsetter')">🎳 Pinsetter</button>
  <button onclick="page('backgrounds')">🎨 TV Backgrounds</button>
  <button onclick="page('more')">☰ More</button>
 </div>
</section>

<!-- PLAYERS -->
<section id="players" class="page hidden">
 <div class="card">
  <h1>Players</h1>

  <input id="playerName"
   placeholder="Player name">

  <button style="width:100%" onclick="addPlayer()">Add Player</button>

  <div id="playersList" class="players"></div>
 </div>

 <button onclick="page('home')">← Home</button>
</section>

<!-- SCORE -->
<section id="score" class="page hidden">
 <div class="card">
  <h1>Score Controls</h1>
  <p id="turnText" class="center"></p>

  <div id="numbers" class="numberGrid"></div>

  <div class="actionGrid">
   <button id="strikeBtn" onclick="send({type:'strike'})">X Strike</button>
   <button id="spareBtn" onclick="send({type:'spare'})">/ Spare</button>
   <button onclick="send({type:'previous'})">← Previous</button>
   <button onclick="send({type:'next'})">Next →</button>
   <button onclick="send({type:'split'})">🔴 Split</button>
   <button onclick="send({type:'reset'})">Reset</button>
  </div>
 </div>

 <button onclick="page('home')">← Home</button>
</section>

<!-- PINSETTER -->
<section id="pinsetter" class="page hidden">
 <div class="card center">
  <h1>🎳 Pinsetter</h1>
  <p>Changes stay local until you press Submit.</p>

  <div id="pinDisplay" class="pinGrid"></div>

  <div class="actionGrid">
   <button onclick="pinAction('rack')">Rack Pins</button>
   <button onclick="pinAction('clear')">Clear</button>
   <button onclick="pinAction('sweep')">Sweep</button>
   <button onclick="pinAction('nextBall')">Next Ball</button>
  </div>

  <button onclick="toggleDraftSplit()" style="width:100%">
   🔴 Split
  </button>

  <button onclick="submitPins()" style="width:100%;background:#176b38">
   ✅ SUBMIT
  </button>
 </div>

 <button onclick="page('home')">← Home</button>
</section>

<!-- BACKGROUNDS -->
<section id="backgrounds" class="page hidden">
 <div class="card">
  <h1>🎨 TV Backgrounds</h1>
  <p class="center">These change the background on the iPad / TV.</p>

  <div class="backgroundGrid">
   <button onclick="setBackground('midnight')">Midnight</button>
   <button onclick="setBackground('black')">Black</button>
   <button onclick="setBackground('purple')">Purple</button>
   <button onclick="setBackground('green')">Green</button>
   <button onclick="setBackground('blue')">Bowling Blue</button>
   <button onclick="setBackground('warm')">Warm</button>
  </div>
 </div>

 <button onclick="page('home')">← Home</button>
</section>

<!-- MORE -->
<section id="more" class="page hidden">
 <div class="card">
  <h1>More</h1>

  <div class="menuGrid">
   <button onclick="send({type:'start'})">▶️ Start Bowling</button>
   <button onclick="send({type:'end'})">🛑 End Game</button>
  </div>
 </div>

 <button onclick="page('home')">← Home</button>
</section>

</div>

<script>
let peer=null;
let conn=null;

let players=[];
let currentPlayer=0;
let scores=[];
let pins=Array(6).fill(true);
let splitPins=[];
let gameStarted=false;
let currentBackground="midnight";

/* DRAFT PINSETTER STATE */
let draftPins=[...pins];
let draftSplitPins=[...splitPins];

function page(id){
 document.querySelectorAll(".page")
  .forEach(x=>x.classList.add("hidden"));

 document.getElementById(id).classList.remove("hidden");

 if(id==="pinsetter"){
  draftPins=[...pins];
  draftSplitPins=[...splitPins];
  renderPins();
 }

 if(id==="score")renderScoreControls();
 if(id==="players")renderPlayers();
}

function toast(msg){
 let t=document.createElement("div");
 t.textContent=msg;
 t.style.cssText=
 "position:fixed;bottom:25px;left:50%;"+
 "transform:translateX(-50%);background:#111;"+
 "padding:14px 20px;border-radius:14px;z-index:999";
 document.body.appendChild(t);
 setTimeout(()=>t.remove(),1800);
}

function connect(){
 let code=document.getElementById("codeInput").value.trim();

 if(code.length!==6){
  document.getElementById("connectStatus").textContent=
   "Enter all 6 digits.";
  return;
 }

 document.getElementById("connectStatus").textContent="Connecting...";

 if(peer)peer.destroy();

 peer=new Peer();

 peer.on("open",()=>{
  conn=peer.connect("kgl-"+code,{reliable:true});

  conn.on("open",()=>{
   document.getElementById("connectStatus").textContent=
    "Connected!";
   page("home");
  });

  conn.on("data",handleState);

  conn.on("close",()=>{
   document.getElementById("connectionText").textContent=
    "⚠️ Disconnected from TV";
  });
 });

 peer.on("error",err=>{
  console.log(err);
  document.getElementById("connectStatus").textContent=
   "Could not connect. Check the code.";
 });
}

function send(data){
 if(conn&&conn.open)conn.send(data);
 else toast("Not connected");
}

function handleState(data){
 if(!data||data.type!=="state")return;

 players=data.players||[];
 currentPlayer=data.currentPlayer||0;
 scores=data.scores||players.map(()=>[]);
 pins=Array.isArray(data.pins)&&data.pins.length===6
  ?data.pins.map(Boolean):Array(6).fill(true);
 splitPins=Array.isArray(data.splitPins)?data.splitPins:[];
 gameStarted=!!data.gameStarted;
 currentBackground=data.background||"midnight";

 if(document.getElementById("pinsetter") &&
    !document.getElementById("pinsetter").classList.contains("hidden")){
  draftPins=[...pins];
  draftSplitPins=[...splitPins];
  renderPins();
 }

 renderPlayers();
 renderScoreControls();
}

function addPlayer(){
 let input=document.getElementById("playerName");
 let name=input.value.trim();
 if(!name)return;

 send({type:"addPlayer",name});
 input.value="";
}

document.getElementById("playerName").addEventListener("keydown",e=>{
 if(e.key==="Enter")addPlayer();
});

function renderPlayers(){
 let el=document.getElementById("playersList");
 if(!el)return;

 el.innerHTML="";

 players.forEach((p,i)=>{
  let row=document.createElement("div");
  row.className="player";

  let name=document.createElement("span");
  name.textContent=p+(i===currentPlayer?" 🎳":"");

  let remove=document.createElement("button");
  remove.textContent="Remove";
  remove.onclick=()=>send({type:"remove",index:i});

  row.appendChild(name);
  row.appendChild(remove);
  el.appendChild(row);
 });
}

function currentFrameInfo(){
 let arr=scores[currentPlayer]||[];
 let frame=0;
 let i=0;

 while(frame<10){
  if(i>=arr.length)return {frame,first:null,complete:false};

  let r=arr[i];

  if(r.type==="strike"){
   if(frame===9)return {frame,first:r,complete:true};

   if(arr.length>=i+3){
    i++;
    frame++;
    continue;
   }

   return {frame,first:r,complete:false};
  }

  if(i+1>=arr.length)
   return {frame,first:r,complete:false};

  i+=2;
  frame++;
 }

 return {frame:9,complete:true};
}

function renderScoreControls(){
 let grid=document.getElementById("numbers");
 if(!grid)return;

 grid.innerHTML="";

 let info=currentFrameInfo();
 let arr=scores[currentPlayer]||[];

 document.getElementById("turnText").textContent=
  players.length
   ?`Current player: ${players[currentPlayer]||"Unknown"}`
   :"No players";

 for(let n=0;n<=9;n++){
  let b=document.createElement("button");
  b.textContent=n;

  if(!gameStarted||!players.length){
   b.classList.add("disabled");
  }else if(info.complete){
   b.classList.add("disabled");
  }else if(info.first===null){
   // First shot: all 0-9 are legal.
  }else{
   // Second shot: only numbers <= remaining pins.
   let remaining=10-info.first.pins;
   if(n>remaining)b.classList.add("invalid");
  }

  b.onclick=()=>send({type:"roll",value:n});
  grid.appendChild(b);
 }

 let strike=document.getElementById("strikeBtn");
 let spare=document.getElementById("spareBtn");

 strike.className="";
 spare.className="";

 if(!gameStarted||!players.length||info.complete){
  strike.classList.add("disabled");
  spare.classList.add("disabled");
 }else if(info.first!==null){
  // Strike only on first shot.
  strike.classList.add("disabled");
 }else{
  // Spare only after a first-shot number.
  spare.classList.add("disabled");
 }
}

function renderPins(){
 let el=document.getElementById("pinDisplay");
 if(!el)return;

 el.innerHTML="";

 draftPins.forEach((up,i)=>{
  let b=document.createElement("button");

  b.className="pin "+
   (up?"":"down")+
   (draftSplitPins.includes(i)?" split":"");

  b.textContent=i+1;

  b.onclick=()=>{
   draftPins[i]=!draftPins[i];

   if(!draftPins[i])
    draftSplitPins=draftSplitPins.filter(x=>x!==i);

   renderPins();
  };

  el.appendChild(b);
 });
}

function pinAction(action){
 if(action==="rack"){
  draftPins=Array(6).fill(true);
  draftSplitPins=[];
 }
 if(action==="clear"){
  draftPins=Array(6).fill(false);
  draftSplitPins=[];
 }
 if(action==="sweep"){
  draftPins=Array(6).fill(false);
  draftSplitPins=[];
 }
 if(action==="nextBall"){
  draftPins=Array(6).fill(true);
  draftSplitPins=[];
 }

 renderPins();
}

function toggleDraftSplit(){
 let standing=draftPins
  .map((x,i)=>x?i:null)
  .filter(x=>x!==null);

 if(!standing.length){
  toast("No standing pins!");
  return;
 }

 if(draftSplitPins.length)
  draftSplitPins=[];
 else
  draftSplitPins=standing;

 renderPins();
}

function submitPins(){
 send({
  type:"pinSubmit",
  pins:[...draftPins],
  splitPins:[...draftSplitPins]
 });

 pins=[...draftPins];
 splitPins=[...draftSplitPins];

 toast("Pinsetter submitted!");
}

function setBackground(value){
 send({
  type:"background",
  value
 });

 currentBackground=value;
 toast("TV background changed!");
}
</script>
</body>
</html>
