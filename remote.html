<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>King Gavin Lanes Remote</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#071a33,#0b315c);
  min-height:100vh;
}

header{
  height:70px;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(0,0,0,.25);
}

.brand{
  font-size:22px;
  font-weight:bold;
}

.container{
  padding:20px;
  max-width:700px;
  margin:auto;
}

.page{display:none}
.page.active{display:block}

.card{
  background:rgba(255,255,255,.09);
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

.center{text-align:center}

button{
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:#1677ff;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.menuBtn{
  min-height:90px;
  font-size:18px;
}

input{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  margin:7px 0;
  font-size:17px;
}

.back{
  background:#444;
  width:100%;
  margin-top:12px;
}

.danger{
  background:#c62828;
}

.success{
  background:#16a34a;
}

.status{
  margin:12px 0;
  font-weight:bold;
}

.score{
  font-size:60px;
  font-weight:bold;
  text-align:center;
  margin:20px;
}

.scoreButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.scoreButtons button{
  min-height:65px;
  font-size:22px;
}

.player{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.08);
  padding:12px;
  border-radius:10px;
  margin:8px 0;
}

/* PINSETTER */

.pinArea{
  position:relative;
  width:280px;
  height:240px;
  margin:20px auto;
}

.pin{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  background:white;
  color:#111;

  border:3px solid #ddd;
  font-size:22px;
  font-weight:bold;

  cursor:pointer;
  transition:.15s;
}

.pin.down{
  background:#394651;
  color:#9ba5ad;
  border-color:#53616b;
}

.pin.split{
  border:4px solid red;
  box-shadow:0 0 12px rgba(255,0,0,.7);
}

.pin.split::after{
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:red;
  top:-7px;
  right:-7px;
}

.pin:nth-child(1){
  left:112px;
  top:5px;
}

.pin:nth-child(2){
  left:75px;
  top:75px;
}

.pin:nth-child(3){
  left:149px;
  top:75px;
}

.pin:nth-child(4){
  left:38px;
  top:145px;
}

.pin:nth-child(5){
  left:112px;
  top:145px;
}

.pin:nth-child(6){
  left:186px;
  top:145px;
}

.pinControls{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.submit{
  width:100%;
  margin-top:12px;
}

.bgGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.bgGrid button{
  min-height:70px;
}
</style>
</head>

<body>

<header>
  <div class="brand">🎳 KGL Remote</div>
</header>

<div class="container">

<!-- CONNECT -->
<section id="connect" class="page active">
  <div class="card center">
    <h1>📱 Phone Remote</h1>
    <p>Enter the code shown on the TV/iPad.</p>

    <input
      id="codeInput"
      placeholder="KGL-XXXXXX or XXXXXX"
      autocapitalize="characters"
    >

    <button onclick="connectRemote()" style="width:100%">
      Connect
    </button>

    <div class="status" id="status">Not connected</div>
  </div>
</section>

<!-- HOME -->
<section id="home" class="page">
  <div class="card">
    <h1>Remote Menu</h1>

    <div class="grid">
      <button class="menuBtn" onclick="page('players')">
        👥 Players
      </button>

      <button class="menuBtn" onclick="page('score')">
        📊 Score
      </button>

      <button class="menuBtn" onclick="page('pinsetter')">
        🎳 Pinsetter
      </button>

      <button class="menuBtn" onclick="page('backgrounds')">
        🎨 Backgrounds
      </button>

      <button class="menuBtn success" onclick="startGame()">
        ▶️ Start Bowling
      </button>

      <button class="menuBtn danger" onclick="endGame()">
        🛑 End Game
      </button>
    </div>
  </div>
</section>

<!-- PLAYERS -->
<section id="players" class="page">
  <div class="card">
    <h1>👥 Players</h1>

    <input id="playerName" placeholder="Player name">

    <button
      onclick="addPlayer()"
      style="width:100%;margin-bottom:15px"
    >
      ➕ Add Player
    </button>

    <div id="playersList"></div>

    <button class="back" onclick="page('home')">
      ← Back
    </button>
  </div>
</section>

<!-- SCORE -->
<section id="score" class="page">
  <div class="card">
    <h1>📊 Score</h1>

    <div class="score" id="currentScore">0</div>

    <div class="scoreButtons">
      <button onclick="roll(0)">0</button>
      <button onclick="roll(1)">1</button>
      <button onclick="roll(2)">2</button>

      <button onclick="roll(3)">3</button>
      <button onclick="roll(4)">4</button>
      <button onclick="roll(5)">5</button>

      <button onclick="roll(6)">6</button>
      <button onclick="roll(7)">7</button>
      <button onclick="roll(8)">8</button>

      <button onclick="roll(9)">9</button>
      <button onclick="send({type:'strike'})">STRIKE</button>
      <button onclick="send({type:'spare'})">SPARE</button>

      <button onclick="send({type:'previous'})">← Prev</button>
      <button onclick="send({type:'next'})">Next →</button>
      <button onclick="send({type:'reset'})">Reset</button>

      <button onclick="send({type:'split'})">🔴 Split</button>
    </div>

    <button class="back" onclick="page('home')">
      ← Back
    </button>
  </div>
</section>

<!-- PINSETTER -->
<section id="pinsetter" class="page">
  <div class="card center">
    <h1>🎳 Pinsetter</h1>
    <p>Select pins to make them unavailable.</p>

    <div class="pinArea" id="pins"></div>

    <div class="pinControls">
      <button onclick="pinAction('rack')">Rack</button>
      <button onclick="pinAction('clear')">Clear</button>
      <button onclick="pinAction('sweep')">Sweep</button>
      <button onclick="pinAction('nextBall')">Next Ball</button>
      <button onclick="toggleSplit()">🔴 Split</button>
    </div>

    <button
      class="submit success"
      onclick="submitPins()"
    >
      ✅ Submit
    </button>

    <button class="back" onclick="page('home')">
      ← Back
    </button>
  </div>
</section>

<!-- BACKGROUNDS -->
<section id="backgrounds" class="page">
  <div class="card">
    <h1>🎨 TV Background</h1>
    <p>Choose the background for the TV/iPad scoreboard.</p>

    <div class="bgGrid">
      <button onclick="background('midnight')">🌌 Midnight</button>
      <button onclick="background('black')">⬛ Black</button>
      <button onclick="background('purple')">🟣 Purple</button>
      <button onclick="background('green')">🟢 Green</button>
      <button onclick="background('blue')">🔵 Blue</button>
      <button onclick="background('warm')">🟠 Warm</button>
    </div>

    <button class="back" onclick="page('home')">
      ← Back
    </button>
  </div>
</section>

</div>

<script>

let peer;
let conn=null;

let players=[];
let currentPlayer=0;
let gameStarted=false;
let scores={};

let pins=Array(6).fill(true);
let splitPins=[];

let draftPins=[...pins];
let draftSplit=[...splitPins];


/* PAGE */

function page(name){
  document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  document.getElementById(name)
    .classList.add("active");

  update();
}


/* CONNECTION */

function connectRemote(){

  let code=document
    .getElementById("codeInput")
    .value
    .trim()
    .toUpperCase();

  if(!code){
    document.getElementById("status").textContent=
      "Enter the TV code first.";
    return;
  }

  if(!code.startsWith("KGL-")){
    code="KGL-"+code;
  }

  document.getElementById("status").textContent=
    "Connecting...";

  peer=new Peer();

  peer.on("open",()=>{
    conn=peer.connect(code,{reliable:true});

    conn.on("open",()=>{

      document.getElementById("status").textContent=
        "📱 Connected!";

      page("home");
    });

    conn.on("data",(msg)=>{
      receiveState(msg);
    });

    conn.on("close",()=>{
      conn=null;

      document.getElementById("status").textContent=
        "Disconnected from TV.";

      page("connect");
    });
  });

  peer.on("error",(err)=>{
    console.log(err);

    document.getElementById("status").textContent=
      "Could not connect. Check the code.";
  });
}


/* SEND */

function send(message){

  if(!conn || !conn.open){
    alert("Not connected to the TV.");
    return;
  }

  conn.send(message);
}


/* STATE */

function receiveState(msg){

  if(msg.type!=="state")return;

  players=Array.isArray(msg.players)
    ? msg.players
    : [];

  currentPlayer=Number(msg.currentPlayer)||0;

  gameStarted=!!msg.gameStarted;

  scores=msg.scores || {};

  pins=Array.isArray(msg.pins)
    ? msg.pins
    : Array(6).fill(true);

  splitPins=Array.isArray(msg.splitPins)
    ? msg.splitPins
    : [];

  /*
    Important:
    The submitted TV state becomes the new
    starting point for the next pin selection.
  */
  draftPins=[...pins];
  draftSplit=[...splitPins];

  update();
}


/* PLAYERS */

function addPlayer(){

  const input=document.getElementById("playerName");

  const name=input.value.trim();

  if(!name)return;

  send({
    type:"addPlayer",
    name:name
  });

  input.value="";
}

function removePlayer(index){

  send({
    type:"removePlayer",
    index:index
  });
}

function renderPlayers(){

  const box=document.getElementById("playersList");

  if(!players.length){
    box.innerHTML="<p>No players yet.</p>";
    return;
  }

  box.innerHTML=players.map((name,i)=>`
    <div class="player">
      <span>${i+1}. ${escapeHtml(name)}</span>

      <button
        class="danger"
        onclick="removePlayer(${i})"
      >
        Remove
      </button>
    </div>
  `).join("");
}


/* GAME */

function startGame(){

  if(!players.length){
    page("players");
    alert("Add a player first!");
    return;
  }

  send({type:"start"});
  page("score");
}

function endGame(){

  send({type:"end"});
  page("home");
}


/* SCORE */

function roll(number){

  send({
    type:"roll",
    value:number
  });
}


/* PINSETTER */

function renderPins(){

  const box=document.getElementById("pins");

  box.innerHTML=draftPins.map((available,i)=>`

    <div
      class="pin
      ${available?'':'down'}
      ${draftSplit.includes(i)?'split':''}"
      onclick="togglePin(${i})"
    >
      ${i+1}
    </div>

  `).join("");
}

function togglePin(index){

  /*
    WHITE = available
    GRAY  = unavailable

    Clicking immediately changes the local
    remote display. It isn't sent to the TV
    until Submit is pressed.
  */

  draftPins[index]=!draftPins[index];

  if(!draftPins[index]){
    draftSplit=draftSplit.filter(x=>x!==index);
  }

  renderPins();
}

function pinAction(action){

  if(action==="rack"){
    draftPins=Array(6).fill(true);
    draftSplit=[];
  }

  if(action==="nextBall"){
    draftPins=Array(6).fill(true);
    draftSplit=[];
  }

  if(action==="clear"){
    draftPins=Array(6).fill(false);
    draftSplit=[];
  }

  if(action==="sweep"){
    draftPins=Array(6).fill(false);
    draftSplit=[];
  }

  renderPins();
}

function toggleSplit(){

  draftSplit=[];

  draftPins.forEach((available,i)=>{
    if(available){
      draftSplit.push(i);
    }
  });

  renderPins();
}

function submitPins(){

  send({
    type:"pinSubmit",
    pins:draftPins,
    splitPins:draftSplit
  });
}


/* BACKGROUNDS */

function background(value){

  send({
    type:"background",
    value:value
  });
}


/* UPDATE */

function update(){

  renderPlayers();
  renderPins();

  if(players.length){

    document.getElementById("currentScore")
      .textContent=
      scores[players[currentPlayer]] ?? 0;

  }else{

    document.getElementById("currentScore")
      .textContent="0";
  }
}


/* HTML SAFETY */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

update();

</script>

</body>
</html>
