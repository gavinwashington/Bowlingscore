<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,user-scalable=no"
>

<title>King Gavin Lanes Remote</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;

    width:100%;
    min-height:100%;

    font-family:Arial,Helvetica,sans-serif;

    background:#111;

    color:white;
}

body{
    padding:18px;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(600px,100%);

    margin:auto;
}


/* =====================================================
   HEADER
===================================================== */

h1{
    text-align:center;

    font-size:clamp(28px,8vw,45px);

    margin:10px 0 25px;
}

.subtitle{
    text-align:center;

    opacity:.7;

    margin-bottom:20px;
}


/* =====================================================
   CONNECTION
===================================================== */

.connect-box{

    background:#1d1d1d;

    padding:20px;

    border-radius:16px;

    margin-bottom:20px;
}

input{

    width:100%;

    padding:15px;

    border-radius:10px;

    border:2px solid #444;

    background:#080808;

    color:white;

    margin-bottom:10px;

    text-transform:uppercase;
}

.primary{

    width:100%;

    padding:16px;

    border:0;

    border-radius:12px;

    background:#ffc400;

    color:#111;

    font-weight:bold;
}


/* =====================================================
   STATUS
===================================================== */

.status{

    text-align:center;

    padding:12px;

    margin-bottom:18px;

    border-radius:10px;

    background:#222;
}


/* =====================================================
   HOME
===================================================== */

.menu{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.menu button{

    min-height:75px;

    border:0;

    border-radius:15px;

    background:#242424;

    color:white;

    font-size:17px;

    font-weight:bold;
}


/* START BUTTON */

.start-button{

    grid-column:
        1 / -1;

    min-height:90px!important;

    background:#ffc400!important;

    color:#111!important;

    font-size:23px!important;
}


/* WARNING STATE */

.start-button.warning-ready{

    background:#ff3347!important;

    color:white!important;

}


/* =====================================================
   PANELS
===================================================== */

.panel{

    background:#1b1b1b;

    border-radius:16px;

    padding:18px;

    margin-bottom:15px;
}

.panel h2{

    margin-top:0;

    text-align:center;
}


/* =====================================================
   PLAYERS
===================================================== */

.player-row{

    display:flex;

    gap:8px;

    margin-bottom:10px;
}

.player-row input{

    margin:0;

    flex:1;
}

.small-button{

    border:0;

    border-radius:10px;

    padding:12px 15px;

    background:#333;

    color:white;
}

.danger{

    background:#b51f2d!important;
}


/* =====================================================
   SCORE CONTROLS
===================================================== */

.number-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;
}

.number-grid button{

    height:70px;

    border:0;

    border-radius:14px;

    background:#292929;

    color:white;

    font-size:24px;

    font-weight:bold;
}

.strike{

    background:#e53935!important;
}

.spare{

    background:#1976d2!important;
}


/* =====================================================
   NAV
===================================================== */

.nav-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}

.nav-grid button{

    min-height:55px;

    border:0;

    border-radius:12px;

    background:#333;

    color:white;

    font-weight:bold;
}


/* =====================================================
   PINSETTER
===================================================== */

.pin-controls{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:12px;
}

.pin-row{

    display:flex;

    gap:15px;
}

.remote-pin{

    width:65px;

    height:80px;

    border-radius:
        50% 50% 45% 45%;

    border:4px solid white;

    background:white;
}

.remote-pin.down{

    background:#555;

    border-color:#777;
}

.remote-pin.split{

    border-color:red;
}


/* =====================================================
   BACKGROUNDS
===================================================== */

.background-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}

.background-grid button{

    min-height:60px;

    border:0;

    border-radius:12px;

    color:white;

    background:#333;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{
    display:none!important;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:420px){

    body{
        padding:12px;
    }

    .menu{
        grid-template-columns:1fr;
    }

    .start-button{
        grid-column:auto;
    }

    .number-grid button{
        height:62px;
    }
}

</style>
</head>

<body>

<div class="container">


<h1>
    🎳 King Gavin Lanes
</h1>

<div class="subtitle">
    Wireless Bowling Remote
</div>



<!-- =====================================================
     CONNECT
===================================================== -->

<div
    class="connect-box"
    id="connectBox"
>

    <input
        id="codeInput"
        maxlength="6"
        placeholder="Enter TV Code"
        autocomplete="off"
    >

    <button
        class="primary"
        onclick="connectToTV()"
    >
        Connect To TV
    </button>

</div>



<div
    class="status"
    id="status"
>
    Not connected
</div>



<!-- =====================================================
     HOME
===================================================== -->

<div
    id="homePanel"
    class="hidden"
>

    <div class="panel">

        <h2>
            Bowling Control
        </h2>


        <div class="menu">

            <button
                onclick="showPanel('playersPanel')"
            >
                👥 Players
            </button>


            <button
                onclick="showPanel('scorePanel')"
            >
                🎳 Score
            </button>


            <button
                onclick="showPanel('pinsPanel')"
            >
                🎯 Pinsetter
            </button>


            <button
                onclick="showPanel('backgroundPanel')"
            >
                🖼️ Backgrounds
            </button>


            <button
                id="startButton"
                class="start-button"
                onclick="startBowling()"
            >
                ▶ Start Bowling
            </button>


            <button
                onclick="endGame()"
                style="
                    background:#b51f2d;
                    color:white;
                "
            >
                🛑 End Game
            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     PLAYERS
===================================================== -->

<div
    id="playersPanel"
    class="panel hidden"
>

    <h2>
        Players
    </h2>


    <div
        id="playerList"
    ></div>


    <div class="player-row">

        <input
            id="playerName"
            placeholder="Player name"
            maxlength="20"
        >

        <button
            class="small-button"
            onclick="addPlayer()"
        >
            Add
        </button>

    </div>


    <button
        class="primary"
        onclick="showPanel('homePanel')"
    >
        Back
    </button>

</div>



<!-- =====================================================
     SCORE
===================================================== -->

<div
    id="scorePanel"
    class="panel hidden"
>

    <h2>
        Score Controls
    </h2>


    <div class="number-grid">

        <button onclick="roll(0)">
            0
        </button>

        <button onclick="roll(1)">
            1
        </button>

        <button onclick="roll(2)">
            2
        </button>

        <button onclick="roll(3)">
            3
        </button>

        <button onclick="roll(4)">
            4
        </button>

        <button onclick="roll(5)">
            5
        </button>

        <button
            class="strike"
            onclick="strike()"
        >
            STRIKE
        </button>

        <button
            class="spare"
            onclick="spare()"
        >
            SPARE
        </button>

        <button onclick="roll(6)">
            6
        </button>

    </div>


    <br>


    <div class="nav-grid">

        <button onclick="previousPlayer()">
            ◀ Previous
        </button>

        <button onclick="nextPlayer()">
            Next ▶
        </button>

        <button
            class="danger"
            onclick="resetGame()"
        >
            Reset Game
        </button>

        <button
            onclick="showPanel('homePanel')"
        >
            Back
        </button>

    </div>

</div>



<!-- =====================================================
     PINSETTER
===================================================== -->

<div
    id="pinsPanel"
    class="panel hidden"
>

    <h2>
        Pinsetter
    </h2>


    <div class="pin-controls">


        <div class="pin-row">

            <div
                class="remote-pin"
                id="pin0"
                onclick="togglePin(0)"
            ></div>

        </div>


        <div class="pin-row">

            <div
                class="remote-pin"
                id="pin1"
                onclick="togglePin(1)"
            ></div>

            <div
                class="remote-pin"
                id="pin2"
                onclick="togglePin(2)"
            ></div>

        </div>


        <div class="pin-row">

            <div
                class="remote-pin"
                id="pin3"
                onclick="togglePin(3)"
            ></div>

            <div
                class="remote-pin"
                id="pin4"
                onclick="togglePin(4)"
            ></div>

            <div
                class="remote-pin"
                id="pin5"
                onclick="togglePin(5)"
            ></div>

        </div>


        <button
            class="primary"
            onclick="submitPins()"
        >
            Submit Pins
        </button>


        <button
            class="small-button"
            onclick="rackPins()"
        >
            Rack
        </button>


        <button
            class="small-button"
            onclick="clearPins()"
        >
            Sweep / Clear
        </button>


        <button
            class="small-button"
            onclick="showPanel('homePanel')"
        >
            Back
        </button>

    </div>

</div>



<!-- =====================================================
     BACKGROUNDS
===================================================== -->

<div
    id="backgroundPanel"
    class="panel hidden"
>

    <h2>
        Backgrounds
    </h2>


    <div class="background-grid">

        <button onclick="background('dark')">
            Dark
        </button>

        <button onclick="background('blue')">
            Blue
        </button>

        <button onclick="background('green')">
            Green
        </button>

        <button onclick="background('purple')">
            Purple
        </button>

        <button onclick="background('red')">
            Red
        </button>

    </div>


    <br>


    <button
        class="primary"
        onclick="showPanel('homePanel')"
    >
        Back
    </button>

</div>


</div>



<script>

/* =====================================================
   PEER
===================================================== */

let peer=null;
let connection=null;


/* =====================================================
   STATE
===================================================== */

let players=[];

let currentPlayer=0;

let gameStarted=false;

let warningShown=false;

let pins=
    Array(6).fill(true);


/* =====================================================
   CONNECT
===================================================== */

function connectToTV(){

    let code=
        document
        .getElementById("codeInput")
        .value
        .trim()
        .toUpperCase();


    if(!code){

        setStatus(
            "Enter the TV code first."
        );

        return;
    }


    setStatus(
        "Connecting..."
    );


    peer=new Peer();


    peer.on("open",()=>{

        connection=
            peer.connect(
                "kgl-"+code
            );


        connection.on(
            "open",
            ()=>{

                setStatus(
                    "Connected to TV ✓"
                );


                document
                    .getElementById(
                        "connectBox"
                    )
                    .classList.add(
                        "hidden"
                    );


                document
                    .getElementById(
                        "homePanel"
                    )
                    .classList.remove(
                        "hidden"
                    );


                updateStartButton();

                sendStateRequest();
            }
        );


        connection.on(
            "data",
            handleTVState
        );


        connection.on(
            "close",
            ()=>{

                setStatus(
                    "TV disconnected"
                );

            }
        );

    });


    peer.on(
        "error",
        error=>{

            console.log(error);

            setStatus(
                "Could not connect. Check the code."
            );

        }
    );
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

    document
        .getElementById("status")
        .textContent=text;
}


/* =====================================================
   PANELS
===================================================== */

function showPanel(id){

    [
        "homePanel",
        "playersPanel",
        "scorePanel",
        "pinsPanel",
        "backgroundPanel"
    ].forEach(panel=>{

        document
            .getElementById(panel)
            .classList.add("hidden");

    });


    document
        .getElementById(id)
        .classList.remove("hidden");


    if(id==="playersPanel"){
        renderPlayers();
    }
}


/* =====================================================
   SEND
===================================================== */

function send(data){

    if(
        connection &&
        connection.open
    ){

        connection.send(data);

    }else{

        setStatus(
            "Not connected to TV."
        );
    }
}


/*
   PeerJS doesn't require a state request
   for the current TV implementation,
   but this safely asks for a fresh state
   by sending a harmless state-request command.
*/

function sendStateRequest(){

    send({
        type:"stateRequest"
    });
}


/* =====================================================
   START BOWLING
===================================================== */

function startBowling(){

    /*
       First press:
       TV displays warning.
    */

    if(!warningShown){

        send({
            type:"start"
        });

        return;
    }


    /*
       Second press:
       TV starts game.
    */

    send({
        type:"start"
    });
}


/* =====================================================
   UPDATE START BUTTON
===================================================== */

function updateStartButton(){

    const button=
        document.getElementById(
            "startButton"
        );


    if(gameStarted){

        button.textContent=
            "🎳 Bowling In Progress";

        button.disabled=true;

        button.classList.remove(
            "warning-ready"
        );

        return;
    }


    button.disabled=false;


    if(warningShown){

        button.textContent=
            "⚠️ Start Bowling Again";

        button.classList.add(
            "warning-ready"
        );

    }else{

        button.textContent=
            "▶ Start Bowling";

        button.classList.remove(
            "warning-ready"
        );
    }
}


/* =====================================================
   PLAYERS
===================================================== */

function addPlayer(){

    const input=
        document.getElementById(
            "playerName"
        );


    const name=
        input.value.trim();


    if(!name){

        return;
    }


    send({
        type:"addPlayer",
        name:name
    });


    input.value="";
}


function removePlayer(index){

    send({
        type:"removePlayer",
        index:index
    });
}


function renderPlayers(){

    const list=
        document.getElementById(
            "playerList"
        );


    list.innerHTML="";


    players.forEach(
        (name,index)=>{

        const row=
            document.createElement(
                "div"
            );


        row.className=
            "player-row";


        const label=
            document.createElement(
                "input"
            );


        label.value=
            `${index+1}. ${name}`;

        label.disabled=true;


        const remove=
            document.createElement(
                "button"
            );


        remove.className=
            "small-button danger";


        remove.textContent=
            "Remove";


        remove.onclick=()=>{
            removePlayer(index);
        };


        row.appendChild(label);

        row.appendChild(remove);

        list.appendChild(row);
    });
}


/* =====================================================
   SCORE
===================================================== */

function roll(value){

    send({
        type:"roll",
        value:value
    });
}


function strike(){

    send({
        type:"strike"
    });
}


function spare(){

    send({
        type:"spare"
    });
}


function previousPlayer(){

    send({
        type:"previous"
    });
}


function nextPlayer(){

    send({
        type:"next"
    });
}


function resetGame(){

    if(
        confirm(
            "Reset the entire game?"
        )
    ){

        send({
            type:"reset"
        });

    }
}


/* =====================================================
   PINSETTER
===================================================== */

function togglePin(index){

    pins[index]=
        !pins[index];

    renderPins();
}


function renderPins(){

    for(let i=0;i<6;i++){

        const pin=
            document.getElementById(
                "pin"+i
            );


        if(pins[i]){

            pin.classList.remove(
                "down"
            );

        }else{

            pin.classList.add(
                "down"
            );
        }
    }
}


function submitPins(){

    send({

        type:"pinSubmit",

        pins:[
            ...pins
        ],

        splitPins:
            Array(6).fill(false)

    });
}


function rackPins(){

    pins=
        Array(6).fill(true);

    renderPins();

    send({
        type:"rack"
    });
}


function clearPins(){

    pins=
        Array(6).fill(false);

    renderPins();

    send({
        type:"clearPins"
    });
}


/* =====================================================
   BACKGROUNDS
===================================================== */

function background(value){

    send({

        type:"background",

        value:value

    });
}


/* =====================================================
   END GAME
===================================================== */

function endGame(){

    if(
        confirm(
            "End the bowling game?"
        )
    ){

        send({
            type:"end"
        });

    }
}


/* =====================================================
   RECEIVE TV STATE
===================================================== */

function handleTVState(data){

    if(
        !data ||
        data.type!=="state"
    ){

        return;
    }


    players=
        Array.isArray(data.players)
            ? [...data.players]
            : [];


    currentPlayer=
        Number.isInteger(
            data.currentPlayer
        )
        ? data.currentPlayer
        : 0;


    gameStarted=
        Boolean(
            data.gameStarted
        );


    warningShown=
        Boolean(
            data.warningShown
        );


    if(
        Array.isArray(data.pins)
    ){

        pins=
            [...data.pins]
            .slice(0,6);

    }


    renderPins();

    renderPlayers();

    updateStartButton();


    /*
       If game starts, automatically
       show score controls.
    */

    if(gameStarted){

        showPanel(
            "scorePanel"
        );

    }else{

        showPanel(
            "homePanel"
        );
    }
}


/* =====================================================
   INITIAL
===================================================== */

renderPins();

updateStartButton();

</script>

</body>
</html>
