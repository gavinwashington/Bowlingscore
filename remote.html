<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>King Gavin Lanes Remote</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.screen{
    display:none;
    min-height:100vh;
    padding:20px;
}

.screen.active{
    display:block;
}

h1{
    text-align:center;
}

button{
    border:0;
    border-radius:12px;
    padding:16px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    max-width:500px;
    margin:auto;
}

.menu button{
    min-height:70px;
}

.connect-box{
    max-width:450px;
    margin:80px auto;
    text-align:center;
}

input{
    width:100%;
    padding:18px;
    border-radius:10px;
    border:2px solid #555;
    background:#222;
    color:white;
    font-size:24px;
    text-align:center;
    text-transform:uppercase;
    margin:15px 0;
}

.status{
    text-align:center;
    margin:15px;
    opacity:.8;
}

.back{
    margin-bottom:20px;
}

.player-list{
    max-width:500px;
    margin:auto;
}

.player{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#222;
    padding:12px;
    border-radius:10px;
    margin:8px 0;
}

.player button{
    padding:10px 14px;
}

.add-player{
    display:flex;
    gap:8px;
    max-width:500px;
    margin:20px auto;
}

.add-player input{
    margin:0;
    text-align:left;
    font-size:18px;
}

.add-player button{
    white-space:nowrap;
}

/* SCORE */

.score-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    max-width:500px;
    margin:auto;
}

.score-buttons button{
    min-height:65px;
}

.special{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    max-width:500px;
    margin:15px auto;
}

.special button{
    min-height:60px;
}

.current-player{
    text-align:center;
    font-size:22px;
    margin:20px;
}

/* PINSETTER */

.pin-rack{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin:25px auto;
}

.pin-row{
    display:flex;
    gap:14px;
}

.pin{
    width:50px;
    height:68px;
    border-radius:50% 50% 45% 45%;
    border:4px solid white;
    background:white;
    cursor:pointer;
    position:relative;
}

.pin.down{
    background:#555;
    border-color:#777;
}

.pin.split{
    border-color:red;
}

.pin.split::after{
    content:"";
    width:11px;
    height:11px;
    background:red;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.pin-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    max-width:500px;
    margin:auto;
}

.submit{
    grid-column:1/-1;
    background:white;
    color:black;
}

/* BACKGROUNDS */

.backgrounds{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    max-width:500px;
    margin:auto;
}

</style>
</head>

<body>

<!-- CONNECT -->

<section id="connect" class="screen active">

    <div class="connect-box">

        <h1>🎳 King Gavin Lanes</h1>

        <p>TV Remote</p>

        <input
            id="codeInput"
            maxlength="10"
            placeholder="KGL-XXXXXX"
        >

        <button onclick="connectToTV()">
            Connect
        </button>

        <div class="status" id="connectStatus">
            Enter the code shown on the TV.
        </div>

    </div>

</section>


<!-- HOME -->

<section id="home" class="screen">

    <h1>🎳 Remote</h1>

    <div class="status" id="homeStatus">
        Connected ✓
    </div>

    <div class="menu">

        <button onclick="page('players')">
            👥 Players
        </button>

        <button onclick="page('score')">
            🎳 Score
        </button>

        <button onclick="page('pinsetter')">
            ⚙️ Pinsetter
        </button>

        <button onclick="page('backgrounds')">
            🖼️ Backgrounds
        </button>

        <button onclick="startGame()">
            ▶️ Start Bowling
        </button>

        <button onclick="endGame()">
            🛑 End Game
        </button>

    </div>

</section>


<!-- PLAYERS -->

<section id="players" class="screen">

    <button class="back" onclick="page('home')">
        ← Back
    </button>

    <h1>Players</h1>

    <div class="add-player">

        <input
            id="playerInput"
            placeholder="Player name"
            maxlength="20"
        >

        <button onclick="addPlayer()">
            Add
        </button>

    </div>

    <div class="player-list" id="playerList"></div>

</section>


<!-- SCORE -->

<section id="score" class="screen">

    <button class="back" onclick="page('home')">
        ← Menu
    </button>

    <h1>Score</h1>

    <div class="current-player" id="currentPlayer">
        No player
    </div>

    <!-- ONLY 0-6 -->

    <div class="score-buttons">

        <button onclick="roll(0)">0</button>
        <button onclick="roll(1)">1</button>
        <button onclick="roll(2)">2</button>

        <button onclick="roll(3)">3</button>
        <button onclick="roll(4)">4</button>
        <button onclick="roll(5)">5</button>

        <button onclick="roll(6)">6</button>

    </div>

    <div class="special">

        <button onclick="strike()">
            X Strike
        </button>

        <button onclick="spare()">
            / Spare
        </button>

        <button onclick="previousPlayer()">
            ← Previous
        </button>

        <button onclick="nextPlayer()">
            Next →
        </button>

        <button onclick="resetGame()">
            🔄 Reset Game
        </button>

    </div>

</section>


<!-- PINSETTER -->

<section id="pinsetter" class="screen">

    <button class="back" onclick="page('home')">
        ← Menu
    </button>

    <h1>Pinsetter</h1>

    <div class="pin-rack" id="pins"></div>

    <div class="pin-actions">

        <button onclick="rackPins()">
            🎳 Rack
        </button>

        <button onclick="clearPins()">
            🧹 Sweep
        </button>

        <button class="submit" onclick="submitPins()">
            ✓ Submit
        </button>

    </div>

</section>


<!-- BACKGROUNDS -->

<section id="backgrounds" class="screen">

    <button class="back" onclick="page('home')">
        ← Menu
    </button>

    <h1>TV Background</h1>

    <div class="backgrounds">

        <button onclick="background('dark')">
            Dark
        </button>

        <button onclick="background('blue')">
            Blue
        </button>

        <button onclick="background('green')">
            Green
        </button>

        <button onclick="background('purple')">
            Purple
        </button>

        <button onclick="background('red')">
            Red
        </button>

    </div>

</section>


<script>

/* =========================================================
   CONNECTION
   ========================================================= */

let peer=null;
let connection=null;

let players=[];
let currentPlayer=0;
let gameStarted=false;

let pins=Array(6).fill(true);
let splitPins=Array(6).fill(false);


function page(id){

    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    if(id==="players"){
        renderPlayers();
    }

    if(id==="pinsetter"){
        renderPins();
    }
}


/* =========================================================
   CONNECT
   ========================================================= */

function connectToTV(){

    let code=
        document.getElementById("codeInput")
        .value
        .trim()
        .toUpperCase();

    code=code.replace(/\s/g,"");

    if(code.startsWith("KGL-")){
        code=code.substring(4);
    }

    if(code.length!==6){

        document.getElementById("connectStatus").textContent=
            "Enter the 6-character TV code.";

        return;
    }

    document.getElementById("connectStatus").textContent=
        "Connecting...";

    peer=new Peer({
        debug:1
    });

    peer.on("open",()=>{

        connection=
            peer.connect(
                "kgl-"+code,
                {
                    reliable:true
                }
            );

        connection.on("open",()=>{

            document.getElementById("connectStatus").textContent=
                "Connected ✓";

            page("home");
        });

        connection.on("data",handleState);

        connection.on("close",()=>{

            connection=null;

            document.getElementById("connectStatus").textContent=
                "Disconnected from TV.";
        });
    });

    peer.on("error",err=>{

        console.log(err);

        document.getElementById("connectStatus").textContent=
            "Could not connect. Check the code.";
    });
}


/* =========================================================
   SEND
   ========================================================= */

function send(data){

    if(connection && connection.open){
        connection.send(data);
    }
}


/* =========================================================
   STATE
   ========================================================= */

function handleState(data){

    if(!data || data.type!=="state") return;

    players=data.players || [];

    currentPlayer=
        Number.isInteger(data.currentPlayer)
            ? data.currentPlayer
            : 0;

    gameStarted=Boolean(data.gameStarted);

    pins=
        Array.isArray(data.pins)
            ? data.pins
            : Array(6).fill(true);

    splitPins=
        Array.isArray(data.splitPins)
            ? data.splitPins
            : Array(6).fill(false);

    updateCurrentPlayer();
    renderPlayers();
    renderPins();
}


function updateCurrentPlayer(){

    const el=
        document.getElementById("currentPlayer");

    if(players.length===0){

        el.textContent="No players";

        return;
    }

    el.textContent=
        "Current player: " +
        players[currentPlayer];
}


/* =========================================================
   PLAYERS
   ========================================================= */

function addPlayer(){

    const input=
        document.getElementById("playerInput");

    const name=input.value.trim();

    if(name==="") return;

    send({
        type:"addPlayer",
        name:name
    });

    input.value="";
}


function removePlayer(index){

    send({
        type:"removePlayer",
        index:index
    });
}


function renderPlayers(){

    const list=
        document.getElementById("playerList");

    if(!list) return;

    list.innerHTML="";

    players.forEach((name,index)=>{

        const div=document.createElement("div");

        div.className="player";

        const text=document.createElement("span");

        text.textContent=
            (index===currentPlayer ? "▶ " : "") +
            name;

        const remove=document.createElement("button");

        remove.textContent="Remove";

        remove.onclick=()=>{
            removePlayer(index);
        };

        div.appendChild(text);
        div.appendChild(remove);

        list.appendChild(div);
    });
}


/* =========================================================
   START / END
   ========================================================= */

function startGame(){

    if(players.length===0){

        alert("Add at least one player first.");

        page("players");

        return;
    }

    send({
        type:"start"
    });

    page("score");
}


function endGame(){

    send({
        type:"end"
    });

    page("home");
}


/* =========================================================
   SCORE BUTTONS
   ========================================================= */

function roll(value){

    send({
        type:"roll",
        value:value
    });
}


function strike(){

    send({
        type:"strike"
    });
}


function spare(){

    send({
        type:"spare"
    });
}


function previousPlayer(){

    send({
        type:"previous"
    });
}


function nextPlayer(){

    send({
        type:"next"
    });
}


function resetGame(){

    if(confirm("Reset the entire game?")){

        send({
            type:"reset"
        });

        page("home");
    }
}


/* =========================================================
   PINSETTER
   ========================================================= */

function renderPins(){

    const rack=
        document.getElementById("pins");

    if(!rack) return;

    rack.innerHTML="";

    const rows=[
        [0],
        [1,2],
        [3,4,5]
    ];

    rows.forEach(rowIndexes=>{

        const row=document.createElement("div");

        row.className="pin-row";

        rowIndexes.forEach(index=>{

            const pin=document.createElement("div");

            pin.className="pin";

            if(!pins[index]){
                pin.classList.add("down");
            }

            if(splitPins[index]){
                pin.classList.add("split");
            }

            pin.onclick=()=>{

                pins[index]=!pins[index];

                /*
                   Tap twice to mark a standing pin
                   as a split pin.
                */

                renderPins();
            };

            pin.oncontextmenu=(event)=>{

                event.preventDefault();

                splitPins[index]=!splitPins[index];

                renderPins();
            };

            row.appendChild(pin);
        });

        rack.appendChild(row);
    });
}


function rackPins(){

    pins=Array(6).fill(true);
    splitPins=Array(6).fill(false);

    renderPins();

    send({
        type:"rack"
    });
}


function clearPins(){

    pins=Array(6).fill(false);

    splitPins=Array(6).fill(false);

    renderPins();

    send({
        type:"clearPins"
    });
}


function submitPins(){

    send({
        type:"pinSubmit",
        pins:pins,
        splitPins:splitPins
    });
}


/* =========================================================
   BACKGROUNDS
   ========================================================= */

function background(value){

    send({
        type:"background",
        value:value
    });
}


/* =========================================================
   INITIAL
   ========================================================= */

renderPins();
renderPlayers();

</script>

</body>
</html>
